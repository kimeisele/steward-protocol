<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEWARD PROTOCOL - Auto-Generated Docs</title>
    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="steward-theme.css">
    <style>
        .container { display: flex; height: 100vh; }
        body { height: 100vh; overflow: hidden; }
        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .main-header .pulse {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .doc-item .status { font-size: 0.7rem; }
        .doc-item .status.available { color: #00ff88; }
        .doc-item .status.unavailable { color: #ff3366; }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>STEWARD DOCS</h1>
                <div class="subtitle">Auto-Generated Documentation</div>
            </div>
            <div class="doc-list" id="docList">
                <div class="loading">Loading docs</div>
            </div>
            <div class="sidebar-footer">
                <button class="refresh-btn" onclick="loadDocList()">Refresh Docs</button>
                <a href="/" class="back-link">Back to VIMANA</a>
            </div>
        </aside>
        <main class="main">
            <div class="main-header">
                <h2 id="docTitle">Select a document</h2>
                <span class="meta" id="docMeta"></span>
            </div>
            <div class="content" id="docContent">
                <p style="color: var(--color-text-dim); text-align: center; padding: 3rem;">
                    Select a document from the sidebar to view its contents.
                </p>
            </div>
        </main>
    </div>

    <script>
        let currentDoc = null;

        async function loadDocList() {
            const docList = document.getElementById('docList');
            docList.innerHTML = '<div class="loading">Loading docs</div>';

            try {
                const response = await fetch('/api/docs');
                const data = await response.json();

                if (data.status === 'success') {
                    docList.innerHTML = '';
                    data.docs.forEach(doc => {
                        const item = document.createElement('div');
                        item.className = `doc-item ${doc.available ? '' : 'unavailable'}`;
                        item.innerHTML = `
                            <span class="name">${doc.name.replace('.md', '')}</span>
                            <span class="status">${doc.available ? formatSize(doc.size) : 'N/A'}</span>
                        `;
                        if (doc.available) {
                            item.onclick = () => loadDoc(doc.name.replace('.md', ''));
                        }
                        docList.appendChild(item);
                    });

                    // Auto-load INDEX if available
                    const indexDoc = data.docs.find(d => d.name === 'INDEX.md' && d.available);
                    if (indexDoc && !currentDoc) {
                        loadDoc('INDEX');
                    }
                }
            } catch (error) {
                docList.innerHTML = `<div class="error">Failed to load: ${error.message}</div>`;
            }
        }

        async function loadDoc(docName) {
            const content = document.getElementById('docContent');
            const title = document.getElementById('docTitle');
            const meta = document.getElementById('docMeta');

            // Update active state
            document.querySelectorAll('.doc-item').forEach(item => {
                item.classList.remove('active');
                if (item.querySelector('.name').textContent === docName) {
                    item.classList.add('active');
                }
            });

            content.innerHTML = '<div class="loading">Loading</div>';
            title.textContent = docName + '.md';
            currentDoc = docName;

            try {
                const response = await fetch(`/api/docs/${docName}`);
                const data = await response.json();

                if (data.status === 'success') {
                    // Render markdown
                    content.innerHTML = marked.parse(data.content);
                    meta.textContent = formatSize(data.size);

                    // Make internal doc links work
                    content.querySelectorAll('a').forEach(link => {
                        const href = link.getAttribute('href');
                        if (href && href.endsWith('.md') && !href.startsWith('http')) {
                            link.onclick = (e) => {
                                e.preventDefault();
                                loadDoc(href.replace('.md', ''));
                            };
                        }
                    });
                } else {
                    content.innerHTML = `<div class="error">Error: ${data.detail || 'Unknown error'}</div>`;
                }
            } catch (error) {
                content.innerHTML = `<div class="error">Failed to load: ${error.message}</div>`;
            }
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // Initial load
        loadDocList();
    </script>
    <script src="theme-switcher.js"></script>
</body>
</html>
