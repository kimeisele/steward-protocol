<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEWARD PROTOCOL - Auto-Generated Docs</title>
    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-bg: #0a0e27;
            --color-sidebar: #0d1230;
            --color-text: #00ff88;
            --color-text-dim: #00aa55;
            --color-accent: #00ffff;
            --color-border: #00ff88;
            --color-link: #00ffff;
            --glow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        body {
            font-family: 'Courier New', monospace;
            background: var(--color-bg);
            color: #e0e0e0;
            line-height: 1.6;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: var(--color-sidebar);
            border-right: 2px solid var(--color-border);
            display: flex;
            flex-direction: column;
            box-shadow: var(--glow);
        }

        .sidebar-header {
            padding: 1rem;
            border-bottom: 1px solid var(--color-border);
            text-align: center;
        }

        .sidebar-header h1 {
            font-size: 1.2rem;
            color: var(--color-text);
            text-shadow: var(--glow);
        }

        .sidebar-header .subtitle {
            font-size: 0.75rem;
            color: var(--color-text-dim);
            margin-top: 0.25rem;
        }

        .doc-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }

        .doc-item {
            padding: 0.75rem 1rem;
            margin: 0.25rem 0;
            border: 1px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .doc-item:hover {
            background: rgba(0, 255, 136, 0.1);
            border-color: var(--color-border);
        }

        .doc-item.active {
            background: rgba(0, 255, 136, 0.2);
            border-color: var(--color-text);
            box-shadow: var(--glow);
        }

        .doc-item .name {
            color: var(--color-text);
            font-weight: bold;
        }

        .doc-item .status {
            font-size: 0.7rem;
            color: var(--color-text-dim);
        }

        .doc-item.unavailable {
            opacity: 0.5;
        }

        .doc-item.unavailable .name {
            color: #666;
        }

        .sidebar-footer {
            padding: 0.75rem;
            border-top: 1px solid var(--color-border);
            text-align: center;
        }

        .refresh-btn {
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid var(--color-border);
            color: var(--color-text);
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-radius: 4px;
            font-family: monospace;
            width: 100%;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background: rgba(0, 255, 136, 0.4);
            box-shadow: var(--glow);
        }

        .back-link {
            display: block;
            margin-top: 0.5rem;
            color: var(--color-accent);
            text-decoration: none;
            font-size: 0.8rem;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* Main Content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .main-header {
            padding: 1rem;
            border-bottom: 1px solid var(--color-border);
            background: var(--color-sidebar);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .main-header h2 {
            color: var(--color-text);
            font-size: 1.1rem;
        }

        .main-header .meta {
            color: var(--color-text-dim);
            font-size: 0.8rem;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
        }

        /* Markdown Styles */
        .content h1, .content h2, .content h3, .content h4 {
            color: var(--color-text);
            margin: 1.5rem 0 1rem 0;
            border-bottom: 1px solid rgba(0, 255, 136, 0.3);
            padding-bottom: 0.5rem;
        }

        .content h1 { font-size: 1.8rem; }
        .content h2 { font-size: 1.4rem; }
        .content h3 { font-size: 1.2rem; }

        .content p {
            margin: 1rem 0;
        }

        .content a {
            color: var(--color-link);
            text-decoration: none;
        }

        .content a:hover {
            text-decoration: underline;
        }

        .content code {
            background: rgba(0, 255, 136, 0.1);
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            color: var(--color-accent);
        }

        .content pre {
            background: #0d1230;
            padding: 1rem;
            border-radius: 4px;
            overflow-x: auto;
            border: 1px solid var(--color-border);
            margin: 1rem 0;
        }

        .content pre code {
            background: none;
            padding: 0;
        }

        .content blockquote {
            border-left: 3px solid var(--color-text);
            padding-left: 1rem;
            margin: 1rem 0;
            color: var(--color-text-dim);
            background: rgba(0, 255, 136, 0.05);
            padding: 0.5rem 1rem;
        }

        .content ul, .content ol {
            margin: 1rem 0;
            padding-left: 2rem;
        }

        .content li {
            margin: 0.5rem 0;
        }

        .content table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }

        .content th, .content td {
            border: 1px solid var(--color-border);
            padding: 0.5rem;
            text-align: left;
        }

        .content th {
            background: rgba(0, 255, 136, 0.1);
            color: var(--color-text);
        }

        .content hr {
            border: none;
            border-top: 1px solid var(--color-border);
            margin: 2rem 0;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--color-text-dim);
        }

        .loading::after {
            content: '';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        /* Error State */
        .error {
            text-align: center;
            padding: 3rem;
            color: #ff3366;
        }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>STEWARD DOCS</h1>
                <div class="subtitle">Auto-Generated Documentation</div>
            </div>
            <div class="doc-list" id="docList">
                <div class="loading">Loading docs</div>
            </div>
            <div class="sidebar-footer">
                <button class="refresh-btn" onclick="loadDocList()">Refresh Docs</button>
                <a href="/" class="back-link">Back to VIMANA</a>
            </div>
        </aside>
        <main class="main">
            <div class="main-header">
                <h2 id="docTitle">Select a document</h2>
                <span class="meta" id="docMeta"></span>
            </div>
            <div class="content" id="docContent">
                <p style="color: var(--color-text-dim); text-align: center; padding: 3rem;">
                    Select a document from the sidebar to view its contents.
                </p>
            </div>
        </main>
    </div>

    <script>
        let currentDoc = null;

        async function loadDocList() {
            const docList = document.getElementById('docList');
            docList.innerHTML = '<div class="loading">Loading docs</div>';

            try {
                const response = await fetch('/api/docs');
                const data = await response.json();

                if (data.status === 'success') {
                    docList.innerHTML = '';
                    data.docs.forEach(doc => {
                        const item = document.createElement('div');
                        item.className = `doc-item ${doc.available ? '' : 'unavailable'}`;
                        item.innerHTML = `
                            <span class="name">${doc.name.replace('.md', '')}</span>
                            <span class="status">${doc.available ? formatSize(doc.size) : 'N/A'}</span>
                        `;
                        if (doc.available) {
                            item.onclick = () => loadDoc(doc.name.replace('.md', ''));
                        }
                        docList.appendChild(item);
                    });

                    // Auto-load INDEX if available
                    const indexDoc = data.docs.find(d => d.name === 'INDEX.md' && d.available);
                    if (indexDoc && !currentDoc) {
                        loadDoc('INDEX');
                    }
                }
            } catch (error) {
                docList.innerHTML = `<div class="error">Failed to load: ${error.message}</div>`;
            }
        }

        async function loadDoc(docName) {
            const content = document.getElementById('docContent');
            const title = document.getElementById('docTitle');
            const meta = document.getElementById('docMeta');

            // Update active state
            document.querySelectorAll('.doc-item').forEach(item => {
                item.classList.remove('active');
                if (item.querySelector('.name').textContent === docName) {
                    item.classList.add('active');
                }
            });

            content.innerHTML = '<div class="loading">Loading</div>';
            title.textContent = docName + '.md';
            currentDoc = docName;

            try {
                const response = await fetch(`/api/docs/${docName}`);
                const data = await response.json();

                if (data.status === 'success') {
                    // Render markdown
                    content.innerHTML = marked.parse(data.content);
                    meta.textContent = formatSize(data.size);

                    // Make internal doc links work
                    content.querySelectorAll('a').forEach(link => {
                        const href = link.getAttribute('href');
                        if (href && href.endsWith('.md') && !href.startsWith('http')) {
                            link.onclick = (e) => {
                                e.preventDefault();
                                loadDoc(href.replace('.md', ''));
                            };
                        }
                    });
                } else {
                    content.innerHTML = `<div class="error">Error: ${data.detail || 'Unknown error'}</div>`;
                }
            } catch (error) {
                content.innerHTML = `<div class="error">Failed to load: ${error.message}</div>`;
            }
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // Initial load
        loadDocList();
    </script>
</body>
</html>
