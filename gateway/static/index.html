<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEWARD Gateway</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        h1 { color: #7dd3fc; margin-bottom: 0.5rem; }
        .subtitle { color: #666; margin-bottom: 2rem; }

        /* Chat Box */
        .chat-box {
            width: 100%;
            max-width: 600px;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 2rem;
        }
        .chat-input {
            display: flex;
            gap: 0.5rem;
        }
        .chat-input input {
            flex: 1;
            padding: 0.75rem;
            background: #0a0a0f;
            border: 1px solid #333;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 1rem;
        }
        .chat-input input:focus { outline: none; border-color: #7dd3fc; }
        .chat-input button {
            padding: 0.75rem 1.5rem;
            background: #7dd3fc;
            color: #000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        .chat-input button:hover { background: #5bb8e8; }
        .chat-input button:disabled { background: #444; cursor: wait; }
        #response {
            margin-top: 1rem;
            padding: 1rem;
            background: #0a0a0f;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
            display: none;
            max-height: 300px;
            overflow-y: auto;
        }
        #status { font-size: 0.8rem; color: #666; margin-top: 0.5rem; }

        /* Links */
        .links {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .links a {
            color: #7dd3fc;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border: 1px solid #333;
            border-radius: 4px;
        }
        .links a:hover { background: #111; }

        footer {
            margin-top: auto;
            padding-top: 2rem;
            color: #444;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <h1>STEWARD</h1>
    <p class="subtitle">Agent Operating System Gateway</p>

    <div class="chat-box">
        <div class="chat-input">
            <input type="text" id="msg" placeholder="Ask the Steward..." autocomplete="off">
            <button id="send">Send</button>
        </div>
        <div id="response"></div>
        <div id="status"></div>
    </div>

    <div class="links">
        <a href="/health">Health</a>
        <a href="/api/agents">Agents</a>
        <a href="/api/docs">Docs</a>
        <a href="https://github.com/kimeisele/steward-protocol">GitHub</a>
    </div>

    <footer>STEWARD Protocol</footer>

    <script>
        const msg = document.getElementById('msg');
        const send = document.getElementById('send');
        const response = document.getElementById('response');
        const status = document.getElementById('status');

        async function chat() {
            const text = msg.value.trim();
            if (!text) return;

            send.disabled = true;
            status.textContent = 'Sending...';
            response.style.display = 'none';

            try {
                const res = await fetch('/v1/public-chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: text})
                });
                const data = await res.json();

                if (res.ok && data.data) {
                    response.style.display = 'block';
                    // Extract the summary if available
                    const summary = data.data?.data?.summary || JSON.stringify(data.data, null, 2);
                    response.textContent = summary;
                    status.textContent = '';
                    msg.value = '';
                } else {
                    status.textContent = 'Error: ' + (data.detail || res.status);
                }
            } catch (e) {
                status.textContent = 'Error: ' + e.message;
            }
            send.disabled = false;
        }

        send.onclick = chat;
        msg.onkeypress = (e) => { if (e.key === 'Enter') chat(); };
    </script>
</body>
</html>
