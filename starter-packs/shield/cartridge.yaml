meta:
  id: "agent.starter.shield"
  name: "SHIELD Agent"
  version: "1.0.0"
  author: "Steward Protocol"
  description: "Security agent for auditing and governance enforcement"

agent:
  domain: "SECURITY"
  class: "Paladin"
  role: "Auditor"
  capabilities:
    - "audit_repository"
    - "validate_config"

dependencies: []

config:
  governance:
    level: "strict"
  audit:
    strictness: "standard"
    scope:
      - "code"
      - "configs"
      - "dependencies"
