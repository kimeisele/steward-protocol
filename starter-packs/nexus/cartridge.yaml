meta:
  id: "agent.starter.nexus"
  name: "NEXUS Agent"
  version: "1.0.0"
  author: "Steward Protocol"
  description: "Generalist agent for connectivity and coordination"

agent:
  domain: "COORDINATION"
  class: "Diplomat"
  role: "Generalist"
  capabilities:
    - "ping_federation"
    - "verify_identity"
    - "delegate_task"

dependencies: []

config:
  governance:
    level: "standard"
  federation:
    auto_connect: true
