meta:
  id: "agent.starter.scope"
  name: "SCOPE Agent"
  version: "1.0.0"
  author: "Steward Protocol"
  description: "Research agent for data analysis and intelligence gathering"

agent:
  domain: "RESEARCH"
  class: "Wizard"
  role: "Researcher"
  capabilities:
    - "research_topic"
    - "generate_report"

dependencies:
  - "tavily-python"

config:
  governance:
    level: "standard"
  research:
    depth: "standard"
    sources:
      - "news"
      - "academic"
      - "social"
