meta:
  id: "agent.starter.spark"
  name: "SPARK Agent"
  version: "1.0.0"
  author: "Steward Protocol"
  description: "Creative agent for content generation and social engagement"

agent:
  domain: "MEDIA"
  class: "Bard"
  role: "Content Creator"
  capabilities:
    - "generate_tweet"
    - "plan_campaign"

dependencies:
  - "openai"

config:
  governance:
    level: "standard"
  content:
    tone: "enthusiastic"
    platforms:
      - "twitter"
      - "reddit"
