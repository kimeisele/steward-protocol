# System Agents Configuration
# Wiring of agent names to implementation classes
# Extracted from phoenix.yaml - now auto-discovered via Phoenix Sections

system_agents:
  # Discovery & Exploration
  - name: "DiscoveryAgent"
    class: "vibe_core.cartridges.system.discoverer.agent:Discoverer"
    protocol: "VibeAgent"
    enabled: true

