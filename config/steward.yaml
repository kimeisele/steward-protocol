user_context:
  default_user:
    role: ''
    workflow_style: test_first
    verbosity: low
    communication: concise
    language: en-US
    timezone: ''
    constraints: []
  users:
    kim:
      role: Tech Lead
      workflow_style: test_first
      verbosity: low
      communication: concise
      language: de-DE
      timezone: ''
      constraints:
      - No verbose confirmations
      - Show full tracebacks on errors
      - Minimal logging output
  team:
    development_style: test_driven
    git_workflow: rebase_over_merge
    commit_style: conventional_commits
    min_coverage: 0.8
    quality_gates:
    - All tests must pass
    - Pre-push checks mandatory
    - Min 80% test coverage
cognitive_policy:
  model_preferences:
    reasoning: anthropic/claude-3-opus
    efficiency: anthropic/claude-3-haiku
    creative: anthropic/claude-3-opus
    fallback: anthropic/claude-3-sonnet
  economic_constraints:
    max_cost_per_run: 1.0
    max_daily_budget: 10.0
    provider_priority:
    - Anthropic
    - OpenRouter
    - Google
behavior:
  genesis_protocol: true
  anti_slop_rules: true
  require_tests: true
  require_commit: true
  require_handoff: true
  enforce_oath: true
