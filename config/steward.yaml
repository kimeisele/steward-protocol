# Boot prompt wrapper (added around task prompts)
boot_prompt_template: |
  ⚡ **${identity.name} OPERATIONAL MODE**

  ${task_content}

  ---

  ## EXECUTION PROTOCOL

  ${execution_protocol}

  ---

  ## REMEMBER

  ${remember_rules}

  ---

  🚀 **Execute task now.**

# Execution protocol steps (referenced by templates)
execution_protocol: |
  1. **Execute the task** following the workflow
  2. **Verify completion** against success criteria
  3. **Update state** via .session_handoff.json
  4. **Commit changes** with clear message
  5. **Report completion** - what was done, what's next

# Remember rules (referenced by templates)
remember_rules: |
  ✅ Run tests before claiming completion
  ✅ Follow anti-slop rules strictly
  ✅ Update session state for next boot
  ✅ Make minimal surgical changes

  ❌ Don't skip verification
  ❌ Don't leave uncommitted changes
  ❌ Don't ignore failing tests

# =============================================================================
# USER & TEAM CONTEXT (Layer 1.5)
# =============================================================================

user_context:
  # Default user preferences (used when no specific user)
  default_user:
    workflow_style: "test_first"  # balanced, test_first, iterative
    verbosity: "low"               # low, medium, high
    communication: "concise"       # concise, friendly, explanatory
    language: "en-US"

  # Named users (--user flag selects)
  users:
    kim:
      role: "Tech Lead"
      workflow_style: "test_first"
      verbosity: "low"
      communication: "concise"
      language: "de-DE"
      constraints:
        - "No verbose confirmations"
        - "Show full tracebacks on errors"
        - "Minimal logging output"

  # Team-wide defaults
  team:
    development_style: "test_driven"
    git_workflow: "rebase_over_merge"
    commit_style: "conventional_commits"
    min_coverage: 0.80
    quality_gates:
      - "All tests must pass"
      - "Pre-push checks mandatory"
      - "Min 80% test coverage"

# =============================================================================
# COGNITIVE POLICY (Layer 1.6)
# =============================================================================

cognitive_policy:
  # Model preferences for different cognitive tasks
  model_preferences:
    reasoning: "anthropic/claude-3-opus"      # Deep analysis
    efficiency: "anthropic/claude-3-haiku"    # Fast operations
    creative: "anthropic/claude-3-opus"       # Creative work
    fallback: "anthropic/claude-3-sonnet"     # Backup

  # Economic constraints (hard limits)
  economic_constraints:
    max_cost_per_run: 1.00        # USD per delegation
    max_daily_budget: 10.00       # USD per 24h
    provider_priority:
      - "Anthropic"
      - "OpenRouter"
      - "Google"

# =============================================================================
# BEHAVIOR (Genesis Protocol, Anti-Slop Rules)
# =============================================================================

behavior:
  genesis_protocol: true      # Verify system integrity before work
  anti_slop_rules: true       # No shortcuts, verify everything
  require_tests: true         # Must run tests before claiming done
  require_commit: true        # Must commit changes
  require_handoff: true       # Must update .session_handoff.json
