prompt_dir: knowledge/prompts
auto_reload: true
prompts:
  system_boot:
    file: system_boot.j2
    description: STEWARD Protocol system initialization prompt
    category: system
    model_hint: claude-3-sonnet
    max_tokens: 4096
  operator_system:
    file: operator_system.j2
    description: Agent City OS operator system prompt
    category: system
    model_hint: claude-3-sonnet
  context_extraction:
    file: context_extraction.j2
    description: Extract context from user input
    category: extraction
    temperature: 0.3
  parameter_extraction:
    file: parameter_extraction.j2
    description: Extract structured parameters from user request
    category: extraction
    temperature: 0.1
  agent_routing:
    file: agent_routing.j2
    description: Route request to appropriate agent
    category: routing
    temperature: 0.2
  degradation_fallback:
    file: degradation_fallback.j2
    description: Fallback prompt for graceful degradation (German)
    category: fallback
    model_hint: local
  intent_classifier:
    file: intent_classifier.j2
    description: Classify user intent for routing
    category: routing
    max_tokens: 100
    temperature: 0.1
  error_recovery:
    file: error_recovery.j2
    description: Prompt for error recovery suggestions
    category: error
    temperature: 0.5
  task_summary:
    file: task_summary.j2
    description: Summarize task results for user
    category: response
    temperature: 0.3
  code_generation:
    file: code_generation.j2
    description: Generate code based on specification
    category: generation
    model_hint: claude-3-opus
    max_tokens: 8192
    temperature: 0.2
  doc_generation:
    file: doc_generation.j2
    description: Generate documentation for code
    category: generation
    max_tokens: 4096
    temperature: 0.4
