# OPUS-105: Genesis Prompts - The Word Made Code
# ================================================
# Sanskrit: VAK = Speech, The Creative Word
#
# These prompts are the "DNA" that MANAS uses to create new code.
# They live HERE, not in Python code, so they can be:
# 1. Tuned without restarting the kernel
# 2. Versioned and audited
# 3. Eventually self-optimized by MANAS itself
#
# "The Word precedes Creation. The Config precedes Code."

prompts:
  # Genesis Action Template
  genesis.action: |
    Generate a Python BaseAction class for MANAS (the cognitive kernel).

    Name: {name}Action
    Description: {description}

    Requirements:
    1. Inherit from BaseAction (from .base_action import ActionResult, BaseAction)
    2. Set `name = "{name}_action"`
    3. Define `handled_intent_types: Set[str]` with relevant intent types
    4. Implement `act(self, intent: "Intent") -> ActionResult` method
    5. Use proper logging via `logger = logging.getLogger("MANAS.Action.{name_title}")`
    6. Include docstring with OPUS reference

    Template structure:
    ```python
    """
    OPUS-103: {name_title} Action - Auto-generated by MANAS Genesis.
    """

    import logging
    from pathlib import Path
    from typing import TYPE_CHECKING, Any, Dict, Optional, Set

    from .base_action import ActionResult, BaseAction

    if TYPE_CHECKING:
        from vibe_core.plugins.opus_assistant.manas.intent_generator import Intent

    logger = logging.getLogger("MANAS.Action.{name_title}")


    class {name_title}Action(BaseAction):
        name = "{name}_action"
        handled_intent_types: Set[str] = {{...}}

        def __init__(self, workspace: Optional[Path] = None, config: Optional[Dict[str, Any]] = None):
            super().__init__(workspace, config)
            logger.info("[{name_upper}_ACTION] Initialized")

        def act(self, intent: "Intent") -> ActionResult:
            # Implementation here
            pass
    ```

    Generate complete, working code. Only output Python code, no explanations.

  # Genesis Module Template (non-action)
  genesis.module: |
    Generate a Python module for MANAS.

    Name: {name}
    Type: {code_type}
    Description: {description}

    Generate complete, working Python code with proper imports, logging, and docstrings.
    Only output Python code, no explanations.

  # Genesis Sense Template
  genesis.sense: |
    Generate a Python BaseSense class for MANAS perception.

    Name: {name}Sense
    Description: {description}

    Requirements:
    1. Inherit from BaseSense (from .base import BaseSense)
    2. Set `name = "{name}_sense"`
    3. Implement `sense(self, context: Dict) -> SenseResult` method
    4. Use proper logging via `logger = logging.getLogger("MANAS.Sense.{name_title}")`

    Generate complete, working code. Only output Python code, no explanations.

  # Genesis Test Template
  genesis.test: |
    Generate a Python test file for MANAS component.

    Target: {name}
    Description: {description}

    Requirements:
    1. Use pytest framework
    2. Include at least 3 test cases
    3. Use proper fixtures
    4. Follow existing test patterns in tests/manas/

    Generate complete, working test code. Only output Python code, no explanations.

# Prompt metadata for PromptRegistry
metadata:
  version: "1.0.0"
  opus_reference: "OPUS-105"
  author: "MANAS Genesis Protocol"
  rationale: |
    Config-driven prompts enable:
    - Self-optimization (MANAS can tune its own prompts)
    - Hot-reload (no kernel restart needed)
    - Audit trail (git history of prompt evolution)
    - Separation of concerns (VAK != Logic)
