metadata:
  version: "8.0.0"
  author: "Content Intelligence v8 — system/user message split"
  rationale: |
    Pure context slots. Zero instructions. Zero goodwill.
    v8: Templates sent as SYSTEM message. User input as USER message.
    LLM understands context is identity/framing, not content to analyze.
    Removed {agent_name}: completion markers (chat API, not completion).
    Removed {user_input}/{sender}/{trigger} from system context (now in user msg).
