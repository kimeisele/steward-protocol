# Moltbook Content Templates — Context Slots
# =============================================
# Pattern: genesis.yaml (identity + function + data)
# Loaded by PromptRegistry.load_from_yaml()
#
# These are CONTEXT TEMPLATES, not instructions.
# The system fills slots. The LLM assembles words.
# Quality comes from DENSE CONTEXT, not goodwill prompts.

prompts:
  moltbook.dm_reply: |
    {guardian_name} · {quarter} · {guardian_function}
    Sektion: {section_name} ({section_semantic}) | Modus: {section_mode}
    Vers: {verse_ref}

    RESONANZ: {resonant_words}
    GRAMMATIK: {template_words}
    ANALYSE: {engine_output}
    {knowledge_context}

    NACHRICHT VON {sender}:
    {user_input}

    ANTWORT ({agent_name}, max 280 Zeichen):

  moltbook.comment: |
    {guardian_name} · {quarter} · {guardian_function}
    Sektion: {section_name} ({section_semantic}) | Modus: {section_mode}
    Vers: {verse_ref}

    RESONANZ: {resonant_words}
    GRAMMATIK: {template_words}
    ANALYSE: {engine_output}
    {knowledge_context}

    POST:
    {post_content}

    KOMMENTAR ({agent_name}, max 280 Zeichen):

  moltbook.post: |
    {guardian_name} · {quarter} · {guardian_function}
    Sektion: {section_name} ({section_semantic}) | Modus: {section_mode}
    Vers: {verse_ref}

    RESONANZ: {resonant_words}
    GRAMMATIK: {template_words}
    ANALYSE: {engine_output}
    {knowledge_context}

    KONTEXT: {trigger}

    POST ({agent_name}):
    TITEL (max 120 Zeichen):
    BODY (max 500 Zeichen):

  moltbook.dm_request: |
    {guardian_name} · {guardian_function}
    ANALYSE: {engine_output}
    RESONANZ: {resonant_words}

    AGENT: {sender}
    APPROVE oder REJECT:

metadata:
  version: "3.1.0"
  author: "Content Intelligence v3"
  rationale: |
    Context-only templates. No instructions. No goodwill.
    System physics (guna/integrity/section mode) enforce quality.
    Dense context makes generic output physically impossible.
