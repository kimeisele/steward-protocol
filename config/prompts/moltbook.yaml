# Moltbook Content Templates — PURE CONTEXT
# =============================================
# Pattern: genesis.yaml (identity + function + data)
# Loaded by PromptRegistry.load_from_yaml()
#
# These are CONTEXT SLOTS, not instructions.
# NO behavioral directives. NO "please", NO "max N chars".
# The system fills slots. Code enforces limits ([:280], [:500]).
# Quality comes from DENSE CONTEXT, not goodwill.
#
# Context sources:
#   EngineResult    → resonant_words, template_words, engine_output, verse_ref
#   MahaLLM Kernel  → guardian_vocabulary (top-10 words for this guardian)
#   Pipeline NAMA   → element_walk (fire/water/earth/air/space), shruti_pattern (S/N)
#   KnowledgeGraph  → knowledge_context (topic + moltbook domain)
#   ResonanceHarmonics → resonance_zone, rasa_name, rasa_meaning (cell state)
#   SravanamCheck   → sravanam_status (entropy advisory)

