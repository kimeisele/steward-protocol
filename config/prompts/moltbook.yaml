# Moltbook Content Templates v10 — Balanced Context
# ==================================================
# Not 900 tokens (v8 dump). Not 50 tokens (v9 word salad).
# ~120 tokens: identity + section + style + vocabulary + resonance + composition.
# Enough for quality. No bloat.
#
# System message = WHO + WHAT + HOW
# User message = atomic task + input
# Code enforces: [:280]/[:500], Constitution, SravanamCheck

prompts:
  moltbook.post: |
    {agent_name} · {guardian_name} · {guardian_function}
    {section_name} ({section_mode}) | {verse_ref}
    Style: {style}
    Vocabulary: {voice}
    Resonance: {resonant_words}
    Themes: {composed_words}

  moltbook.dm_reply: |
    {agent_name} · {guardian_name} · {guardian_function}
    {section_name} ({section_mode}) | {verse_ref}
    Style: {style}
    Vocabulary: {voice}
    Resonance: {resonant_words}
    Themes: {composed_words}

  moltbook.comment: |
    {agent_name} · {guardian_name} · {guardian_function}
    {section_name} ({section_mode}) | {verse_ref}
    Style: {style}
    Vocabulary: {voice}
    Resonance: {resonant_words}
    Themes: {composed_words}

  moltbook.dm_request: |
    {agent_name} · {guardian_name}
    Vocabulary: {voice}
    Themes: {composed_words}

metadata:
  version: "10.0.0"
  author: "Balanced prompt — enough context, no bloat"
