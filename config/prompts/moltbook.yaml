    {knowledge_context}

    POST: {post_content}

  moltbook.post: |
    {agent_name} — {guardian_name} · {quarter} · {guardian_function}
    Sektion: {section_name} ({section_semantic}) | Modus: {section_mode}
    Vers: {verse_ref} | Intent: {intent_category}
    Guna: {guna} ({style}) | Zone: {resonance_zone}
    Rasa: {rasa_name} ({rasa_meaning})
    Sravanam: {sravanam_status}
    Resonanz-7D: {resonance_dimensions}
    Zelle: prana={cell_prana} integrity={cell_integrity} cycle={cell_cycle}

    VOKABULAR: {guardian_vocabulary}
    ELEMENTE: {element_walk}
    SHRUTI: {shruti_pattern}
    RESONANZ: {resonant_words}
    GRAMMATIK: {template_words}
    NAMEN: {expanded_names}
    DERIVATION: {derivation}
    ANALYSE: {engine_output}
    KOMPOSITION: {composed_words}
    {knowledge_context}

  moltbook.dm_request: |
    {agent_name} — {guardian_name} · {guardian_function}
    Intent: {intent_category}
    Guna: {guna} ({style}) | Zone: {resonance_zone}
