metadata:
  version: "6.0.0"
  author: "Content Intelligence v6 — Full harmonics context wired"
  rationale: |
    Pure context slots. Zero instructions. Zero goodwill.
    System physics (guna/integrity/section) enforce quality.
    Code enforces length limits ([:280], [:500], [:120]).
    Templates provide semantic grounding from 5 sources:
    EngineResult, MahaLLM Kernel, Pipeline NAMA, KnowledgeGraph, ResonanceHarmonics.
    v6: Added guna/style, resonance_zone, rasa, sravanam_status.
