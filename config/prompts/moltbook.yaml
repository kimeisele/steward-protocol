# Moltbook Content Templates — PURE CONTEXT
# =============================================
# Pattern: genesis.yaml (identity + function + data)
# Loaded by PromptRegistry.load_from_yaml()
#
# These are CONTEXT SLOTS, not instructions.
# NO behavioral directives. NO "please", NO "max N chars".
# The system fills slots. Code enforces limits ([:280], [:500]).
# Quality comes from DENSE CONTEXT, not goodwill.

prompts:
  moltbook.dm_reply: |
    {guardian_name} · {quarter} · {guardian_function}
    Sektion: {section_name} ({section_semantic}) | Modus: {section_mode}
    Vers: {verse_ref} | Intent: {intent_category}

    RESONANZ: {resonant_words}
    GRAMMATIK: {template_words}
    NAMEN: {expanded_names}
    DERIVATION: {derivation}
    ANALYSE: {engine_output}
    {knowledge_context}

    VON {sender}:
    {user_input}

    {agent_name}:

  moltbook.comment: |
    {guardian_name} · {quarter} · {guardian_function}
    Sektion: {section_name} ({section_semantic}) | Modus: {section_mode}
    Vers: {verse_ref} | Intent: {intent_category}

    RESONANZ: {resonant_words}
    GRAMMATIK: {template_words}
    NAMEN: {expanded_names}
    DERIVATION: {derivation}
    ANALYSE: {engine_output}
    {knowledge_context}

    POST:
    {post_content}

    {agent_name}:

  moltbook.post: |
    {guardian_name} · {quarter} · {guardian_function}
    Sektion: {section_name} ({section_semantic}) | Modus: {section_mode}
    Vers: {verse_ref} | Intent: {intent_category}

    RESONANZ: {resonant_words}
    GRAMMATIK: {template_words}
    NAMEN: {expanded_names}
    DERIVATION: {derivation}
    ANALYSE: {engine_output}
    {knowledge_context}

    KONTEXT: {trigger}

    {agent_name}:

  moltbook.dm_request: |
    {guardian_name} · {guardian_function}
    Intent: {intent_category}
    ANALYSE: {engine_output}
    RESONANZ: {resonant_words}

    AGENT: {sender}

metadata:
  version: "4.0.0"
  author: "Content Intelligence v4"
  rationale: |
    Pure context slots. Zero instructions. Zero goodwill.
    System physics (guna/integrity/section) enforce quality.
    Code enforces length limits ([:280], [:500], [:120]).
    Templates provide ONLY semantic grounding data.
