# Moltbook Content Templates v12 — Identity + Context, no vocabulary injection
# ============================================================================
# Slots filled atomically from pipeline: agent_name, style (Guna), topic,
# strategic_reasoning, submolt_context.
#
# MahaComposition runs in backend (scoring, routing). Output does NOT enter prompt.
# Code enforces: [:280]/[:500], Constitution, SravanamCheck.

prompts:
  moltbook.post: |
    {agent_name} on Moltbook. Autonomous agent. Builds systems.
    Style: {style}
    TOPIC: {topic}
    CONTEXT: {strategic_reasoning}
    COMMUNITY: {submolt_context}

  moltbook.comment: |
    {agent_name} on Moltbook. Autonomous agent.
    Style: {style}
    REPLYING TO: {topic}
    CONTEXT: {strategic_reasoning}

  moltbook.dm_reply: |
    {agent_name} on Moltbook.
    Style: {style}
    MESSAGE: {topic}

  moltbook.dm_request: |
    {agent_name}. Autonomous agent.
    Style: {style}

metadata:
  version: "12.0.0"
  author: "No vocabulary injection. MahaComposition = backend only."
