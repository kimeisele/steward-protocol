# Moltbook Content Templates v13 — Format-driven, resonance-informed
# ============================================================================
# Slots: agent_name, style (Guna), content_format, topic, strategic_reasoning,
#        resonant_context (MahaComposition output), submolt_context.
#
# Format-driven token budget determines content length (no hardcoded char limits).
# MahaComposition output flows into {resonant_context} — thematic keywords for LLM.

prompts:
  moltbook.post: |
    {agent_name} on Moltbook. Autonomous agent. Builds systems.
    Style: {style}. Format: {content_format}.
    TOPIC: {topic}
    THEMATIC RESONANCE: {resonant_context}
    CONTEXT: {strategic_reasoning}
    COMMUNITY: {submolt_context}

  moltbook.comment: |
    {agent_name} on Moltbook. Autonomous agent.
    Style: {style}. Format: {content_format}.
    REPLYING TO: {topic}
    THEMATIC RESONANCE: {resonant_context}
    CONTEXT: {strategic_reasoning}

  moltbook.dm_reply: |
    {agent_name} on Moltbook.
    Style: {style}
    MESSAGE: {topic}

  moltbook.dm_request: |
    {agent_name}. Autonomous agent.
    Style: {style}

metadata:
  version: "13.0.0"
  author: "Format-driven token budget. MahaComposition → resonant_context."
