# Quality Configuration - The immortal CI/lint settings
#
# This file survives container wipes. It IS the source of truth for:
# - Lint rules (what errors to catch)
# - Format rules (how code should look)
# - Test configuration (how to run tests)
# - CI workflows (what checks to run)
#
# Agents and kernel can read this to understand quality requirements.
# Pre-commit hooks can be GENERATED from this config.

# =============================================================================
# LINTING (ruff)
# =============================================================================
lint:
  tool: ruff
  # Critical rules - CI FAILS on these
  critical_rules:
    - E9    # Runtime errors (syntax errors, etc.)
    - F63   # Invalid print syntax
    - F7    # Syntax errors in assertions
    - F82   # Undefined names
  # Informational rules - shown but don't fail CI
  info_rules:
    - E     # pycodestyle errors
    - F     # pyflakes
    - I     # isort
    - W     # pycodestyle warnings
  # Paths to check
  paths:
    - vibe_core
    - steward
    - scripts
  # Paths to exclude
  exclude:
    - .git
    - .venv
    - __pycache__
    - data
    - archive
    - node_modules
  line_length: 120

# =============================================================================
# FORMATTING (ruff format)
# =============================================================================
format:
  tool: ruff
  auto_fix: true
  paths:
    - vibe_core
    - steward
    - scripts
  line_length: 120
  quote_style: double

# =============================================================================
# TESTING (pytest) - With Profiles for Speed & Transparency
# =============================================================================
# Profiles allow kernel/agents to run tests intelligently:
#   pytest $(config.quality.get_pytest_args("fast"))
#   pytest $(config.quality.get_pytest_args("ci"))
# =============================================================================
test:
  tool: pytest
  paths:
    - tests
  default_profile: fast  # Default for local dev
  timeout: 300  # Global timeout (profiles can override)
  workers: 0    # Global workers (0 = auto)
  coverage_threshold: 0  # Global coverage threshold

  # Available test profiles
  profiles:
    # FAST - Quick feedback during development
    fast:
      name: fast
      description: "Quick feedback during development (excludes slow tests)"
      exclude_markers:
        - slow
        - integration
        - e2e
      workers: 0  # auto-parallel
      fail_fast: true
      timeout: 30
      verbose: false
      show_durations: 5

    # FULL - Complete test suite with coverage
    full:
      name: full
      description: "Complete test suite with coverage analysis"
      workers: 0
      fail_fast: false
      timeout: 300
      coverage: true
      coverage_threshold: 0
      verbose: true
      show_durations: 10

    # CI - CI/CD optimized (strict, parallel, fail-fast)
    ci:
      name: ci
      description: "CI-optimized: parallel, fail-fast, timeout enforced"
      workers: 0
      fail_fast: true
      timeout: 300
      verbose: false
      show_durations: 10
      extra_args:
        - "--tb=short"

    # SMOKE - Quick sanity check
    smoke:
      name: smoke
      description: "Quick sanity check (smoke-tagged tests only)"
      markers:
        - smoke
      workers: 0
      fail_fast: true
      timeout: 10
      verbose: false

    # UNIT - Unit tests only
    unit:
      name: unit
      description: "Unit tests only (fast, isolated)"
      markers:
        - unit
      exclude_markers:
        - integration
        - e2e
        - slow
      workers: 0
      fail_fast: false
      timeout: 30
      show_durations: 5

    # INTEGRATION - Integration tests only
    integration:
      name: integration
      description: "Integration tests only (sequential for stability)"
      markers:
        - integration
      workers: 1  # sequential for stability
      fail_fast: false
      timeout: 120
      verbose: true

# =============================================================================
# CI WORKFLOWS
# =============================================================================
ci:
  workflows:
    - name: Lint & Format Check
      file: steward-ci.yml
      triggers:
        - push
        - pull_request
      required: true

    - name: Integration Tests
      file: integration-tests.yml
      triggers:
        - push
        - pull_request
      required: true

    - name: Scheduled Agents
      file: scheduled-agents.yml
      triggers:
        - schedule
      required: false

  protected_branches:
    - main
    - master

  require_status_checks: true

# =============================================================================
# PRE-COMMIT GUARDS (read by .githooks/pre-commit)
# =============================================================================
guards:
  # Paths to scan for agent violations
  agent_paths:
    - vibe_core/cartridges/system
    - vibe_core/cartridges/agent_city

  # Guard 1: Block requirements.txt in agent directories
  block_requirements_txt: true

  # Guard 2: Block direct Path("data/...") calls
  block_hardcoded_data_paths: true

  # Guard 3: Warn hardcoded paths in __init__
  warn_init_hardcoded_paths: true

  # Guard 4: Ruff auto-format + critical error check
  ruff_autoformat: true
  ruff_critical_check: true

# =============================================================================
# ENFORCEMENT
# =============================================================================
enforce_on_commit: true
enforce_on_push: true
block_on_failure: true
