lint:
  tool: ruff
  critical_rules:
  - E9
  - F63
  - F7
  - F82
  info_rules:
  - E
  - F
  - I
  - W
  paths:
  - vibe_core
  - steward
  - scripts
  exclude:
  - .git
  - .venv
  - __pycache__
  - data
  - archive
  - node_modules
  line_length: 120
format:
  tool: ruff
  auto_fix: true
  paths:
  - vibe_core
  - steward
  - scripts
  line_length: 120
  quote_style: double
test:
  tool: pytest
  paths:
  - tests
  default_profile: fast
  profiles:
    fast:
      name: fast
      description: Quick feedback during development (excludes slow tests)
      include_categories: []
      exclude_categories: []
      markers: []
      exclude_markers:
      - slow
      - integration
      - e2e
      workers: 0
      fail_fast: true
      timeout: 120
      coverage: false
      coverage_threshold: 0
      verbose: false
      show_durations: 5
      extra_args: []
    full:
      name: full
      description: Complete test suite with coverage analysis
      include_categories: []
      exclude_categories: []
      markers: []
      exclude_markers: []
      workers: 0
      fail_fast: false
      timeout: 300
      coverage: true
      coverage_threshold: 0
      verbose: true
      show_durations: 10
      extra_args: []
    ci:
      name: ci
      description: 'CI-optimized: parallel, fail-fast, timeout enforced'
      include_categories: []
      exclude_categories: []
      markers: []
      exclude_markers: []
      workers: 0
      fail_fast: true
      timeout: 300
      coverage: false
      coverage_threshold: 0
      verbose: false
      show_durations: 10
      extra_args:
      - --tb=short
    smoke:
      name: smoke
      description: Quick sanity check (smoke-tagged tests only)
      include_categories: []
      exclude_categories: []
      markers:
      - smoke
      exclude_markers: []
      workers: 0
      fail_fast: true
      timeout: 10
      coverage: false
      coverage_threshold: 0
      verbose: false
      show_durations: 0
      extra_args: []
    unit:
      name: unit
      description: Unit tests only (fast, isolated)
      include_categories: []
      exclude_categories: []
      markers:
      - unit
      exclude_markers:
      - integration
      - e2e
      - slow
      workers: 0
      fail_fast: false
      timeout: 120
      coverage: false
      coverage_threshold: 0
      verbose: false
      show_durations: 5
      extra_args: []
    integration:
      name: integration
      description: Integration tests only (sequential for stability)
      include_categories: []
      exclude_categories: []
      markers:
      - integration
      exclude_markers: []
      workers: 1
      fail_fast: false
      timeout: 120
      coverage: false
      coverage_threshold: 0
      verbose: true
      show_durations: 0
      extra_args: []
  timeout: 300
  workers: 0
  coverage_threshold: 0
ci:
  workflows:
  - name: Lint & Format Check
    file: steward-ci.yml
    triggers:
    - push
    - pull_request
    required: true
  - name: Integration Tests
    file: integration-tests.yml
    triggers:
    - push
    - pull_request
    required: true
  - name: Scheduled Agents
    file: scheduled-agents.yml
    triggers:
    - schedule
    required: false
  protected_branches:
  - main
  - master
  require_status_checks: true
enforce_on_commit: true
enforce_on_push: true
block_on_failure: true
