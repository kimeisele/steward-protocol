# STEWARD PROTOCOL: STATIC CODE STANDARDS
# =========================================
#
# This file defines the "Cardinal Sins" (Todsünden) of the codebase.
# The Watchman agent reads these rules and verifies compliance via AST.
#
# Rule Schema:
#   id: Unique identifier
#   target: ast node type (Call, ExceptHandler, Assign, etc.)
#   severity: CRITICAL | HIGH | MEDIUM | LOW
#   match:
#     attr: Attribute name to check (optional)
#     func: Function name to check (optional)
#     args_contain: List of forbidden string arguments (optional)
#   message: Human-readable violation message
#   fix_suggestion: Guidance for the Engineer agent

rules:
  # TODSÜNDE #2: Ghost State (Raw File Writes)
  - id: "unsafe_io_write"
    target: "Call"
    match:
      func: "open"
      args_contain: ["w", "a", "wb", "ab"]
    severity: "CRITICAL"
    message: "Raw write-access detected. Bypasses VFS and KernelIO audit."
    fix_suggestion: "Use self.system.write_file() or kernel.io.write_document()"

  # TODSÜNDE #2: Unsandboxed IO
  - id: "unsafe_shutil"
    target: "Attribute"
    match:
      object: "shutil"
    severity: "CRITICAL"
    message: "Direct shutil usage detected. Bypasses sandbox isolation."
    fix_suggestion: "Use self.system.publish_artifact() for repo writes."

  # TODSÜNDE #1: Silent Failures
  - id: "silent_failure"
    target: "ExceptHandler"
    condition: "is_pass_only"
    severity: "HIGH"
    message: "Silent failure (except: pass) detected. Hides bugs."
    fix_suggestion: "Add logging (logger.error) or proper exception handling."

  # NAKED AGENT PATTERN
  - id: "direct_path_data"
    target: "Call"
    match:
      func: "Path"
      args_starts_with: "data/"
    severity: "CRITICAL"
    message: "Hardcoded data/ path detected. Breaks portability."
    fix_suggestion: "Use self.system.get_sandbox_path() instead."

  # HARDCODED CONFIG
  - id: "hardcoded_path_in_init"
    target: "Assign"
    context: "__init__"
    match:
      func: "Path"
    severity: "MEDIUM"
    message: "Hardcoded Path in constructor."
    fix_suggestion: "Use lazy-loading @property pattern."

  # OPUS-306: STATE AUTHORITY VIOLATION
  # NOTE: Disabled - the match criteria (attr, object_type, context) are not yet
  # implemented in StandardsInspectionTool._matches_rule(). This caused 39K false positives.
  # TODO: Implement attr/object_type matching in the tool before re-enabling.
  # - id: "plugin_weaver_pulse"
  #   target: "Call"
  #   context: "vibe_core/plugins/"
  #   match:
  #     attr: "pulse"
  #     object_type: "StateSyncWeaver"
  #   severity: "CRITICAL"
  #   message: "Plugin calls weaver.pulse() directly. Breaks state commit batching."
  #   fix_suggestion: "Remove weaver.pulse(). StateService handles commits via background worker."

  # ============================================================================
  # OPUS-307 PHASE E+: ARCHITECTURAL PATTERN VIOLATIONS
  # These patterns were discovered during blind spot analysis.
  # The system must learn to detect AND heal these autonomously.
  # ============================================================================

  # ANTI-PATTERN: get_instance() statt ServiceRegistry
  - id: "get_instance_antipattern"
    target: "Call"
    match:
      attr: "get_instance"
    severity: "HIGH"
    message: "Using .get_instance() singleton instead of ServiceRegistry DI."
    fix_suggestion: "Replace X.get_instance() with ServiceRegistry.get(XProtocol) or ServiceRegistry.require(XProtocol)"
    has_sattva_remedy: true

  # ANTI-PATTERN: Direct instantiation statt DI
  - id: "direct_registry_instantiation"
    target: "Call"
    match:
      func_in: ["ToolRegistry", "UnifiedRegistry", "CartridgeRegistry"]
    severity: "MEDIUM"
    message: "Direct instantiation of Registry class. Should be injected via ServiceRegistry."
    fix_suggestion: "Use ServiceRegistry.get(ToolRegistry) instead of ToolRegistry()"
    has_sattva_remedy: true

  # ANTI-PATTERN: Path scanning for discovery
  # OPUS-307 Phase F: iterdir() is TAMAS (blind darkness)
  # The system must KNOW what's installed, not GUESS.
  - id: "iterdir_discovery"
    target: "Call"
    match:
      attr: "iterdir"
    severity: "HIGH"
    message: "iterdir() is TAMAS - blind filesystem scanning. Das System RATET statt zu WISSEN."
    fix_suggestion: "Use ManifestRegistry.get_by_type() or discover_from_registry(). The ONLY allowed iterdir is in ManifestRegistry._scan_directory()."
    has_sattva_remedy: true
    allowed_files: ["vibe_core/loaders/manifest_registry.py"]

  # Legacy rule (softer version, kept for backwards compatibility)
  - id: "path_scanning_discovery"
    target: "Call"
    match:
      attr: "iterdir"
      context_contains: ["discover", "load", "scan"]
    severity: "MEDIUM"
    message: "Using filesystem scanning for discovery. Fragile and implicit."
    fix_suggestion: "Use manifest-driven discovery via ManifestRegistry instead of path scanning."
    has_sattva_remedy: true

  # ANTI-PATTERN: Global module-level singletons
  - id: "global_singleton_dict"
    target: "Assign"
    match:
      name_pattern: "_instances"
      value_type: "Dict"
      context: "module_level"
    severity: "LOW"
    message: "Global _instances dict for singleton pattern. Legacy pattern."
    fix_suggestion: "Migrate to ServiceRegistry for consistent DI."
    has_sattva_remedy: false

  # ============================================================================
  # OPUS-XXX: TYPING DISCIPLINE (Yantra)
  # "Any ist verboten. Wenn du Any schreibst, hast du das Datenmodell nicht verstanden."
  # ============================================================================

  # TODSÜNDE: Any Usage (verboten laut PROMPT.md)
  - id: "any_type_usage"
    target: "Name"
    match:
      name: "Any"
    severity: "MEDIUM"
    message: "Any type usage detected. Violates PROMPT.md typing discipline."
    fix_suggestion: "Replace Any with concrete type, Protocol, or TypeVar. Use Pydantic models for cross-module data."
    has_sattva_remedy: false
    # NOTE: This rule requires AST Name matching which may need implementation

  # ============================================================================
  # STRUCTURAL RULES (require semantic analysis, not just AST)
  # These are documented but may need custom Watchman handlers to detect.
  # ============================================================================

