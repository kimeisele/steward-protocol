  #   condition: "method_count > 50 OR line_count > 1000"
  #   severity: "HIGH"
  #   message: "God Object detected. Class has too many responsibilities."
  #   fix_suggestion: "Extract focused manager classes (e.g., AgentManager, CapabilityManager)."
  #   has_sattva_remedy: false
  #   requires: "semantic_analysis"

  # STRUCTURAL: Missing protocol implementation
  # - id: "missing_protocol"
  #   target: "ClassDef"
  #   condition: "name endswith 'Plugin' AND NOT implements 'KernelPlugin'"
  #   severity: "CRITICAL"
  #   message: "Plugin class does not implement KernelPlugin protocol."
  #   fix_suggestion: "Implement KernelPlugin protocol with plugin_id property and on_boot() method."
  #   has_sattva_remedy: true
  #   requires: "type_checking"

  # STRUCTURAL: CLI not using @register_cli
  # - id: "unregistered_cli"
  #   target: "ClassDef"
  #   condition: "name endswith 'CLI' AND NOT has_decorator 'register_cli'"
  #   severity: "HIGH"
  #   message: "CLI class not using @register_cli decorator. Not discoverable."
  #   fix_suggestion: "Add @register_cli decorator and implement meta property."
  #   has_sattva_remedy: true
  #   requires: "decorator_analysis"

  # STRUCTURAL: Mixin instead of DI
  # - id: "mixin_injection"
  #   target: "ClassDef"
  #   condition: "inherits 'OathMixin' OR inherits '*Mixin'"
  #   severity: "MEDIUM"
  #   message: "Using Mixin for dependency injection. Prefer constructor injection."
  #   fix_suggestion: "Replace Mixin inheritance with constructor parameter injection via ServiceRegistry."
  #   has_sattva_remedy: false
  #   requires: "inheritance_analysis"
