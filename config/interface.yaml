templates_dir: knowledge/interface/templates
default_interval: 0
variables:
  project_name: steward-protocol
  project_url: https://github.com/kimeisele/steward-protocol
  version: 0.1.0
formatting:
  timezone: UTC
  date_format: '%Y-%m-%d'
  time_format: '%H:%M:%S'
  datetime_format: '%Y-%m-%d %H:%M:%S'
  relative_time: true
element_types:
  table:
    header_style: bold
    alignment: left
    separator: '|'
  status:
    icons:
      running: "\U0001F7E2"
      stopped: "\U0001F534"
      warning: "\U0001F7E1"
      unknown: "\u26AA"
    format: '{icon} {label}'
  list:
    bullet: '-'
    checkbox_empty: '[ ]'
    checkbox_checked: '[x]'
    indent: 2
  terminal:
    prompt: '>'
    code_fence: '```'
    language: bash
  metric:
    format: '{label}: {value} {unit}'
    progress_bar: true
    progress_width: 20
  nav:
    separator: " \xB7 "
    link_format: '[{label}]({url})'
layouts:
  fullpage:
    has_header: true
    has_footer: true
    has_nav: true
    sections:
    - header
    - nav
    - content
    - footer
    columns: 1
  content_only:
    has_header: false
    has_footer: false
    has_nav: false
    sections:
    - content
    columns: 1
  dashboard:
    has_header: true
    has_footer: true
    has_nav: true
    sections:
    - header
    - nav
    - widgets
    - footer
    columns: 2
  terminal:
    has_header: true
    has_footer: false
    has_nav: false
    sections:
    - header
    - request
    - status
    - history
    columns: 1
ownership_types:
  live:
    writable_by: system
    preserve_on_render: false
    refresh_on_tick: true
    marker_start: <!-- @LIVE:{id} -->
    marker_end: <!-- /@LIVE -->
  ai:
    writable_by: ai
    preserve_on_render: true
    refresh_on_tick: false
    marker_start: <!-- @AI:{id} -->
    marker_end: <!-- /@AI -->
  human:
    writable_by: human
    preserve_on_render: true
    refresh_on_tick: false
    marker_start: <!-- @HUMAN:{id} -->
    marker_end: <!-- /@HUMAN -->
view_types:
  docs:
    layout: fullpage
    editable: false
    auto_refresh: false
    refresh_interval: 30
  dashboard:
    layout: dashboard
    editable: false
    auto_refresh: true
    refresh_interval: 30
  terminal:
    layout: terminal
    editable: true
    auto_refresh: true
    refresh_interval: 5
  workspace:
    layout: fullpage
    editable: true
    auto_refresh: true
    refresh_interval: 30
  workflow:
    layout: dashboard
    editable: false
    auto_refresh: true
    refresh_interval: 10
dependencies:
  kernel_status:
    requires:
    - kernel.booted
    fallback: Kernel not running
  agent_list:
    requires:
    - kernel.booted
    - agents.loaded
    fallback: No agents loaded
  task_queue:
    requires:
    - kernel.booted
    - scheduler.ready
    fallback: Scheduler not ready
renderers:
  readme:
    enabled: true
    output: README.md
    view_type: docs
    interval: 60
    template: readme.md.j2
  index:
    enabled: true
    output: INDEX.md
    view_type: docs
    interval: 60
  help:
    enabled: true
    output: HELP.md
    view_type: docs
    interval: 300
  agents:
    enabled: true
    output: AGENTS.md
    view_type: dashboard
    interval: 30
    sections:
    - id: header
      owner: live
      source: kernel.status
    - id: agent_registry
      owner: live
      source: agents.list
    - id: agent_stats
      owner: live
      source: agents.stats
  citymap:
    enabled: true
    output: CITYMAP.md
    view_type: docs
    interval: 60
  operations:
    enabled: true
    output: OPERATIONS.md
    view_type: dashboard
    interval: 10
  envoy:
    enabled: true
    output: ENVOY.md
    view_type: terminal
    interval: 0
  settings:
    enabled: true
    output: SETTINGS.md
    view_type: terminal
    interval: 5
  git:
    enabled: true
    output: GIT.md
    view_type: dashboard
    interval: 30
    sections:
    - id: status
      owner: live
      source: git.status
    - id: recent_commits
      owner: live
      source: git.log
  tasks:
    enabled: true
    output: TASKS.md
    view_type: workflow
    interval: 10
  matrix:
    enabled: false
    output: MATRIX.md
    view_type: docs
    interval: 300
  proof:
    enabled: false
    output: PROOF.md
    view_type: docs
    interval: 0
  ephemeral:
    enabled: true
    output: EPHEMERAL.md
    view_type: dashboard
    interval: 60
  architecture:
    enabled: true
    output: ARCHITECTURE.md
    view_type: dashboard
    interval: 300
    sections:
    - id: mermaid_diagram
      owner: live
      source: arch.mermaid
    - id: component_sizes
      owner: live
      source: arch.components
      element_type: table
    - id: plugin_status
      owner: live
      source: arch.plugins
      element_type: table
  cognition:
    enabled: true
    output: COGNITION.md
    view_type: dashboard
    interval: 5
    sections:
    - id: holon_hierarchy
      owner: live
      source: cycles.active
    - id: phase_metrics
      owner: live
      source: cycles.metrics
    - id: memory_safety
      owner: live
      source: cycles.status
    - id: completed_cycles
      owner: live
      source: cycles.completed
    - id: error_tracking
      owner: live
      source: cycles.errors
  state:
    enabled: true
    output: STATE.md
    view_type: dashboard
    interval: 10
    sections:
    - id: summary
      owner: live
      source: state.summary
      element_type: status
    - id: sthula
      owner: live
      source: state.sthula
      element_type: table
    - id: prana
      owner: live
      source: state.prana
      element_type: table
    - id: purusha
      owner: live
      source: state.purusha
      element_type: table
    - id: session
      owner: live
      source: state.session
      element_type: list
    - id: git_status
      owner: live
      source: state.git
      element_type: status
  economy:
    enabled: true
    output: ECONOMY.md
    view_type: dashboard
    interval: 30
    sections:
    - id: treasury
      owner: live
      source: economy.treasury
      element_type: table
    - id: agent_credits
      owner: live
      source: economy.credits
      element_type: table
    - id: transactions
      owner: live
      source: economy.transactions
      element_type: table
custom_renderers: {}
header:
  show_nav: true
  show_timestamp: true
  show_kernel_status: true
  generator_name: InterfacePlugin
  nav_docs:
  - README.md
  - INDEX.md
  - AGENTS.md
  - CITYMAP.md
  - HELP.md
  - TASKS.md
  - SETTINGS.md
  - ENVOY.md
footer:
  show_generator: true
  show_timestamp: true
  format: '*Generated by {generator} | {timestamp}*'
default_templates:
  table: templates/elements/table.md.j2
  list: templates/elements/list.md.j2
  status: templates/elements/status.md.j2
  metric: templates/elements/metric.md.j2
  terminal: templates/elements/terminal.md.j2
  nav: templates/elements/nav.md.j2
