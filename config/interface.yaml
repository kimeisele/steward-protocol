# Interface Configuration - UI Rendering System
#
# This file defines HOW the UI system renders markdown files.
# The InterfacePlugin reads this config to know:
# - Which renderers are enabled
# - How often each renderer should refresh
# - Template and document type settings
#
# FRACTAL: Custom agents can add their own renderers here!
# Example: A broker agent adds broker_btc renderer that refreshes every 5h.

# =============================================================================
# GLOBAL SETTINGS
# =============================================================================
templates_dir: knowledge/interface/templates

# Default interval for all renderers (seconds)
# 0 = render on every tick
default_interval: 0

# =============================================================================
# SYSTEM RENDERERS (built-in)
# =============================================================================
renderers:
  # Core navigation/status
  readme:
    enabled: true
    output: README.md
    template: readme.md.j2
    doc_type: readonly
    interval: 60  # Refresh every minute

  index:
    enabled: true
    output: INDEX.md
    doc_type: readonly
    interval: 60

  help:
    enabled: true
    output: HELP.md
    doc_type: readonly
    interval: 300  # Refresh every 5 min

  # Agent ecosystem
  agents:
    enabled: true
    output: AGENTS.md
    doc_type: readonly
    interval: 30  # More frequent - agent status changes

  citymap:
    enabled: true
    output: CITYMAP.md
    doc_type: readonly
    interval: 60

  # Operations/Status
  operations:
    enabled: true
    output: OPERATIONS.md
    doc_type: readonly
    interval: 10  # Frequent for live status

  dashboard:
    enabled: true
    output: DASHBOARD.md
    doc_type: readonly
    interval: 30

  # Bidirectional (user can write)
  envoy:
    enabled: true
    output: ENVOY.md
    doc_type: bidirectional
    interval: 5  # Check for user input frequently

  settings:
    enabled: true
    output: SETTINGS.md
    doc_type: bidirectional
    interval: 5  # Check for commands frequently

  # Knowledge/Context
  rag:
    enabled: true
    output: RAG.md
    doc_type: readonly
    interval: 120

  # Git integration
  git:
    enabled: true
    output: GIT.md
    doc_type: readonly
    interval: 30

  # Tasks
  tasks:
    enabled: true
    output: TASKS.md
    doc_type: readonly
    interval: 10

  # Matrix (routing)
  matrix:
    enabled: false  # Generated separately
    output: MATRIX.md
    doc_type: readonly
    interval: 300

  # Proof (verification)
  proof:
    enabled: false  # Generated by verification scripts
    output: PROOF.md
    doc_type: readonly
    interval: 0

  # Ephemeral (hypercube)
  ephemeral:
    enabled: true
    output: EPHEMERAL.md
    doc_type: readonly
    interval: 60

  # OPUS - Architecture Operations Dashboard (AI workspace)
  opus:
    enabled: true
    output: OPUS.md
    doc_type: bidirectional
    interval: 30  # AI can update progress
    config_file: config/opus.yaml  # Renderer-specific config (VISNU goals, etc.)

# =============================================================================
# CUSTOM RENDERERS (user/agent defined)
# =============================================================================
# Agents can add their own renderers here!
# Example:
#
# custom_renderers:
#   broker_btc:
#     enabled: true
#     output: BROKER_BTC.md
#     interval: 18000  # 5 hours
#     data_source: broker.get_btc_price
#     template: custom/broker.j2
#
#   weather_report:
#     enabled: true
#     output: WEATHER.md
#     interval: 3600  # 1 hour
#     data_source: weather.get_forecast

custom_renderers: {}

# =============================================================================
# HEADER SETTINGS
# =============================================================================
header:
  show_nav: true
  show_timestamp: true
  show_kernel_status: true
  generator_name: InterfacePlugin
  quick_start_command: "python -m vibe_core.cli boot"  # Shown in header comment

# =============================================================================
# DOCUMENT TYPES
# =============================================================================
# readonly: Only kernel writes, user reads
# bidirectional: User can write (ENVOY, SETTINGS), kernel preserves user content
doc_types:
  readonly:
    preserve_user_content: false
    add_header: true
  bidirectional:
    preserve_user_content: true
    add_header: true
    user_section_marker: "## 💬"  # Marker for user-editable section
