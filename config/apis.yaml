external:
  tavily:
    env_var: TAVILY_API_KEY
    description: Web search API for research capabilities
    required: false
  twitter:
    env_var: TWITTER_API_KEY
    description: Twitter/X API for broadcasting
    required: false
    additional_vars:
    - TWITTER_API_SECRET
    - TWITTER_ACCESS_TOKEN
    - TWITTER_ACCESS_SECRET
