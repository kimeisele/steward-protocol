# MANAS Cognitive Kernel Configuration
#
# This is the SOUL (Dharma) that governs how MANAS thinks.
# MANAS reads these values at boot and follows them.
# Vajra uses these to enforce consistency against drift.
#
# Philosophy:
# - Conservative defaults (require human approval)
# - Earn autonomy through demonstrated reliability (karma)
# - Prioritize safety over speed

manas:
  # =========================================================================
  # Thinking Rate Limit
  # =========================================================================
  # How often MANAS performs a thought cycle
  # Units: minutes
  thinking_interval_minutes: 15  # Match heartbeat interval for responsiveness

  # Activate MANAS after this much idle time
  # Units: minutes
  idle_threshold_minutes: 15  # FIXED: 30 → 15 (faster activation)

  # =========================================================================
  # Biorhythm Configuration (OPUS-174)
  # =========================================================================
  # Modulates consciousness based on context (not just polling)
  biorhythm:
    # Weights for consciousness calculation (must sum to 1.0)
    weights:
      synaptic_urgency: 0.5  # Internal pressure (triggers)
      prakriti_health: 0.3   # System state health
      kala_rhythm: 0.2       # Cosmic time/energy

    # Thresholds for state transitions
    thresholds:
      turiya: 0.8   # Deep Think (Full OODA)
      sattva: 0.5   # Reflect (Organize)
      rajas: 0.2    # React (Monitor)
      # Below 0.2 is Tamas (Hibernate)

  # =========================================================================
  # Execution Policy (AUTONOMOUS MODE ENABLED)
  # =========================================================================
  # Auto-execute safe intents without human approval?
  # false = CONSERVATIVE (human approval always required)
  # true = AUTONOMOUS (auto-execute SAFE risk intents)
  auto_execute_safe: true  # OPUS-SILPA: Activated for autonomous operation

  # Karma threshold for earned autonomy (0-100)
  # If karma >= this value, MANAS can auto-execute LOW risk intents
  # Earning karma requires:
  # - Consistent successful executions
  # - Devotional practices (Bhakti - admitting mistakes, following TDD)
  # - Long-term system stability
  karma_auto_execute_threshold: 90

  # =========================================================================
  # Intent Management
  # =========================================================================
  # Max intents to keep in buffer
  # Prevents intent buffer overflow
  max_intent_buffer_size: 10

  # Intent expiry (hours)
  # Pending intents are discarded after this time
  intent_expiry_hours: 24

  # =========================================================================
  # Intent Throttling (Don't Overwhelm The Human)
  # =========================================================================
  # Max intents to generate per tick
  # Prioritizes CRITICAL/HIGH over MEDIUM/LOW
  # Prevents "intent explosion" that would paralyze human reviewers
  max_intents_per_tick: 3

  # Prioritize survival over growth?
  # If true: CRITICAL/ERROR intents processed before GENESIS intents
  # If false: Process all intents by priority (but still respects max_intents_per_tick)
  survival_first: true

# =============================================================================
# OPUS-088: MIRROR TEST (Re-entrancy Guard)
# =============================================================================
# Prevents infinite loop: MANAS commits → triggers itself → commits → ...
mirror_test:
  enabled: true
  # Commit messages that indicate self-triggered changes
  self_trigger_patterns:
    - "chore\\(manas\\):"
    - "chore: vedic dharma state update"
    - "chore: session state update"
    - "🫀 Heartbeat Pulse:"

# =============================================================================
# OPUS-089: SANKALPA (Strategic Will)
# =============================================================================
# Proactive mission-based intent generation
sankalpa:
  enabled: true
  config_file: ".opus_state/sankalpa.json"  # External config for missions

  # Default triggers if config file missing
  default_idle_minutes: 30
  default_requires_no_pending: false  # FIXED: was blocking all strategies

  # Mission evaluation frequency
  evaluation_interval_minutes: 15

# =============================================================================
# OPUS-089: SHIVA LIFECYCLE (Destroyer of Illusions)
# =============================================================================
# Sweeps stale/fulfilled intents to keep buffer clean
shiva:
  enabled: true
  sweep_interval_minutes: 30  # How often to sweep

  # Intent is "fulfilled" if reality already satisfies it
  fulfillment_checks:
    - "commit_pending_changes: git status --short"  # Check if clean
    - "cleanup_stale_branches: git branch"          # Check if branches gone

  # Archive instead of delete
  archive_fulfilled: true
  archive_path: ".opus_state/archived_intents.json"

# =============================================================================
# OPUS-089: OBSERVATION LOGGER (Transparency)
# =============================================================================
# Makes MANAS thoughts visible in OPUS.md System Journal
observation_logger:
  enabled: true
  log_to_opus: true           # Render in OPUS.md System Journal
  log_to_file: true           # Also write to .opus_state/observations.json
  log_file: ".opus_state/observations.json"

  # What to log
  log_events:
    - think_cycle_start
    - think_cycle_complete
    - intent_generated
    - intent_auto_executed
    - intent_blocked
    - sensor_perception

  # Retention
  max_observations: 100
  retention_days: 7

# =============================================================================
# OPUS-089: DREAMING (Memory Review)
# =============================================================================
# Shiva's Dreaming - consolidates patterns during idle time
dreaming:
  enabled: true
  trigger_idle_minutes: 120  # Dream after 2h idle
  max_dreams_per_day: 1

  # What to analyze
  analyze:
    - success_patterns      # What worked?
    - failure_patterns      # What failed?
    - intent_clusters       # Similar intents?
    - strategy_effectiveness # Which strategies work?

# =============================================================================
# OPUS-054: SUTRA SENSE (Documentation Curator)
# =============================================================================
# Doc/Code gap detection
sutra_sense:
  enabled: true
  scan_interval_minutes: 60   # How often to scan for gaps

  # Gap severity
  severity:
    missing_code: "high"       # Doc references non-existent file
    missing_test: "medium"     # Doc references non-existent test
    missing_harness: "medium"  # Doc has no @HARNESS
    stale_reference: "low"     # Doc references old path

  # Auto-fix
  auto_fix_enabled: true
  auto_fix_types:
    - "missing_harness"  # Can auto-generate
    - "stale_reference"  # Can auto-update

# =============================================================================
# OPUS-009: PRAKRITI SENSE (State Health Monitor)
# =============================================================================
# Perceives unified system state and generates healing intents
prakriti_sense:
  enabled: true
  scan_interval_minutes: 15

  # Health thresholds
  thresholds:
    git_uncommitted_changes: 10   # Trigger intent if > 10 files
    test_failure_rate: 0.1         # Trigger if > 10% tests fail
    doc_staleness_hours: 24        # Trigger if docs not updated

  # Guna classification
  guna_weights:
    sattva: 1.0  # Clean, synced, tested
    rajas: 0.8   # Active, dirty, changing (OPUS-211: 0.5 -> 0.8 to boost health during dev)
    tamas: 0.0   # Stale, broken, untested

# =============================================================================
# OPUS-009: DHARMA SENSE (Vedic Governance)
# =============================================================================
# Tracks agent permissions, Bhakti, and enforces Ashrama rules
dharma_sense:
  enabled: true
  state_file: ".vibe/state/vedic_dharma.json"

  # Bhakti (earned trust)
  bhakti:
    success_reward: 5       # Points per successful intent
    failure_penalty: -10    # Penalty per failure
    min_bhakti: 0
    max_bhakti: 200

  # Ashrama (lifecycle stages)
  ashrama_rules:
    brahmachari: ["read", "learn"]                    # Student
    grihastha: ["code_modify", "git_commit"]          # Householder
    vanaprastha: ["review", "mentor"]                 # Forest dweller
    sannyasa: ["pr_merge", "deploy"]                  # Renunciate

# =============================================================================
# OPUS-090: MEMORY CONFIGURATION
# =============================================================================
# How MANAS remembers and learns
memory:
  # Maximum memories to keep (prevents unbounded growth)
  max_memories: 500

  # How long to remember things (days)
  retention_days: 30

  # Cooldown after failure (hours) - don't suggest same thing too soon
  failure_cooldown_hours: 24

  # Minimum success rate to consider a pattern "successful" (0.0-1.0)
  success_rate_threshold: 0.7

  # Minimum attempts before trusting success rate
  min_attempts_for_trust: 2
