git:
  uncommitted_changes: ignore
  behind_remote: ignore
  untracked_files: ignore
tests:
  must_pass: ignore
  coverage_minimum: ignore
environment:
  required_env_vars: warn
  python_version: ignore
ui_files:
  auto_commit: true
  auto_push: false
  commit_message: 'auto: Update generated UI files'
  patterns:
  - '*.md'
  - '!docs/**'
