# Phoenix Configuration - Layer 3 Dynamic Wiring
# This file defines HOW kernel implementations are wired to protocols
# Format: module_path:ClassName
#
# NOTE: agents, providers, playbook, features, imports have been MIGRATED to:
#   - config/agents.yaml (system agents)
#   - config/providers.yaml (LLM providers, playbook, features, imports)
#
# This file now ONLY contains system.kernel wiring.

system:
  kernel:
    # Core kernel components
    ledger: "vibe_core.kernel_impl:VibeLedgerImpl"
    scheduler: "vibe_core.kernel_impl:VibeSchedulerImpl"
    registry: "vibe_core.kernel_impl:ManifestRegistryImpl"
    kernel: "vibe_core.kernel_impl:VibeKernelImpl"
