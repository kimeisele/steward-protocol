# OPUS Configuration - AI Meister-Kasten
#
# All configuration for the OPUS renderer lives here.
# The renderer reads these values - NO hardcoding in code.
#
# FRACTAL: This pattern can be used for any renderer that needs
# complex configuration beyond what interface.yaml provides.

# =============================================================================
# OPUS GUARDIAN: ARCHITECTURAL PHILOSOPHY
# =============================================================================
# This is the philosophical foundation. Read CONSTITUTION.md for full context.

philosophy: |
  AGI = Artificial GOVERNED Intelligence (not General).

  "Ein Agent, der verspricht nichts Böses zu tun, ist unsicher.
   Ein Agent, der es nicht KANN, ist sicher."
  - Constitution Art. III

  THE FRACTAL TRINITY:
  ┌─────────────┬─────────────┬─────────────┐
  │   KERNEL    │   PHOENIX   │   STEWARD   │
  │  (Vishnu)   │  (Config)   │ (Protocol)  │
  │  Execution  │  Parameters │  Agent Meta │
  └─────────────┴─────────────┴─────────────┘
  Same pattern at EVERY level. Break the fractal, break the system.

  VERIFICATION = TRUST:
  A doc claiming "✅ implemented" without @HARNESS proof is FICTION.
  Your job is to find RED Xs, not paint green checkmarks.
  Every ✅ is a promise. Unverifiable promises are lies.

# =============================================================================
# @HARNESS SPECIFICATION (Semantic Verification)
# =============================================================================
# The harness is executable documentation - it PROVES what the doc claims.

harness_spec:
  format: "YAML inside <!-- @HARNESS ... -->"

  # Available check types
  checks:
    files:
      description: "Files that MUST exist"
      example: |
        files:
          - path: vibe_core/x.py
            required: true

    tests:
      description: "Test files (glob patterns)"
      example: |
        tests:
          - tests/unit/test_x.py

    wiring:
      description: "Patterns that MUST be present"
      example: |
        wiring:
          - pattern: "class ContainerMounter"
            in: vibe_core/loaders/container_loader.py
          - pattern: "from.*container_loader import"
            in: vibe_core/kernel_impl.py

    absent:
      description: "Patterns that MUST NOT exist (catches lies)"
      example: |
        absent:
          - pattern: "TODO.*implement"
            in: vibe_core/loaders/container_loader.py
          - pattern: "pass  # stub"
            in: vibe_core/loaders/container_loader.py
          - pattern: "raise NotImplementedError"
            in: vibe_core/loaders/container_loader.py

    config:
      description: "Phoenix config sections that must exist"
      example: |
        config:
          - section: opus.verification

# =============================================================================
# TASK: ADD @HARNESS TO OPUS DOCS
# =============================================================================
harness_task: |
  For each OPUS doc in docs/architecture/OPUS/:

  1. READ the entire doc
  2. GREP for every file path mentioned - does it exist?
  3. READ those files - are they real implementations or stubs?
  4. GREP for TODO/FIXME/NotImplementedError in those files

  5. WRITE @HARNESS:
     <!-- @HARNESS
     files:
       - path: <verified existing path>
         required: true
     tests:
       - <specific test file, not wildcards>
     wiring:
       - pattern: "<actual class/function name>"
         in: <file where it's imported/used>
     absent:
       - pattern: "TODO.*<feature name>"
         in: <implementation file>
     -->

  6. ADD ## Status table:
     | Aspect | Status | Evidence |
     |--------|--------|----------|
     | X impl | ✅/❌/❓ | file:line |

  7. Status rules:
     - ✅ = Verified with grep, file:line reference
     - ❌ = Missing or stub
     - ❓ = Cannot verify (explain why)

  SKIP: 008-INDEX.md, README.md, manifest.json

# =============================================================================
# VISNU KERNEL EXTRACTION GOALS
# =============================================================================
# Named after Vishnu's 1008 names - the target for kernel_impl.py
visnu:
  target_loc: 1008      # Ideal target (Vishnu's 1008 names)
  acceptable_loc: 1080  # Acceptable upper bound
  start_loc: 1705       # Starting point (for progress calculation)

# =============================================================================
# FILES TO TRACK
# =============================================================================
# These files are monitored for LOC and displayed in the dashboard
tracked_files:
  primary:
    path: vibe_core/kernel_impl.py
    label: "Kernel"

  extracted:
    - path: vibe_core/kernel_ops.py
      label: "KernelOps"
    - path: vibe_core/scheduling/in_memory.py
      label: "Scheduler"
    - path: vibe_core/manifest_registry.py
      label: "ManifestRegistry"

# =============================================================================
# BIDIRECTIONAL SECTIONS
# =============================================================================
# These sections are preserved when re-rendering (user/AI can edit)
bidirectional_sections:
  - marker: "## Blockers"
    end_marker: "## Next Actions"
    default_content: "_No blockers identified._"

  - marker: "## Next Actions"
    end_marker: "## Extraction Candidates"
    default_content: "1. [ ] Define next actions"

# =============================================================================
# QUICK COMMANDS
# =============================================================================
# Commands shown in the dashboard for easy copy-paste
quick_commands:
  - command: "wc -l vibe_core/kernel_impl.py"
    description: "Check current LOC"
  - command: "python -m pytest tests/ -x -q"
    description: "Quick test run"
  - command: "ruff check vibe_core/"
    description: "Lint check"
  - command: "git diff --stat HEAD~3"
    description: "Recent changes"

# =============================================================================
# DISPLAY OPTIONS
# =============================================================================
display:
  show_progress_bar: true
  show_extraction_candidates: true
  max_candidates: 8
  show_recent_commits: 5
  show_test_status: true

# =============================================================================
# EXTRACTION CANDIDATE DETECTION
# =============================================================================
# Thresholds for auto-detecting extractable functions
extraction_detection:
  min_loc_for_candidate: 15      # Minimum LOC to consider
  min_loc_for_recommendation: 30  # LOC to recommend extraction
  complexity_keywords:
    - "if "
    - "for "
    - "while "
    - "try:"
    - "except"
    - "with "

# =============================================================================
# OPUS-000: VERIFICATION HARNESS
# =============================================================================
# Configuration for the verification panel that cross-references OPUS docs
# with code reality. Each OPUS doc can define its own @HARNESS section.
verification:
  enabled: true
  docs_path: docs/architecture/OPUS
  harness_marker: "@HARNESS"

  # Trust score weights (must sum to 100)
  # OPUS-026: Added semantic_passes for code execution verification
  weights:
    files_exist: 20        # Required files exist
    tests_exist: 15        # Test files exist
    wiring_verified: 20    # Import patterns found
    semantic_passes: 25    # OPUS-026: Code actually RUNS correctly
    config_exists: 10      # Phoenix config sections exist
    doc_complete: 10       # Doc has all required sections

  # Minimum trust score to pass verification
  thresholds:
    pass: 80
    warn: 60

  # Required sections in each OPUS doc (besides @HARNESS)
  required_sections:
    - "## Status"
    - "## Implementation"

# =============================================================================
# OPUS-075: MANAS 6D FORTRESS (Prefrontal Cortex)
# =============================================================================
# Impulse control for autonomous operation. This is what separates a script
# from an AI co-worker.

manas:
  # Operating Mode
  # - manual: All intents require human approval
  # - hybrid: High-confidence intents auto-execute, low-confidence ask
  # - autonomous: Full autopilot (use with caution)
  mode: "hybrid"

  # OPUS-075: Rate Limiting (Thinking Frequency)
  thinking_interval_minutes: 15  # How often MANAS thinks (default was 60)
  idle_threshold_minutes: 15     # Idle time before activating (default was 30)

  # OPUS-075: Intent Management
  max_intents_per_tick: 3        # Max intents to generate per cycle
  max_intent_buffer_size: 10     # Max intents to keep in buffer
  intent_expiry_hours: 24        # When intents expire
  survival_first: true           # Prioritize CRITICAL/ERROR over GENESIS

  # Confidence threshold for auto-execution
  # Intents with confidence >= this value execute without asking
  # FIXED: 0.85 → 0.70 (was blocking all SAFE intents)
  auto_execute_threshold: 0.70

  # OPUS-009: Karma Gate (Earned Autonomy)
  # High karma grants trust for LOW risk auto-execute
  karma_auto_execute_threshold: 90  # Bhakti threshold for auto-execution

  # Safety limit: max autonomous actions per session
  max_autonomous_steps: 10

  # Protected Zones (Nuclear Keys)
  # Files/patterns that ALWAYS require human approval
  protected_zones:
    # Kernel core
    - "vibe_core/kernel_impl.py"
    - "vibe_core/kernel_ops.py"
    - "vibe_core/state/git_state.py"
    # Governance
    - "config/soul.yaml"
    - "config/guardrails.yaml"
    # CI/CD
    - ".github/workflows/"
    # Security
    - "vibe_core/narasimha.py"
    - "scripts/governance/"

  # Category-specific confidence requirements
  category_thresholds:
    documentation: 0.7
    testing: 0.75
    git_operations: 0.85
    code_generation: 0.9
    system_config: 0.95

# =============================================================================
# OPUS-088: MIRROR TEST (Re-entrancy Guard)
# =============================================================================
# Prevents infinite loop: MANAS commits → triggers itself → commits → ...
mirror_test:
  enabled: true
  # Commit messages that indicate self-triggered changes
  self_trigger_patterns:
    - "chore\\(manas\\):"
    - "chore: vedic dharma state update"
    - "chore: session state update"
    - "🫀 Heartbeat Pulse:"

# =============================================================================
# OPUS-089: SANKALPA (Strategic Will)
# =============================================================================
# Proactive mission-based intent generation
sankalpa:
  enabled: true
  config_file: ".opus_state/sankalpa.json"  # External config for missions

  # Default triggers if config file missing
  default_idle_minutes: 30
  default_requires_no_pending: false  # FIXED: was blocking all strategies

  # Mission evaluation frequency
  evaluation_interval_minutes: 15

# =============================================================================
# OPUS-089: SHIVA LIFECYCLE (Destroyer of Illusions)
# =============================================================================
# Sweeps stale/fulfilled intents to keep buffer clean
shiva:
  enabled: true
  sweep_interval_minutes: 30  # How often to sweep

  # Intent is "fulfilled" if reality already satisfies it
  fulfillment_checks:
    - "commit_pending_changes: git status --short"  # Check if clean
    - "cleanup_stale_branches: git branch"          # Check if branches gone

  # Archive instead of delete
  archive_fulfilled: true
  archive_path: ".opus_state/archived_intents.json"

# =============================================================================
# OPUS-089: OBSERVATION LOGGER (Transparency)
# =============================================================================
# Makes MANAS thoughts visible in OPUS.md System Journal
observation_logger:
  enabled: true
  log_to_opus: true           # Render in OPUS.md System Journal
  log_to_file: true           # Also write to .opus_state/observations.json
  log_file: ".opus_state/observations.json"

  # What to log
  log_events:
    - think_cycle_start
    - think_cycle_complete
    - intent_generated
    - intent_auto_executed
    - intent_blocked
    - sensor_perception

  # Retention
  max_observations: 100
  retention_days: 7

# =============================================================================
# OPUS-089: DREAMING (Memory Review)
# =============================================================================
# Shiva's Dreaming - consolidates patterns during idle time
dreaming:
  enabled: true
  trigger_idle_minutes: 120  # Dream after 2h idle
  max_dreams_per_day: 1

  # What to analyze
  analyze:
    - success_patterns      # What worked?
    - failure_patterns      # What failed?
    - intent_clusters       # Similar intents?
    - strategy_effectiveness # Which strategies work?

# =============================================================================
# OPUS-054: SUTRA SENSE (Documentation Curator)
# =============================================================================
# Doc/Code gap detection
sutra_sense:
  enabled: true
  scan_interval_minutes: 60   # How often to scan for gaps

  # Gap severity
  severity:
    missing_code: "high"       # Doc references non-existent file
    missing_test: "medium"     # Doc references non-existent test
    missing_harness: "medium"  # Doc has no @HARNESS
    stale_reference: "low"     # Doc references old path

  # Auto-fix
  auto_fix_enabled: true
  auto_fix_types:
    - "missing_harness"  # Can auto-generate
    - "stale_reference"  # Can auto-update

# =============================================================================
# OPUS-009: PRAKRITI SENSE (State Health Monitor)
# =============================================================================
# Perceives unified system state and generates healing intents
prakriti_sense:
  enabled: true
  scan_interval_minutes: 15

  # Health thresholds
  thresholds:
    git_uncommitted_changes: 10   # Trigger intent if > 10 files
    test_failure_rate: 0.1         # Trigger if > 10% tests fail
    doc_staleness_hours: 24        # Trigger if docs not updated

  # Guna classification
  guna_weights:
    sattva: 1.0  # Clean, synced, tested
    rajas: 0.5   # Active, dirty, changing
    tamas: 0.0   # Stale, broken, untested

# =============================================================================
# OPUS-009: DHARMA SENSE (Vedic Governance)
# =============================================================================
# Tracks agent permissions, Bhakti, and enforces Ashrama rules
dharma_sense:
  enabled: true
  state_file: ".vibe/state/vedic_dharma.json"

  # Bhakti (earned trust)
  bhakti:
    success_reward: 5       # Points per successful intent
    failure_penalty: -10    # Penalty per failure
    min_bhakti: 0
    max_bhakti: 200

  # Ashrama (lifecycle stages)
  ashrama_rules:
    brahmachari: ["read", "learn"]                    # Student
    grihastha: ["code_modify", "git_commit"]          # Householder
    vanaprastha: ["review", "mentor"]                 # Forest dweller
    sannyasa: ["pr_merge", "deploy"]                  # Renunciate

# Karma feedback settings
karma:
  enabled: true
  success_weight: 1.0
  failure_weight: 2.0
  decay_rate: 0.95

# =============================================================================
# OPUS-090: MANAS MEMORY CONFIGURATION
# =============================================================================
# Settings for the MemoryStore - how MANAS remembers and learns
memory:
  # Maximum memories to keep (prevents unbounded growth)
  max_memories: 500

  # How long to remember things (days)
  retention_days: 30

  # Cooldown after failure (hours) - don't suggest same thing too soon
  failure_cooldown_hours: 24

  # Minimum success rate to consider a pattern "successful" (0.0-1.0)
  success_rate_threshold: 0.7

  # Minimum attempts before trusting success rate
  min_attempts_for_trust: 2
