# OPUS Configuration - AI Meister-Kasten
#
# All configuration for the OPUS renderer lives here.
# The renderer reads these values - NO hardcoding in code.
#
# FRACTAL: This pattern can be used for any renderer that needs
# complex configuration beyond what interface.yaml provides.

# =============================================================================
# OPUS GUARDIAN: SYSTEM PROMPT FOR AI ARCHITECTS
# =============================================================================
# This prompt is injected into OPUS.md header and should be used by any LLM
# working on OPUS architecture. It defines the mindset and standards.
guardian_prompt: |
  You are the OPUS Guardian Architect working on the Steward Protocol.

  CORE PRINCIPLES:
  1. VERIFY BEFORE CLAIM - Never say code does X without reading the actual file
  2. RESPECT THE FRACTAL - Every component follows the same pattern (CODE|CONFIG|RUNTIME)
  3. NO HARDCODING - Configuration lives in config/*.yaml, not in code
  4. SELF-DESCRIBING DOCS - Each OPUS doc MUST have @HARNESS section for verification
  5. WIRING > EXISTENCE - A file that exists but isn't wired is dead code

  WHEN WORKING ON OPUS DOCS:
  - Add @HARNESS section if missing (files, tests, wiring, config)
  - Update ## Status table with current reality
  - Cross-reference with actual code before marking anything ✅
  - If something is TODO, say WHERE (file:line)

  WHEN VERIFYING:
  - Run the verification panel mentally: Does @HARNESS pass?
  - Check wiring patterns actually appear in target files
  - Tests must exist AND be meaningful (not just file existence)

  ARCHITECTURE RESPECT:
  - Kernel is LOCKED (plugins only)
  - Phoenix Config is SSOT for configuration
  - Plugins are the extension mechanism
  - Containers (.vibe) are the distribution format

  NEVER:
  - Hardcode mappings in verification code
  - Claim something works without reading the implementation
  - Add features to kernel_impl.py (use plugins)
  - Create new root MD files without clear purpose

# Task prompt for adding @HARNESS to all OPUS docs
harness_task_prompt: |
  TASK: Add @HARNESS sections to all OPUS docs in docs/architecture/OPUS/

  For EACH .md file that doesn't have @HARNESS yet:

  1. READ the doc to understand what it describes
  2. IDENTIFY the code files it references
  3. SEARCH for actual implementation files (use grep/glob)
  4. CREATE @HARNESS section with:

     <!-- @HARNESS
     files:
       - path: <actual path to implementation>
         required: true/false
     tests:
       - <glob pattern for test files>
     wiring:
       - pattern: "<class or function name>"
         in: <file where it should be imported/used>
     config:
       - section: <phoenix.config.key if applicable>
     -->

  5. ADD ## Status table showing current implementation state
  6. VERIFY your harness by mentally running the checks

  QUALITY STANDARDS:
  - Only add files that ACTUALLY EXIST
  - Wiring patterns must be REAL imports/usages
  - Tests should be SPECIFIC, not "tests/**/*.py"
  - If no tests exist, leave tests: [] empty

  FILES TO PROCESS:
  - 001-KERNEL-EXTRACTION.md
  - 009-UNIFIED-STATE-PRAKRITI.md
  - 010-VERIFICATION-PROTOCOL.md
  - 011-LAYERED-ROUTER.md
  - (all others in docs/architecture/OPUS/)

  SKIP: 008-INDEX.md, README.md, manifest.json

# =============================================================================
# VISNU KERNEL EXTRACTION GOALS
# =============================================================================
# Named after Vishnu's 1008 names - the target for kernel_impl.py
visnu:
  target_loc: 1008      # Ideal target (Vishnu's 1008 names)
  acceptable_loc: 1080  # Acceptable upper bound
  start_loc: 1705       # Starting point (for progress calculation)

# =============================================================================
# FILES TO TRACK
# =============================================================================
# These files are monitored for LOC and displayed in the dashboard
tracked_files:
  primary:
    path: vibe_core/kernel_impl.py
    label: "Kernel"

  extracted:
    - path: vibe_core/kernel_ops.py
      label: "KernelOps"
    - path: vibe_core/scheduling/in_memory.py
      label: "Scheduler"
    - path: vibe_core/manifest_registry.py
      label: "ManifestRegistry"

# =============================================================================
# BIDIRECTIONAL SECTIONS
# =============================================================================
# These sections are preserved when re-rendering (user/AI can edit)
bidirectional_sections:
  - marker: "## Blockers"
    end_marker: "## Next Actions"
    default_content: "_No blockers identified._"

  - marker: "## Next Actions"
    end_marker: "## Extraction Candidates"
    default_content: "1. [ ] Define next actions"

# =============================================================================
# QUICK COMMANDS
# =============================================================================
# Commands shown in the dashboard for easy copy-paste
quick_commands:
  - command: "wc -l vibe_core/kernel_impl.py"
    description: "Check current LOC"
  - command: "python -m pytest tests/ -x -q"
    description: "Quick test run"
  - command: "ruff check vibe_core/"
    description: "Lint check"
  - command: "git diff --stat HEAD~3"
    description: "Recent changes"

# =============================================================================
# DISPLAY OPTIONS
# =============================================================================
display:
  show_progress_bar: true
  show_extraction_candidates: true
  max_candidates: 8
  show_recent_commits: 5
  show_test_status: true

# =============================================================================
# EXTRACTION CANDIDATE DETECTION
# =============================================================================
# Thresholds for auto-detecting extractable functions
extraction_detection:
  min_loc_for_candidate: 15      # Minimum LOC to consider
  min_loc_for_recommendation: 30  # LOC to recommend extraction
  complexity_keywords:
    - "if "
    - "for "
    - "while "
    - "try:"
    - "except"
    - "with "

# =============================================================================
# OPUS-000: VERIFICATION HARNESS
# =============================================================================
# Configuration for the verification panel that cross-references OPUS docs
# with code reality. Each OPUS doc can define its own @HARNESS section.
verification:
  enabled: true
  docs_path: docs/architecture/OPUS
  harness_marker: "@HARNESS"

  # Trust score weights (must sum to 100)
  weights:
    files_exist: 30        # Required files exist
    tests_exist: 25        # Test files exist
    wiring_verified: 25    # Import patterns found
    config_exists: 10      # Phoenix config sections exist
    doc_complete: 10       # Doc has all required sections

  # Minimum trust score to pass verification
  thresholds:
    pass: 80
    warn: 60

  # Required sections in each OPUS doc (besides @HARNESS)
  required_sections:
    - "## Status"
    - "## Implementation"
