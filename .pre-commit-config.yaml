# Pre-commit hooks - Run same checks as CI locally
# Install: pip install pre-commit && pre-commit install
# Manual run: pre-commit run --all-files
#
# This ensures: LOCAL = CI (no surprises)

repos:
  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.1
    hooks:
      # Linter - critical errors only (matches CI line 33)
      # Only check vibe_core, scripts (same as CI)
      - id: ruff
        name: ruff-critical
        args: ["--select=E9,F63,F7,F82", "--fix"]
        files: ^(vibe_core|scripts)/

      # Formatter - auto-fix (matches CI line 41)
      - id: ruff-format
        files: ^(vibe_core|scripts)/

  # Prevent commits to main/master
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

      # Basics
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^knowledge/playbooks/schema\.yaml$  # Schema definition, not data
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict

  # Python specific
  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
        exclude: ^scripts/testing/  # Test utilities may use noqa legitimately
      # NOTE: python-no-eval removed - too many false positives in security code
      # (narasimha.py checks FOR eval in code, doesn't execute it)

# CI Parity Note:
# ===============
# CI runs:
#   1. ruff check --select=E9,F63,F7,F82 (MUST pass) <- covered by ruff-critical
#   2. ruff check --statistics || true (informational)
#   3. ruff format --check (MUST pass) <- covered by ruff-format
#
# Pre-commit runs the same checks with --fix where possible.
# Result: If pre-commit passes, CI will pass.

  # =========================================================================
  # STEWARD PROTOCOL ENFORCEMENT
  # =========================================================================
  # SENIOR_TEST_STABILIZATION_PROTOCOL.md: Ban direct RealVibeKernel() in tests
  # Must use TestKernel.minimal() or TestKernel.with_plugins() instead
  - repo: local
    hooks:
      - id: no-real-kernel-in-tests
        name: TestKernel Enforcement
        entry: 'RealVibeKernel\(\)'
        language: pygrep
        files: ^tests/.*\.py$
        types: [python]
        # Exclude fixtures.py where TestKernel wraps RealVibeKernel
        # Also exclude tests/archive/ (legacy/archived tests)
        exclude: ^tests/conftest\.py$|fixtures\.py$|^tests/archive/

  # =========================================================================
  # VISNU KERNEL PROTECTION - TOTAL LOCKDOWN
  # =========================================================================
  # SECURITY RING 0 - Code + Watchers + Laws
  # All new features MUST be plugins. No exceptions.
  #
  # This hook AUTO-RESTORES protected files from origin/main.
  # Agent changes literally disappear.
  # NEW workflow files are DESTROYED (not in origin/main = not allowed).
  #
  # Protected: 22 files (7 kernel + 3 governance + 10 workflows + 2 config)
  #
  # See: docs/architecture/OPUS/024-KERNEL-PROTECTION-AUDIT.md
  - repo: local
    hooks:
      - id: kernel-is-eternal
        name: ☢️ Nuclear Auto-Restore (TOTAL LOCKDOWN)
        entry: scripts/governance/restore_kernel.sh
        language: script
        files: ^(vibe_core/(kernel_impl|kernel_ops|plugin_protocol|plugin_loader|narasimha|capability_registry|bridge)\.py|scripts/governance/(restore_kernel\.sh|verify_kernel\.py|kernel_hashes\.json)|\.github/workflows/.*\.ya?ml|\.pre-commit-config\.yaml|\.gitignore)$
        stages: [commit]

  # =========================================================================
  # VAJRA WIRING ENFORCEMENT - OPUS-070
  # =========================================================================
  # Detects orphan components that bypass kernel injection.
  # All analyst tools MUST be wired via inject_kernel().
  # See: docs/architecture/OPUS/070-VAJRA-WIRING-MAP.md
  - repo: local
    hooks:
      - id: vajra-orphan-detector
        name: ⚡ VAJRA Orphan Detector
        entry: python -m vibe_core.vajra.scanner --strict
        language: system
        pass_filenames: false
        always_run: true
        stages: [commit]
