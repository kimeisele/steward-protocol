# =============================================================================
# MAHAMANTRA CLI - Self-Manifesting Commands
# =============================================================================
#
# "harer nama harer nama harer namaiva kevalam
#  kalau nasty eva nasty eva nasty eva gatir anyatha"
#
# The Mahamantra brings its own CLI. No hardcoding in UnifiedCLI.
# The truth is IN the module (Svatah-pramana), not in the router.
#
# DESIGN:
#   - This manifest is auto-discovered by CLILoaderProtocol
#   - Commands declare their handlers (module:function)
#   - The loader calls the handler when invoked
#   - NO MANUAL WIRING in unified_cli.py
#
# =============================================================================

name: mahamantra
namespace: mahamantra
description: "The Great Rhythm - Awakening Protocol Commands"

commands:
  # ===========================================================================
  # SANKIRTAN - Mass DNA Injection (DASYAM - Servitude/Delegate)
  # ===========================================================================
  - name: sankirtan
    handler: "vibe_core.mahamantra.substrate.sankirtan:cli_sankirtan"
    help: "Inject Mahajana DNA into orphan files (FOLDER_IS_WIRING)"
    bhakti: dasyam
    execution_mode: offline
    options:
      - name: "--target"
        type: str
        help: "Filter by path or Mahajana name"
        required: false
      - name: "--live"
        flag: true
        help: "Execute injection (default: dry-run)"
      - name: "--report"
        flag: true
        help: "Print detailed report after injection"

  # ===========================================================================
  # SCAN - Code Discovery (SMARANAM - Remembering/Store)
  # ===========================================================================
  - name: scan
    handler: "vibe_core.mahamantra.substrate.scanner:cli_scan"
    help: "Scan codebase for Mahajana declarations"
    bhakti: smaranam
    execution_mode: offline
    options:
      - name: "--path"
        type: str
        help: "Path to scan (default: vibe_core/)"
        required: false
      - name: "--json"
        flag: true
        help: "Output as JSON"
      - name: "--orphans"
        flag: true
        help: "Show only orphan files (no declaration)"

  # ===========================================================================
  # RESOLVE - Mahajana Alias Resolution (VANDANAM - Requesting/Asking)
  # ===========================================================================
  - name: resolve
    handler: "vibe_core.mahamantra.commands:cli_resolve"
    help: "Resolve Mahajana by name, alias, or position"
    bhakti: vandanam
    execution_mode: offline
    options:
      - name: "name"
        type: str
        help: "Mahajana name, alias (creator/schopfer), or position (0-15)"
        required: true
      - name: "--json"
        flag: true
        help: "Output as JSON"

  # ===========================================================================
  # SERVE - Task Execution (PADA_SEVANAM - Serving the Feet/Execution)
  # ===========================================================================
  - name: serve
    handler: "vibe_core.mahamantra.commands:cli_serve"
    help: "Submit and execute tasks via JanakaService"
    bhakti: pada_sevanam
    execution_mode: offline
    options:
      - name: "task"
        type: str
        help: "Task description to execute"
        required: true
      - name: "--execute"
        flag: true
        help: "Execute immediately (default: queue only)"
      - name: "--priority"
        type: str
        help: "Task priority: critical, high, normal, low (default: normal)"
        required: false
      - name: "--json"
        flag: true
        help: "Output as JSON"

  # ===========================================================================
  # CHANT - Execute Mahamantra Cycle (KIRTANAM - Chanting/Emit)
  # ===========================================================================
  - name: chant
    handler: "vibe_core.mahamantra.commands:cli_chant"
    help: "Execute a Mahamantra cycle (16-step atomic operation)"
    bhakti: kirtanam
    execution_mode: offline
    options:
      - name: "--rounds"
        type: int
        help: "Number of rounds (default: 1)"
        required: false
        default: "1"
      - name: "--verbose"
        flag: true
        help: "Show each step"

  # ===========================================================================
  # LISTEN - Event Visibility (SRAVANAM - Hearing/Input)
  # ===========================================================================
  - name: listen
    handler: "vibe_core.mahamantra.commands:cli_listen"
    help: "Listen to system events (syscalls, violations)"
    bhakti: sravanam
    execution_mode: offline
    options:
      - name: "--source"
        type: str
        help: "Event source: syscalls, violations, all (default: all)"
        required: false
      - name: "--tail"
        type: int
        help: "Show last N entries (default: 10)"
        required: false
        default: "10"
      - name: "--severity"
        type: str
        help: "Filter by severity: CRITICAL, HIGH, MEDIUM, LOW"
        required: false
      - name: "--json"
        flag: true
        help: "Output as JSON"

  # ===========================================================================
  # VEDA - Veda-Explorer Interface (ATMA_NIVEDANAM - Self-Surrender)
  # ===========================================================================
  - name: veda
    handler: "vibe_core.mahamantra.commands:cli_veda"
    help: "Veda-Explorer - Neuro-Symbolic Chat Interface (steward chat → MANAS, steward veda → VedaExplorer)"
    bhakti: atma_nivedanam
    execution_mode: offline
    options:
      - name: "--message"
        type: str
        help: "Message to process (or use positional after options)"
        required: false
      - name: "--mode"
        type: str
        help: "Explorer mode: restricted, enhanced, creative (default: enhanced)"
        required: false
      - name: "--interactive"
        flag: true
        help: "Run in interactive REPL mode"
      - name: "--json"
        flag: true
        help: "Output as JSON"
