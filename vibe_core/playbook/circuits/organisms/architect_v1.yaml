circuit:
  id: "ARCHITECT_V1"
  entry_state: "ANALYSIS"
  description: "The General Contractor circuit that designs and executes micro-circuits for undefined problems."

  invariants:
    - "requester_id is not empty"
    - "raw_input is not empty"

  states:
    ANALYSIS:
      description: "Analyze the user request to determine the goal and constraints."
      operations:
        - action: "EXECUTE_SYSCALL"
          syscall_type: "SPAWN_COGNITION"
          params:
            agent_id: "architect"
            instruction: |
              Analyze the following user request and extract:
              1. The core GOAL.
              2. Any CONSTRAINTS (tools, steps, etc.).
              3. A structured CONTEXT for circuit generation.

              Request: {{ raw_input }}

              Return JSON:
              {
                "goal": "...",
                "context": { ... },
                "constraints": { "max_states": 5, "allowed_tools": "ALL" }
              }
      transitions:
        - to: "DESIGN"
          condition: "spawn_result.success == true"
        - to: "FAILURE"
          condition: "spawn_result.success == false"

    DESIGN:
      description: "Generate a micro-circuit to solve the analyzed goal."
      operations:
        - action: "GENERATE_MICRO_CIRCUIT"
          context: "{{ spawn_result.output.context }}"
          constraints: "{{ spawn_result.output.constraints }}"
      transitions:
        - to: "EXECUTION"
          condition: "generated_circuit is not empty"
        - to: "FAILURE"
          condition: "generated_circuit is empty"

    EXECUTION:
      description: "Recursively execute the generated micro-circuit."
      operations:
        - action: "EXECUTE_MICRO_CIRCUIT"
      transitions:
        - to: "SYNTHESIS"
          condition: "micro_result.success == true"
        - to: "FAILURE"
          condition: "micro_result.success == false"

    SYNTHESIS:
      description: "Synthesize the results of the micro-circuit execution."
      operations:
        - action: "EXECUTE_SYSCALL"
          syscall_type: "SPAWN_COGNITION"
          params:
            agent_id: "architect"
            instruction: |
              Review the execution results of the generated circuit and provide a final answer to the user.

              Original Request: {{ raw_input }}
              Goal: {{ spawn_result.output.goal }}
              Execution Output: {{ micro_result.output }}

              Return JSON:
              {
                "final_answer": "...",
                "summary": "..."
              }
      transitions:
        - to: "SUCCESS"
          condition: "spawn_result.success == true"

    SUCCESS:
      terminal: true
      output:
        result: "{{ spawn_result.output.final_answer }}"
        summary: "{{ spawn_result.output.summary }}"
        micro_circuit_id: "{{ generated_circuit.id }}"

    FAILURE:
      terminal: true
      output:
        error: "Architect failed to process request."
        details: "{{ micro_result.error }}"
