# ============================================================================
# COGNITIVE CIRCUIT: HEAL_CODEBASE_V1
# ============================================================================
# Core Architectural Self-Healing Circuit (VibeOS Native)
#
# Mission: Eliminate technical debt and architectural violations autonomously.
#
# This circuit is part of the vibe_core runtime and functions independently
# of optional cognitive plugins. It is driven by the UnifiedRouter.
#
# VEDA-4 State Machine:
#   SHABDA   → Capture violation report (from Watchman or CLI)
#   ARTHA    → Dispatch to Watchman for context analysis
#   PRATYAYA → Route based on violation type
#   KARMA    → Dispatch Task to ENGINEER agent
#   VERIFY   → Re-run inspection to confirm resolution
#   SUCCESS  → Commit fix via ARCHIVIST agent
#
# Architecture Note:
#   This circuit uses ONLY standard actions supported by circuit_engine.py:
#   - EXECUTE_SYSCALL (with syscall_type: DISPATCH_TASK)
#   The semantic router decides HOW each agent handles the task (deterministic or LLM).
# ============================================================================

circuit:
  id: "HEAL_CODEBASE_V1"
  type: "cognitive_circuit"
  version: "2.0"
  domain: "maintenance"
  security_level: "elevated"
  entry_state: "SHABDA"

  description: |
    Native VibeOS healing circuit. Resolves architectural violations
    detected by the StandardsInspectionTool.

    Input variables (must be provided by caller):
      - violation_type: e.g., "unsafe_io_write", "silent_failure"
      - file_path: Path to the violating file
      - line_number: Line where violation occurs
      - rule_id: Rule identifier from standards.yaml
      - fix_suggestion: Suggested fix from standards.yaml

  # Expected input variables
  variables:
    violation_type:
      type: string
      required: true
      description: "Type of violation (e.g., unsafe_io_write)"
    file_path:
      type: string
      required: true
      description: "Path to the file with violation"
    line_number:
      type: integer
      required: true
      description: "Line number of violation"
    rule_id:
      type: string
      required: false
      description: "Rule ID from standards.yaml"
    fix_suggestion:
      type: string
      required: false
      description: "Suggested fix pattern"

  states:
    # =========================================================================
    # SHABDA: Validate input - violation info must be present
    # =========================================================================
    SHABDA:
      name: "Shabda (Sound/Word)"
      description: "Validate violation report input"
      invariants:
        - "violation_type is not empty"
        - "file_path is not empty"
        - "line_number is not empty"
      transitions:
        - condition: "violation_type is not empty"
          to: ARTHA
        - condition: "true"
          to: FAILURE

    # =========================================================================
    # ARTHA: Context is already provided in input variables
    # The violation was detected by Watchman before circuit invocation.
    # We pass through to PRATYAYA to select the remedy strategy.
    # =========================================================================
    ARTHA:
      name: "Artha (Meaning)"
      description: "Context already captured - violation data is in input variables"
      # No operations needed - violation context (file_path, line_number,
      # violation_type, fix_suggestion) is already provided as input
      transitions:
        - condition: "violation_type is not empty"
          to: PRATYAYA
        - condition: "true"
          to: FAILURE

    # =========================================================================
    # PRATYAYA: Route based on violation type
    # =========================================================================
    PRATYAYA:
      name: "Pratyaya (Cognition)"
      description: "Select remedy strategy based on violation type"
      # No operations needed - just routing based on violation_type
      # The fix_suggestion from standards.yaml guides the engineer
      transitions:
        - condition: "violation_type is not empty"
          to: KARMA
        - condition: "true"
          to: FAILURE

    # =========================================================================
    # KARMA: Dispatch healing task to Engineer
    # =========================================================================
    KARMA:
      name: "Karma (Action)"
      description: "Dispatch architectural fix to Engineer agent"
      operations:
        - action: EXECUTE_SYSCALL
          syscall_type: DISPATCH_TASK
          params:
            agent_id: "engineer"
            task_payload:
              action: "heal_violation"
              file_path: "{{ file_path }}"
              line_number: "{{ line_number }}"
              violation_type: "{{ violation_type }}"
              rule_id: "{{ rule_id }}"
              fix_suggestion: "{{ fix_suggestion }}"
      transitions:
        - condition: "dispatch_task_result.success == true"
          to: VERIFY
        - condition: "true"
          to: FAILURE

    # =========================================================================
    # VERIFY: Check that the healing was successful
    # The KARMA state's dispatch_task_result contains the healing outcome.
    # If it succeeded, the violation pattern was replaced.
    # =========================================================================
    VERIFY:
      name: "Verify"
      description: "Verify healing was successful based on KARMA result"
      # The KARMA operation already returned success/failure
      # We can optionally run deep_inspection for full verification,
      # but for now we trust the tool's return value
      invariants:
        - "karma_result.success == true"
      transitions:
        - condition: "karma_result.success == true"
          to: SUCCESS
        - condition: "true"
          to: FAILURE

    # =========================================================================
    # SUCCESS: Healing complete - seal in ledger
    # =========================================================================
    SUCCESS:
      name: "Success"
      description: "Healing finalized - record in Parampara"
      terminal: true
      operations:
        - action: EXECUTE_SYSCALL
          syscall_type: DISPATCH_TASK
          params:
            agent_id: "archivist"
            task_payload:
              action: "seal_history"
              file_path: "{{ file_path }}"
              message: "fix(dharma): purged {{ rule_id }} violation"
              audit_result:
                passed: true
                violation_type: "{{ violation_type }}"
      output:
        status: "HEALED"
        file_path: "{{ file_path }}"
        violation_type: "{{ violation_type }}"
        rule_id: "{{ rule_id }}"

    # =========================================================================
    # FAILURE: Healing failed
    # =========================================================================
    FAILURE:
      name: "Failure"
      description: "Healing failed - escalate to human"
      terminal: true
      output:
        status: "HEALING_FAILED"
        file_path: "{{ file_path }}"
        violation_type: "{{ violation_type }}"
        reason: "Circuit could not complete healing"

  # Native grounding for the UnifiedRouter
  semantic_grounding:
    syscall_type: "EXECUTE_CIRCUIT"
    intent_patterns:
      - 'heal\s+codebase'
      - 'fix\s+standards'
      - 'purge\s+violation'
      - 'fix\s+architectural\s+debt'