# SIMPLE_QUERY - Self-contained query handler
# NO external agent dependencies - returns direct response
circuit:
  id: SIMPLE_QUERY
  description: Handle simple queries with direct response (no agent deps)
  domain: INTERFACE
  version: "2.0.0"
  entry_state: "process"

  states:
    process:
      name: "Process Query"
      description: "Process user query and generate response"
      actions:
        - action_type: EMIT_EVENT
          target: "query_received"
          params:
            query: "{{ user_input }}"
            status: "processing"
      on_success: COMPLETE
      on_failure: ABORT

    COMPLETE:
      name: "Query Complete"
      description: "Query processed successfully"
      terminal: true
      result:
        status: "success"
        message: "Request received: {{ user_input }}"

    ABORT:
      name: "Query Aborted"
      description: "Query aborted due to failure"
      terminal: true
      result:
        status: "failed"
        message: "Failed to process request"
