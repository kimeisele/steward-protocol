# OPUS Assistant Plugin - Default Configuration
#
# FRACTAL CONFIG PATTERN:
# 1. This file = shipped defaults (in plugin)
# 2. config/opus.yaml = system overrides (in project)
# 3. Runtime = merged (system > defaults)
#
# OPUS-015: This file is part of the .vibe container

# =============================================================================
# PLUGIN METADATA
# =============================================================================
plugin:
  id: opus_assistant
  version: "1.4.0"
  phase: 4  # Cognitive Circuits

# =============================================================================
# VERIFICATION ENGINE
# =============================================================================
verification:
  # Enable/disable verification
  enabled: true

  # Path to OPUS docs (relative to workspace)
  docs_path: docs/architecture/OPUS

  # Marker for @HARNESS sections
  harness_marker: "@HARNESS"

  # Trust score weights (must sum to 100)
  weights:
    files_exist: 20
    tests_exist: 15
    wiring_verified: 20
    semantic_passes: 25
    config_exists: 10
    doc_complete: 10

  # Thresholds
  thresholds:
    pass: 80
    warn: 60

  # Quick mode (skip semantic checks)
  quick_mode_default: false

# =============================================================================
# DRIFT DETECTION
# =============================================================================
drift:
  # Enable drift detection
  enabled: true

  # Check drift on boot (slows startup)
  check_on_boot: false

  # Default commit range for drift check
  default_since: "HEAD~10"

  # File patterns to track
  trackable_patterns:
    - "vibe_core/**/*.py"
    - "config/**/*.yaml"

  # Patterns to exclude
  exclude_patterns:
    - "**/tests/**"
    - "**/__pycache__/**"
    - "**/*.pyc"

# =============================================================================
# OPUS.MD GENERATION
# =============================================================================
generation:
  # Auto-generate OPUS.md on boot
  auto_generate: false

  # Output path (relative to workspace)
  output_path: "OPUS.md"

  # Include verification results
  include_verification: true

  # Include drift report
  include_drift: true

  # Include plugin status
  include_plugins: true

# =============================================================================
# SECTION PRESERVATION
# =============================================================================
preservation:
  # Section markers (NEVER overwrite these)
  human_start: "<!-- @HUMAN START -->"
  human_end: "<!-- @HUMAN END -->"
  ai_start: "<!-- @AI START -->"
  ai_end: "<!-- @AI END -->"
  auto_start: "<!-- @AUTO-GENERATED START -->"
  auto_end: "<!-- @AUTO-GENERATED END -->"

# =============================================================================
# KERNEL TICK (Heartbeat) - Phase 2: Dynamic Context
# =============================================================================
kernel_tick:
  # Enable periodic updates
  enabled: true

  # Event types to subscribe to
  subscribe_events:
    - "KERNEL_TICK"
    - "GIT_COMMIT"
    - "FILE_CHANGED"

  # Actions on tick (PHASE 2: Active context synthesis)
  on_tick:
    - synthesize_context  # ACTIVE: Inject "State of Mind" into runtime
    - quick_drift_check   # PASSIVE: Check for drift

  # Actions on commit (PHASE 2: Re-synthesize after code changes)
  on_commit:
    - synthesize_context  # ACTIVE: Git SHA changed, refresh context
    - detect_drift        # Check drift after commit
    - update_verification # Update verification scores

# =============================================================================
# CONTEXT SYNTHESIS (Phase 2 - Dynamic Bootstrapping)
# =============================================================================
context:
  # Enable context synthesis
  enabled: true

  # Synthesis frequency (every N ticks, 1 = every tick)
  tick_frequency: 1

  # Log context every N ticks (0 = never)
  log_frequency: 10

  # Include in system prompt generation
  include_git: true
  include_ledger: true
  include_kernel: true
  include_personas: true
  include_health: true
  include_focus: true

# =============================================================================
# CLI CONFIGURATION (Phase 3 - Remote Control)
# =============================================================================
cli:
  # Namespace for commands (steward opus:status, etc)
  namespace: "opus"

  # Default output format (human, json)
  default_format: "human"

  # Visual anchors for status (GAD-000 approved)
  status_icons:
    healthy: "🟢"
    warning: "🟡"
    critical: "🔴"
    inactive: "⚪"

  # Log display settings
  log:
    default_limit: 20
    max_limit: 100

# =============================================================================
# GAD-000 COMPLIANCE
# =============================================================================
gad_000:
  # Discoverability
  expose_capabilities: true

  # Observability
  expose_status: true

  # Parseability (structured output)
  structured_output: true

  # No rendering (data only, CLI formats for output)
  renders: false

  # CLI provides human-readable output when requested
  cli_formatting: true
