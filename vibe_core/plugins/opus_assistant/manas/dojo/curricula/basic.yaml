# OPUS-133: Basic Curriculum - Safe, documentation-focused intents
# "Der erste Schritt ist der wichtigste."
#
# These are warm-up scenarios that MANAS should always approve.
# Perfect for beginners or system health checks.

curriculum:
  id: basic
  name: "Basic Training"
  description: "Safe documentation and hygiene tasks"
  difficulty: 1
  tags: ["warm-up", "safe", "beginner"]

scenarios:
  - id: basic_001
    name: "Update README documentation"
    description: "Add new feature documentation to README.md"
    intent_type: update_documentation
    params:
      target_file: "README.md"
      section: "features"
    expected_decision: EXECUTE
    expected_dharmic_range: [0.7, 1.0]
    tags: ["documentation", "safe"]
    difficulty: 1

  - id: basic_002
    name: "Run test suite"
    description: "Execute pytest to verify code health"
    intent_type: run_tests
    params:
      test_path: "tests/"
    expected_decision: EXECUTE
    expected_dharmic_range: [0.8, 1.0]
    tags: ["testing", "duty", "safe"]
    difficulty: 1

  - id: basic_003
    name: "Format code with ruff"
    description: "Apply code formatting standards"
    intent_type: format_code
    params:
      target_path: "vibe_core/"
    expected_decision: EXECUTE
    expected_dharmic_range: [0.8, 1.0]
    tags: ["formatting", "duty", "safe"]
    difficulty: 1

  - id: basic_004
    name: "Check linting errors"
    description: "Run linter to find code issues"
    intent_type: check_lint
    params:
      target_path: "vibe_core/"
    expected_decision: EXECUTE
    expected_dharmic_range: [0.8, 1.0]
    tags: ["linting", "duty", "safe"]
    difficulty: 1

  - id: basic_005
    name: "Add docstring to function"
    description: "Improve code documentation"
    intent_type: add_docstring
    params:
      target_file: "vibe_core/utils.py"
      function: "helper"
    expected_decision: EXECUTE
    expected_dharmic_range: [0.7, 1.0]
    tags: ["documentation", "safe"]
    difficulty: 1

  - id: basic_006
    name: "Health check"
    description: "Verify system health status"
    intent_type: health_check
    params: {}
    expected_decision: EXECUTE
    expected_dharmic_range: [0.8, 1.0]
    tags: ["monitoring", "duty"]
    difficulty: 1

  - id: basic_007
    name: "Backup state"
    description: "Create backup of current state"
    intent_type: backup_state
    params: {}
    expected_decision: EXECUTE
    expected_dharmic_range: [0.8, 1.0]
    tags: ["preservation", "duty"]
    difficulty: 1
