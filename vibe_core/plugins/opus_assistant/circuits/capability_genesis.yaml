# CAPABILITY GENESIS CIRCUIT - The Ouroboros Protocol + VIDYA + GREMIUM + DIAMOND
# ================================================================================
# OPUS-032: Level 3 Autonomie - Tool Synthesis
# OPUS-033: VIDYA Integration - Knowledge Before Action
# OPUS-035: GREMIUM - AI Federation for Autonomous Decisions
# OPUS-036: DIAMOND PROTOCOL - TDD Law (Test-First Genesis)
#
# Philosophy:
#   "The serpent that consumes itself is reborn, ever-evolving."
#   "Before building something new, seek wisdom." - VIDYA Principle
#   "The council of validators speaks with one voice." - GREMIUM Principle
#   "RED before GREEN. Test before Code. No exceptions." - DIAMOND LAW
#
# This circuit enables MANAS to CREATE NEW TOOLS with KNOWLEDGE:
# - Triggered when MANAS detects a missing capability
# - Researches best practices via Science Cartridge (Jijnasa)
# - Checks existing knowledge library (Smriti)
# - DIAMOND: Generates TEST first (Pramana)
# - DIAMOND: RED Gate - Test MUST fail (proves non-trivial)
# - Generates plugin code based on research (Nirmana)
# - Validates code via VIDYA Critic
# - GREMIUM evaluates: auto-approve or escalate to human
# - DIAMOND: GREEN Gate - Test MUST pass (proves implementation)
# - Hot-loads to runtime_extensions/
#
# The Scientific Method (VIDYA + DIAMOND Workflow):
#   1. Jijnasa (Curiosity) - Research best practices
#   2. Smriti (Memory) - Check existing knowledge
#   3. Pramana (Proof) - Generate TEST first [DIAMOND]
#   4. RED Gate - Test MUST FAIL [DIAMOND]
#   5. Nirmana (Construction) - Generate implementation
#   6. VIDYA Critique - Static analysis
#   7. GREMIUM - Federation votes on approval
#   8. GREEN Gate - Test MUST PASS [DIAMOND]
#   9. Deployment - Hot-load to production
#
# DIAMOND PROTOCOL (TDD Law):
#   The Diamond is forged under pressure:
#   1. Generate TEST before CODE (inversion of control)
#   2. RED Gate: Test MUST fail - proves test isn't trivially true
#   3. GREEN Gate: Test MUST pass - proves implementation works
#   4. No hot-load until GREEN
#
# GREMIUM Decision Logic:
#   IF all validators pass AND risk <= threshold:
#     → AUTO-APPROVE (no human needed)
#   ELSE:
#     → ESCALATE to human via Intent Buffer
#
# Safety Gates (CRITICAL):
#   1. Research-First: No code without understanding
#   2. Library Check: Don't reinvent the wheel
#   3. DIAMOND RED: Test generated first, must fail
#   4. VIDYA Critique: Static analysis (AST-based)
#   5. GREMIUM: AI Federation decides (auto-approve OR escalate)
#   6. Narasimha Check: Secondary security validation
#   7. DIAMOND GREEN: Test must pass (replaces sandbox)
#   8. Reversible: Can be unloaded via hot_unload()
#
circuit:
  id: CAPABILITY_GENESIS
  name: "Capability Genesis - The Ouroboros Protocol + VIDYA + DIAMOND"
  description: "Generate new capabilities with TDD-first approach"
  domain: OPUS
  version: "3.0.0"  # OPUS-036: DIAMOND Protocol (TDD Law)
  entry_state: "validate_request"

  # Event triggers
  triggers:
    - event: CAPABILITY_MISSING
      description: "MANAS detected a needed but unavailable capability"
    - event: GENESIS_REQUEST
      description: "Manual request to generate a capability"
    - event: GENESIS_APPROVED
      description: "Human approved a pending capability intent"

  # Configuration
  config:
    output_dir: "vibe_core/plugins/runtime_extensions"
    require_approval: false  # CHANGED: Auto-approve if all validators pass
    auto_approve_threshold: "medium"  # NEW: auto-approve for low/medium risk
    require_research: true      # Require research phase
    require_vidya_check: true   # Require VIDYA critique
    max_pending_genesis: 3

    # DIAMOND PROTOCOL CONFIG (TDD Law):
    diamond_protocol:
      enabled: true             # OPUS-036: TDD is mandatory
      red_gate_required: true   # Test MUST fail before code
      green_gate_required: true # Test MUST pass before deploy
      test_timeout_seconds: 30  # Max time for test execution
      fail_on_trivial_test: true  # Reject tests that pass without implementation

    # GREMIUM RULES (AI Federation):
    # If ALL of these pass → auto-approve:
    #   1. DIAMOND RED Gate = test failed (as expected)
    #   2. VIDYA Critic (AST analysis) = passed
    #   3. DIAMOND GREEN Gate = test passed (implementation works)
    #   4. Narasimha Security = safe
    #   5. Risk Level <= auto_approve_threshold
    #
    # If ANY fail OR risk > threshold → escalate to human

  # Global invariants
  invariants:
    - "output_dir exists and is writable"
    - "capability_spec is well-formed"

  states:
    # =====================================================
    # PHASE 0: VALIDATION
    # =====================================================
    validate_request:
      name: "Validate Genesis Request"
      description: "Verify the capability request is valid"
      state_var: "validation_result"
      actions:
        - action_type: EXECUTE_SCRIPT
          target: "opus.genesis_validate_request"
          params:
            capability_name: "{{ capability_spec.name }}"
            capability_type: "{{ capability_spec.type }}"
            description: "{{ capability_spec.description }}"
      transitions:
        - condition: "validation_result.valid == true"
          to: check_pending_limit
        - condition: "validation_result.valid == false"
          to: reject_invalid

    check_pending_limit:
      name: "Check Pending Limit"
      description: "Verify we haven't exceeded max pending capabilities"
      state_var: "pending_count"
      actions:
        - action_type: EXECUTE_SCRIPT
          target: "opus.genesis_get_pending_count"
          params: {}
      transitions:
        - condition: "pending_count < config.max_pending_genesis"
          to: jijnasa_research
        - condition: "pending_count >= config.max_pending_genesis"
          to: queue_full

    # =====================================================
    # PHASE 1: JIJNASA (Research/Curiosity) - VIDYA
    # =====================================================
    jijnasa_research:
      name: "Jijnasa - Research Phase"
      description: "Research best practices before building"
      state_var: "research_result"
      actions:
        - action_type: EXECUTE_SCRIPT
          target: "opus.vidya_research"
          params:
            query: "How to implement {{ capability_spec.description }} safely in Python"
            capability_name: "{{ capability_spec.name }}"
      transitions:
        - condition: "research_result.success == true"
          to: smriti_check_library
        - condition: "research_result.success == false"
          to: smriti_check_library  # Continue even if research fails

    # =====================================================
    # PHASE 2: SMRITI (Memory) - Check Existing Knowledge
    # =====================================================
    smriti_check_library:
      name: "Smriti - Library Check"
      description: "Check if capability already exists in knowledge base"
      state_var: "library_result"
      actions:
        - action_type: EXECUTE_SCRIPT
          target: "opus.vidya_check_library"
          params:
            capability_name: "{{ capability_spec.name }}"
            tags: ["{{ capability_spec.type }}", "syscall"]
      transitions:
        - condition: "library_result.found == true"
          to: reuse_existing
        - condition: "library_result.found == false"
          to: generate_test  # DIAMOND: Test BEFORE code

    reuse_existing:
      name: "Reuse Existing Blueprint"
      description: "Capability already exists - reuse it"
      terminal: true
      result:
        status: "reused"
        capability_name: "{{ capability_spec.name }}"
        blueprint: "{{ library_result.blueprint }}"
        message: "Found existing blueprint - no need to regenerate"

    # =====================================================
    # PHASE 3: PRAMANA (Proof) - DIAMOND: Generate Test FIRST
    # =====================================================
    # "RED before GREEN. Test before Code. No exceptions."
    generate_test:
      name: "Pramana - Generate Test (DIAMOND RED)"
      description: "DIAMOND PROTOCOL: Generate test BEFORE implementation"
      state_var: "generated_test"
      actions:
        - action_type: EXECUTE_SCRIPT
          target: "opus.diamond_generate_test"
          params:
            capability_name: "{{ capability_spec.name }}"
            capability_type: "{{ capability_spec.type }}"
            description: "{{ capability_spec.description }}"
            syscall_name: "{{ capability_spec.syscall_name }}"
            parameters: "{{ capability_spec.parameters }}"
            research_insights: "{{ research_result.key_insights }}"
      on_success: red_gate
      on_failure: test_generation_failed

    # =====================================================
    # PHASE 3.5: RED GATE - Test MUST Fail
    # =====================================================
    # The test MUST fail because implementation doesn't exist yet.
    # If test passes → it's trivially true → REJECT
    red_gate:
      name: "RED Gate (DIAMOND Protocol)"
      description: "Test MUST fail - proves test isn't trivially true"
      state_var: "red_result"
      actions:
        - action_type: EXECUTE_SCRIPT
          target: "opus.diamond_red_gate"
          params:
            test_code: "{{ generated_test }}"
            capability_name: "{{ capability_spec.name }}"
            timeout_seconds: "{{ config.diamond_protocol.test_timeout_seconds }}"
      transitions:
        - condition: "red_result.test_failed == true"
          to: generate_code  # SUCCESS: Test failed as expected → now generate code
        - condition: "red_result.test_failed == false"
          to: red_gate_violated  # FAILURE: Test passed without implementation = BAD

    red_gate_violated:
      name: "RED Gate Violated"
      description: "Test passed without implementation - trivially true test rejected"
      terminal: true
      actions:
        - action_type: EXECUTE_SCRIPT
          target: "opus.log_observation"
          params:
            severity: "ERROR"
            message: "💎🚫 DIAMOND RED VIOLATED: Test passed without implementation for {{ capability_spec.name }}"
            source: "genesis.diamond"
      result:
        status: "diamond_red_violated"
        reason: "Test passed without implementation - indicates trivially true test"
        test_code: "{{ generated_test }}"
        message: "The Diamond Law was broken: RED phase requires test failure"

    test_generation_failed:
      name: "Test Generation Failed"
      description: "Could not generate test - DIAMOND blocks code generation"
      terminal: true
      result:
        status: "error"
        reason: "Test generation failed - cannot proceed without test (DIAMOND Law)"

    # =====================================================
    # PHASE 4: NIRMANA (Construction) - Generate Code
    # =====================================================
    generate_code:
      name: "Nirmana - Code Generation"
      description: "Synthesize the plugin code based on spec and research"
      state_var: "generated_code"
      actions:
        - action_type: EXECUTE_SCRIPT
          target: "opus.genesis_generate_code"
          params:
            capability_name: "{{ capability_spec.name }}"
            capability_type: "{{ capability_spec.type }}"
            description: "{{ capability_spec.description }}"
            syscall_name: "{{ capability_spec.syscall_name }}"
            parameters: "{{ capability_spec.parameters }}"
            research_insights: "{{ research_result.key_insights }}"
      on_success: vidya_critique
      on_failure: generation_failed

    # =====================================================
    # PHASE 4: PRAMANA (Proof) - VIDYA Critique
    # =====================================================
    vidya_critique:
      name: "Pramana - VIDYA Critique"
      description: "Static analysis via VIDYA Critic"
      state_var: "critique_result"
      actions:
        - action_type: EXECUTE_SCRIPT
          target: "opus.vidya_critique"
          params:
            code: "{{ generated_code }}"
            capability_name: "{{ capability_spec.name }}"
      transitions:
        - condition: "critique_result.passed == true"
          to: gremium_decision  # CHANGED: Go to Gremium for decision
        - condition: "critique_result.passed == false"
          to: critique_failed

    critique_failed:
      name: "VIDYA Critique Failed"
      description: "Code did not pass VIDYA static analysis"
      terminal: true
      actions:
        - action_type: EXECUTE_SCRIPT
          target: "opus.vidya_record_failure"
          params:
            capability_name: "{{ capability_spec.name }}"
            code: "{{ generated_code }}"
            error: "{{ critique_result.summary }}"
            findings: "{{ critique_result.findings }}"
      result:
        status: "critique_failed"
        reason: "{{ critique_result.summary }}"
        findings: "{{ critique_result.findings }}"

    # =====================================================
    # PHASE 5: GREMIUM DECISION (AI Federation)
    # =====================================================
    # The Gremium evaluates based on validation results.
    # If all checks pass AND risk <= threshold → auto-approve
    # Otherwise → escalate to human via Intent Buffer

    gremium_decision:
      name: "Gremium Decision"
      description: "AI Federation evaluates: VIDYA passed, should we auto-approve?"
      state_var: "gremium_result"
      actions:
        - action_type: EXECUTE_SCRIPT
          target: "opus.gremium_evaluate"
          params:
            capability_name: "{{ capability_spec.name }}"
            critique_result: "{{ critique_result }}"
            risk_level: "{{ capability_spec.risk | default('medium') }}"
            auto_threshold: "{{ config.auto_approve_threshold }}"
      transitions:
        - condition: "gremium_result.decision == 'auto_approve'"
          to: narasimha_check
        - condition: "gremium_result.decision == 'escalate'"
          to: submit_to_intent_buffer

    submit_to_intent_buffer:
      name: "Escalate to Human"
      description: "High-risk or failed validation - needs human approval"
      state_var: "intent_submitted"
      actions:
        - action_type: EXECUTE_SCRIPT
          target: "opus.genesis_submit_intent"
          params:
            capability_name: "{{ capability_spec.name }}"
            generated_code: "{{ generated_code }}"
            priority: "high"
            risk: "{{ gremium_result.risk_level }}"
            reasoning: "{{ gremium_result.escalation_reason }}"
            research_summary: "{{ research_result.summary }}"
      on_success: await_approval
      on_failure: submission_failed

    await_approval:
      name: "Awaiting Human Approval"
      description: "Gremium escalated - waiting for human decision"
      state_var: "approval_status"
      async: true
      actions:
        - action_type: EXECUTE_SCRIPT
          target: "opus.log_observation"
          params:
            severity: "WARN"
            message: "⚠️ GREMIUM ESCALATED: {{ capability_spec.name }} needs human approval ({{ gremium_result.escalation_reason }})"
            source: "genesis"
      transitions:
        - condition: "approval_status == 'approved'"
          to: narasimha_check
        - condition: "approval_status == 'rejected'"
          to: approval_rejected

    # =====================================================
    # PHASE 6: SECURITY VALIDATION (Defense in Depth)
    # =====================================================
    narasimha_check:
      name: "Narasimha Security Check"
      description: "Secondary security validation (defense in depth)"
      state_var: "security_result"
      actions:
        - action_type: EXECUTE_SCRIPT
          target: "opus.genesis_narasimha_check"
          params:
            code: "{{ generated_code }}"
            test_code: "{{ generated_test }}"  # DIAMOND: Also check test code
      transitions:
        - condition: "security_result.safe == true"
          to: green_gate  # DIAMOND: Go to GREEN Gate, not sandbox
        - condition: "security_result.safe == false"
          to: security_violation

    # =====================================================
    # PHASE 7: GREEN GATE (DIAMOND Protocol)
    # =====================================================
    # The test that FAILED in RED phase MUST now PASS.
    # This proves the implementation actually works.
    green_gate:
      name: "GREEN Gate (DIAMOND Protocol)"
      description: "Test MUST pass - proves implementation works"
      state_var: "green_result"
      actions:
        - action_type: EXECUTE_SCRIPT
          target: "opus.diamond_green_gate"
          params:
            test_code: "{{ generated_test }}"
            implementation_code: "{{ generated_code }}"
            capability_name: "{{ capability_spec.name }}"
            timeout_seconds: "{{ config.diamond_protocol.test_timeout_seconds }}"
      transitions:
        - condition: "green_result.test_passed == true"
          to: write_to_nursery  # SUCCESS: Test passed → deploy
        - condition: "green_result.test_passed == false"
          to: green_gate_failed  # FAILURE: Implementation doesn't work

    green_gate_failed:
      name: "GREEN Gate Failed"
      description: "Test failed after implementation - code doesn't work"
      terminal: true
      actions:
        - action_type: EXECUTE_SCRIPT
          target: "opus.log_observation"
          params:
            severity: "ERROR"
            message: "💎❌ DIAMOND GREEN FAILED: Test still fails after implementation for {{ capability_spec.name }}"
            source: "genesis.diamond"
        - action_type: EXECUTE_SCRIPT
          target: "opus.vidya_record_failure"
          params:
            capability_name: "{{ capability_spec.name }}"
            code: "{{ generated_code }}"
            test_code: "{{ generated_test }}"
            error: "{{ green_result.error }}"
      result:
        status: "diamond_green_failed"
        reason: "{{ green_result.error }}"
        stdout: "{{ green_result.stdout }}"
        stderr: "{{ green_result.stderr }}"
        message: "Implementation failed to make test pass - DIAMOND GREEN rejected"

    # =====================================================
    # PHASE 8: DEPLOYMENT
    # =====================================================
    write_to_nursery:
      name: "Write to The Nursery"
      description: "Write approved code AND test to runtime_extensions/"
      state_var: "write_result"
      actions:
        - action_type: EXECUTE_SCRIPT
          target: "opus.genesis_write_code"
          params:
            output_dir: "{{ config.output_dir }}"
            capability_name: "{{ capability_spec.name }}"
            generated_code: "{{ generated_code }}"
            generated_test: "{{ generated_test }}"  # DIAMOND: Write test file too
      on_success: store_blueprint
      on_failure: write_failed

    store_blueprint:
      name: "Store Blueprint"
      description: "Store successful blueprint in knowledge library"
      state_var: "store_result"
      actions:
        - action_type: EXECUTE_SCRIPT
          target: "opus.vidya_store_blueprint"
          params:
            capability_name: "{{ capability_spec.name }}"
            description: "{{ capability_spec.description }}"
            code: "{{ generated_code }}"
            test_code: "{{ generated_test }}"  # DIAMOND: Store test too
            tags: ["{{ capability_spec.type }}", "generated", "ouroboros", "diamond-verified"]
      on_success: hot_load
      on_failure: hot_load  # Continue even if storage fails

    hot_load:
      name: "Hot-Load Capability"
      description: "Load the new plugin at runtime"
      state_var: "load_result"
      actions:
        - action_type: EXECUTE_SCRIPT
          target: "opus.genesis_hot_load"
          params:
            plugin_path: "{{ write_result.plugin_path }}"
      on_success: genesis_complete
      on_failure: load_failed

    # =====================================================
    # TERMINAL STATES
    # =====================================================
    genesis_complete:
      name: "Genesis Complete"
      description: "The Ouroboros has evolved - new capability available"
      terminal: true
      actions:
        - action_type: EXECUTE_SCRIPT
          target: "opus.log_observation"
          params:
            severity: "INFO"
            message: "🐍💎 OUROBOROS + DIAMOND COMPLETE: {{ capability_spec.name }} is now available as {{ capability_spec.syscall_name }}"
            source: "genesis.diamond"
      result:
        status: "success"
        capability_name: "{{ capability_spec.name }}"
        syscall_name: "{{ capability_spec.syscall_name }}"
        diamond_verified: true
        message: "The serpent has evolved. (DIAMOND: RED→GREEN verified)"

    # Terminal: Invalid request
    reject_invalid:
      name: "Invalid Request"
      description: "Genesis request was malformed"
      terminal: true
      result:
        status: "rejected"
        reason: "{{ validation_result.error }}"

    # Terminal: Queue full
    queue_full:
      name: "Queue Full"
      description: "Too many capabilities awaiting approval"
      terminal: true
      result:
        status: "deferred"
        reason: "Max pending genesis reached ({{ config.max_pending_genesis }})"

    # Terminal: Generation failed
    generation_failed:
      name: "Generation Failed"
      description: "Could not generate capability code"
      terminal: true
      result:
        status: "error"
        reason: "Code generation failed"

    # Terminal: Submission failed
    submission_failed:
      name: "Submission Failed"
      description: "Could not submit to Intent Buffer"
      terminal: true
      result:
        status: "error"
        reason: "Intent submission failed"

    # Terminal: Approval rejected
    approval_rejected:
      name: "Approval Rejected"
      description: "Human rejected the generated capability"
      terminal: true
      actions:
        - action_type: EXECUTE_SCRIPT
          target: "opus.genesis_record_rejection"
          params:
            capability_name: "{{ capability_spec.name }}"
      result:
        status: "rejected"
        reason: "Human rejected via OPUS.md"

    # Terminal: Security violation
    security_violation:
      name: "Security Violation"
      description: "Narasimha detected unsafe code"
      terminal: true
      actions:
        - action_type: EXECUTE_SCRIPT
          target: "opus.log_observation"
          params:
            severity: "ERROR"
            message: "🚨 NARASIMHA BLOCKED: {{ capability_spec.name }} failed security check"
            source: "genesis"
      result:
        status: "blocked"
        reason: "Security check failed: {{ security_result.violations }}"

    # Terminal: Write failed
    write_failed:
      name: "Write Failed"
      description: "Could not write to runtime_extensions/"
      terminal: true
      result:
        status: "error"
        reason: "File write failed"

    # Terminal: Load failed
    load_failed:
      name: "Load Failed"
      description: "Hot-load failed"
      terminal: true
      result:
        status: "error"
        reason: "Plugin hot-load failed"

# Capability Types that can be generated
capability_types:
  syscall:
    description: "A new kernel syscall"
    template: "syscall_plugin.py.j2"
    risk: "high"
    requires_approval: true

  analyzer:
    description: "A new MANAS analyzer"
    template: "analyzer.py.j2"
    risk: "medium"
    requires_approval: true

  formatter:
    description: "A new output formatter"
    template: "formatter.py.j2"
    risk: "low"
    requires_approval: true

# Example capability specs
examples:
  - name: "yaml_analyzer"
    type: "analyzer"
    description: "Analyze YAML files for schema violations"
    syscall_name: "ANALYZE_YAML"
    parameters:
      - name: "file_path"
        type: "str"
        required: true
      - name: "schema_path"
        type: "str"
        required: false

  - name: "hello_world"
    type: "syscall"
    description: "Simple proof-of-concept: returns a greeting"
    syscall_name: "HELLO_WORLD"
    parameters:
      - name: "name"
        type: "str"
        default: "World"
