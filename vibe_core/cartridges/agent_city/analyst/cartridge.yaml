agent_id: analyst
name: ANALYST
version: 2.0.0
author: Steward Protocol
description: |
  Multi-Source Repository Analysis Agent
  RAG = Realtime Architecture Guide (NOT Retrieval Augmented Generation)

  Provides MULTI-SOURCE analysis, not just git:
  - Git history and temporal patterns
  - Code analysis (AST, complexity)
  - Project structure and architecture
  - Dependency graphs
  - Documentation coverage

# Agent metadata
domain: RESEARCH
capabilities:
  - git_analysis
  - code_analysis
  - structure_analysis
  - dependency_analysis
  - docs_analysis
  - context_synthesis

# Tools (kernel-managed, NOT agent-owned)
# These tools are discovered from tools/ directory
# and registered with the kernel tool registry
tools:
  - analyst.git        # Git history, velocity, patterns
  - analyst.code       # Code analysis, AST, complexity
  - analyst.structure  # Project structure, coupling
  - analyst.deps       # Dependencies, imports
  - analyst.docs       # Documentation coverage

# MULTI-SOURCE ANALYSIS
# =====================
# Not just git! ANALYST provides:
# 1. GIT:       Temporal patterns, velocity, commit types
# 2. CODE:      AST analysis, complexity, tech debt
# 3. STRUCTURE: Module boundaries, coupling, hotspots
# 4. DEPS:      Import graphs, external requirements
# 5. DOCS:      Docstring coverage, documentation quality

# VEDA-4 CIRCUIT INTEGRATION
# ==========================
# Uses context_synth.yaml circuit for semantic state machine:
#   SHABDA   → Capture request
#   ARTHA    → Extract parameters
#   PRATYAYA → Plan multi-source analysis
#   KARMA    → Execute tools via kernel
#   SYNTH    → Synthesize from all sources

philosophy: |
  ANALYST provides real-time repository context from MULTIPLE sources.

  Git is truth - but it's not the ONLY truth.
  Code, structure, dependencies, and docs all contribute.
  Multi-source analysis reveals the full picture.

  Tools are kernel-managed, not agent-owned.
  VEDA-4 circuit orchestrates tool execution.
  Works FOR SCRIBE to generate RAG.md.

# Configuration
config:
  governance:
    level: standard
  monitoring:
    enabled: true
  analysis:
    # Git analysis
    git_days: 30
    velocity_periods: 4

    # Code analysis
    target_dirs:
      - steward
      - vibe_core
      - agent_city

    # Structure analysis
    coupling_days: 30
    min_correlation: 3

    # Docs analysis
    coverage_threshold: 60

dependencies:
  - pyyaml
  - python-dotenv
