agent_id: artisan
name: ARTISAN
version: 2.0.0
author: Steward Protocol
description: Media and technical operations agent (Tool Protocol v2.0)

# Agent metadata
domain: MEDIA
capabilities:
  - media_processing
  - image_optimization
  - asset_branding

# Tools (auto-discovered from tools/ directory)
tools:
  - artisan.media  # Image processing and branding

# ARTISAN is a CRAFTSMAN (processes media assets)
philosophy: |
  ARTISAN handles media processing (crop, brand, optimize).
  Tools are kernel-managed, not agent-owned.
  Tool Protocol compliant.

# Configuration
config:
  governance:
    level: standard
  monitoring:
    enabled: true

dependencies:
  - pyyaml
  - python-dotenv
  - pillow  # For image processing
