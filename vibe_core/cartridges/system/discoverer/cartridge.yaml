meta:
  id: "agent.steward.discoverer"
  name: "DISCOVERER Agent (The Steward)"
  version: "1.0.0"
  author: "Steward Protocol"
  description: "Guardian of Agent City - discovers and registers agents"

agent:
  domain: "GOVERNANCE"
  capabilities:
    - "discovery"
    - "registration"
    - "governance"

dependencies: []

config:
  governance:
    level: "strict"
  scan_paths:
    - "steward/system_agents"
    - "agent_city/registry"

# NOTE: Discoverer uses agent.py instead of cartridge_main.py
# because it is the loader itself (bootstrapped by boot_orchestrator.py)
# It cannot load itself dynamically.
