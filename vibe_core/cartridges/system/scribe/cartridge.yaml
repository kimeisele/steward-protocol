meta:
  id: "agent.steward.scribe"
  name: "SCRIBE Agent (The Documentarian)"
  version: "1.0.0"
  author: "Steward Protocol"
  description: "Documentation agent - UI rendering delegated to InterfacePlugin"

agent:
  domain: "INFRASTRUCTURE"
  capabilities:
    - "documentation"
    - "introspection"
    - "publishing"

dependencies:
  - "jinja2"
  - "pyyaml"

config:
  governance:
    level: "standard"
  output:
    sandbox_enabled: true
