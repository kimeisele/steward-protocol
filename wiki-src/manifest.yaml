    wiki_name: Canonical-Atlas
    page_class: derived
    authority: derived
    domain: reference
    section: reference
    renderer: atlas
    nav_label: Canonical Atlas
    featured: true
    query_aliases: [canonical atlas, canonical docs]
    description: Automated registry of bound source documents and neighboring canonical material.
    render_config:
      intro: Machine-derived atlas of the public canon and its neighboring source trees.
      include_page_classes: [canonical]
      exclude_page_types: [CANONICAL_ATLAS]
      source_paths: [README.md, INDEX.md, CONSTITUTION.md, AGI_MANIFESTO.md, STEWARD.md, PROTOCOLS.md, ARCHITECTURE.md, KERNEL.md]
      source_roots: [docs/steward, docs/governance]
      source_suffixes: [.md]

  - id: PROTOCOL_ATLAS
    title: Protocol Atlas
    wiki_name: Protocol-Atlas
    page_class: derived
    authority: derived
    domain: reference
    section: reference
    renderer: atlas
    nav_label: Protocol Atlas
    featured: false
    query_aliases: [protocol atlas, architecture atlas]
    description: Automated protocol, architecture, and steward reference map.
    render_config:
      intro: Machine-derived atlas of the protocol stack and architecture reference corpus.
      include_domains: [protocol]
      exclude_page_types: [PROTOCOL_ATLAS]
      source_paths: [PROTOCOLS.md, ARCHITECTURE.md, KERNEL.md]
      source_roots: [docs/architecture, docs/steward]
      source_suffixes: [.md]

