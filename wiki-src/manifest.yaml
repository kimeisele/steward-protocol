version: 2

sections:
  - id: start-here
    title: Start Here
  - id: governance
    title: Governance
  - id: protocol-stack
    title: Protocol Stack
  - id: federation-surface
    title: Federation Surface
  - id: reference
    title: Reference Atlases

pages:
  - id: HOME
    title: Home
    wiki_name: Home
    page_class: hybrid
    authority: generated
    domain: entrypoint
    section: start-here
    renderer: home
    nav_label: Home
    featured: true
    query_aliases: [wiki, home]
    description: Federation front door and publication overview.

  - id: START_HERE
    title: Start Here
    wiki_name: Start-Here
    page_class: canonical
    authority: informative
    domain: entrypoint
    section: start-here
    renderer: canonical_doc
    source_path: README.md
    nav_label: Start Here
    featured: true
    query_aliases: [start here, readme, quickstart]
    description: Operating-system overview and quick start.

  - id: INDEX
    title: Index
    wiki_name: Index
    page_class: canonical
    authority: informative
    domain: reference
    section: start-here
    renderer: canonical_doc
    source_path: INDEX.md
    nav_label: Index
    featured: false
    query_aliases: [index, documentation index]
    description: Canonical documentation index bound from the repository.

  - id: CONSTITUTION
    title: Constitution
    wiki_name: Constitution
    page_class: canonical
    authority: binding
    domain: governance
    section: governance
    renderer: canonical_doc
    source_path: CONSTITUTION.md
    nav_label: Constitution
    featured: true
    query_aliases: [constitution, law]
    description: Supreme law and federation root of trust.

  - id: GOVERNANCE_INDEX
    title: Governance Index
    wiki_name: Governance-Index
    page_class: derived
    authority: derived
    domain: governance
    section: governance
    renderer: governance_index
    nav_label: Governance Index
    featured: true
    query_aliases: [governance, governance index]
    description: Canonical governance landing and constitutional structure map.

  - id: GOVERNANCE_ATLAS
    title: Governance Atlas
    wiki_name: Governance-Atlas
    page_class: derived
    authority: derived
    domain: governance
    section: governance
    renderer: atlas
    nav_label: Governance Atlas
    featured: false
    query_aliases: [governance atlas, governance references]
    description: Automated deeper governance references and enforcement sources.
    render_config:
      intro: Derived atlas of constitutional, doctrinal, and governance-adjacent sources.
      include_domains: [governance]
      exclude_page_types: [GOVERNANCE_ATLAS]
      source_paths: [CONSTITUTION.md, AGI_MANIFESTO.md, STEWARD.md]
      source_roots: [docs/governance, docs/philosophy, vibe_core/governance]
      source_suffixes: [.md, .py]

  - id: AGI_MANIFESTO
    title: AGI Manifesto
    wiki_name: AGI-Manifesto
