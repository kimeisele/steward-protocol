version: 3

sections:
  - id: start-here
    title: Overview
  - id: governance
    title: Governance
  - id: protocol-stack
    title: Architecture & Protocols
  - id: federation-surface
    title: Runtime Surface
  - id: reference
    title: Reference

canonical_discovery:
  defaults:
    page_class: canonical
    renderer: canonical_doc
    authority: informative
    domain: reference
    section: reference
    include_in_sidebar: true
  include_paths:
    - README.md
    - INDEX.md
    - CONSTITUTION.md
    - AGI_MANIFESTO.md
    - STEWARD.md
    - PROTOCOLS.md
    - ARCHITECTURE.md
    - KERNEL.md
  rules:
    - id: START_HERE
      match_path: README.md
      title: Start Here
      wiki_name: Start-Here
      nav_label: Start Here
      domain: entrypoint
      section: start-here
      featured: true
      query_aliases: [start here, readme, quickstart]
    - id: INDEX
      match_path: INDEX.md
      title: Index
      wiki_name: Index
      nav_label: Index
      featured: false
      query_aliases: [index, documentation index]
    - id: CONSTITUTION
      match_path: CONSTITUTION.md
      title: Constitution
      wiki_name: Constitution
      authority: binding
      domain: governance
      section: governance
      featured: true
      query_aliases: [constitution, law]
    - id: AGI_MANIFESTO
      match_path: AGI_MANIFESTO.md
      title: AGI Manifesto
      wiki_name: AGI-Manifesto
      authority: doctrine
      domain: governance
      section: governance
      featured: true
      query_aliases: [manifesto, agi manifesto]
    - id: STEWARDSHIP
      match_path: STEWARD.md
      title: Steward Operating Model
      wiki_name: Stewardship
      nav_label: Steward Model
      authority: operative
      domain: governance
      section: governance
      featured: true
      query_aliases: [steward, stewardship, steward model]
    - id: PROTOCOLS
      match_path: PROTOCOLS.md
      title: Protocols
      wiki_name: Protocols
      authority: binding
      domain: protocol
      section: protocol-stack
      featured: true
      query_aliases: [protocols, protocol]
    - id: ARCHITECTURE
      match_path: ARCHITECTURE.md
      title: Architecture
      wiki_name: Architecture
      authority: reference
      domain: protocol
      section: protocol-stack
      featured: true
      query_aliases: [architecture, system architecture]
    - id: KERNEL
      match_path: KERNEL.md
      title: Kernel
      wiki_name: Kernel
      authority: informative
      domain: protocol
      section: protocol-stack
      featured: false
      query_aliases: [kernel]

derived_pages:
  - id: HOME
    title: Home
    wiki_name: Home
    page_class: hybrid
    authority: generated
    domain: entrypoint
    section: start-here
    renderer: home
    nav_label: Home
    featured: true
    query_aliases: [wiki, home]
    description: Public documentation entry point derived from repository and runtime state.

  - id: GOVERNANCE_INDEX
    title: Governance Overview
    wiki_name: Governance-Index
    page_class: derived
    authority: derived
    domain: governance
    section: governance
    renderer: governance_index
    nav_label: Governance Overview
    featured: true
    query_aliases: [governance, governance overview, governance index]
    description: Constitutional landing page with governance sources and structure.

  - id: GOVERNANCE_ATLAS
    title: Governance Atlas
    wiki_name: Governance-Atlas
    page_class: derived
    authority: derived
    domain: governance
    section: governance
    renderer: atlas
    nav_label: Governance Atlas
    featured: false
    query_aliases: [governance atlas, governance references]
    description: Automatically discovered governance-adjacent references and enforcement sources.
    render_config:
      intro: Derived atlas of constitutional, doctrinal, and governance-adjacent sources.
      include_domains: [governance]
      exclude_page_types: [GOVERNANCE_ATLAS]
      source_paths: [CONSTITUTION.md, AGI_MANIFESTO.md, STEWARD.md]
      source_roots: [docs/governance, docs/philosophy, vibe_core/governance]
      source_suffixes: [.md, .py]

  - id: FEDERATION_REGISTRY
    title: Agent Registry
    wiki_name: Federation-Registry
    page_class: derived
    authority: derived
    domain: federation
    section: federation-surface
    renderer: pantheon
    nav_label: Agent Registry
    featured: true
    query_aliases: [federation registry, agent registry, agents, pantheon]
    description: Runtime-facing registry of declared agents, domains, and capabilities.

  - id: MAP
    title: System Map
    wiki_name: Map
    page_class: derived
    authority: derived
    domain: federation
    section: federation-surface
    renderer: map
    nav_label: System Map
    featured: true
    query_aliases: [system map, map, topology, architecture map]
    description: Data-driven topology built from repository structure, manifests, and graph state.

  - id: CANONICAL_ATLAS
    title: Document Atlas
    wiki_name: Canonical-Atlas
    page_class: derived
    authority: derived
    domain: reference
    section: reference
    renderer: atlas
    nav_label: Document Atlas
    featured: true
    query_aliases: [document atlas, canonical atlas, canonical docs]
    description: Machine-readable atlas of bound source documents and nearby reference material.
    render_config:
      intro: Machine-derived atlas of the public canon and neighboring source trees.
      include_page_classes: [canonical]
      exclude_page_types: [CANONICAL_ATLAS]
      source_paths: [README.md, INDEX.md, CONSTITUTION.md, AGI_MANIFESTO.md, STEWARD.md, PROTOCOLS.md, ARCHITECTURE.md, KERNEL.md]
      source_roots: [docs/steward, docs/governance]
      source_suffixes: [.md]

  - id: PROTOCOL_ATLAS
    title: System Atlas
    wiki_name: Protocol-Atlas
    page_class: derived
    authority: derived
    domain: reference
    section: reference
    renderer: atlas
    nav_label: System Atlas
    featured: false
    query_aliases: [system atlas, protocol atlas, architecture atlas]
    description: Protocol, architecture, and operating-model references discovered from the repo.
    render_config:
      intro: Machine-derived atlas of the protocol stack and architecture reference corpus.
      include_domains: [protocol]
      exclude_page_types: [PROTOCOL_ATLAS]
      source_paths: [PROTOCOLS.md, ARCHITECTURE.md, KERNEL.md]
      source_roots: [docs/architecture, docs/steward]
      source_suffixes: [.md]

  - id: SIDEBAR
    title: Sidebar
    wiki_name: _Sidebar
    page_class: navigation
    authority: navigation
    domain: navigation
    section: navigation
    renderer: sidebar
    include_in_sidebar: false

  - id: FOOTER
    title: Footer
    wiki_name: _Footer
    page_class: navigation
    authority: navigation
    domain: navigation
    section: navigation
    renderer: footer
    include_in_sidebar: false

