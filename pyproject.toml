[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steward-protocol"
version = "0.2.0"
description = "Cryptographic Identity + Governance for AI Agents. A.G.I. Infrastructure."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "kimeisele", email = "contact@steward-protocol.io"},
]
keywords = ["ai", "agents", "governance", "cryptography", "identity", "autonomous", "protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    # Core Framework
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.1",
    "ecdsa>=0.18.0",
    "rich>=13.0.0",
    "cryptography>=41.0.0",
    "cffi>=1.15.0",
    "libcst>=1.0.0",
    "networkx>=3.0",  # LCOM4 cohesion analysis
    # Semantic AI (PROJECT JNANA) - Not yet implemented, commented out for now
    # "sentence-transformers>=2.2.0",
    # "numpy>=1.24.0",
    # API & Web
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "requests>=2.31.0",
    "aiofiles>=23.2.1",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    # External APIs
    "tavily-python>=0.3.0",
    "tweepy>=4.14.0",
    "praw>=7.7.0",
    "PyGithub>=2.0.0",
    "google-api-python-client>=2.100.0",
    "google-generativeai>=0.8.5",
    # Templating
    "Jinja2>=3.0.0",
    # Utilities
    "gitpython>=3.1.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "psutil>=7.1.3",
    "jsonschema>=4.17.0",
    "tomlkit>=0.12.0",
    "networkx>=3.2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "ruff>=0.8.0", "pytest-cov>=4.1.0", "pytest-asyncio>=0.23.0", "pytest-timeout>=2.4.0", "pre-commit>=3.5.0", "pyinstaller>=6.0.0"]
local-llm = ["llama-cpp-python>=0.2.0", "huggingface-hub>=0.20.0"]
semantic = ["sentence-transformers>=2.2.0", "numpy>=1.24.0"]
full = ["sentence-transformers>=2.2.0", "numpy>=1.24.0", "llama-cpp-python>=0.2.0", "huggingface-hub>=0.20.0"]

[project.scripts]
steward = "vibe_core.cli:cli_entry"

[project.urls]
Documentation = "https://github.com/kimeisele/steward-protocol#readme"
Source = "https://github.com/kimeisele/steward-protocol"
Tracker = "https://github.com/kimeisele/steward-protocol/issues"
Leaderboard = "https://steward-protocol.io/leaderboard"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# ============================================================================
# OPUS-060 SATYA: TRUTH ENFORCEMENT (No Silent Failures)
# ============================================================================
#
# "Satyam Eva Jayate" - Only the truth prevails.
#
# These settings ensure that tests CANNOT silently fail or skip.
# If the test environment is broken, the entire suite MUST fail loudly.
# ============================================================================

# STRICT MODE: Unknown markers = IMMEDIATE FAILURE
addopts = "--strict-markers"

# Ignore patterns - exclude legacy/archived and broken tests
norecursedirs = [
    "tests/archive",
    "tests/fractal",  # Missing fractal_test_framework module
    ".git",
    "__pycache__",
    "*.egg-info",
]

# Timeout to prevent hanging tests (requires pytest-timeout)
timeout = 120

# Test file patterns - only files starting with test_
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Markers for test categorization (use: pytest -m "fast" or pytest -m "not slow")
# SATYA: ALL markers MUST be registered here. Unknown markers = build failure.
markers = [
    "fast: Quick unit tests (<1s)",
    "slow: Slow tests (>5s) - run with -m slow",
    "integration: Integration tests requiring kernel boot",
    "hardening: Stress/chaos/security tests",
    "security: Security-focused tests (penetration, crypto)",
    "asyncio: Async tests (handled by pytest-asyncio)",
    "vibe_plugins: Tests requiring specific Vibe plugins to be loaded",
]

# Warning filters - SATYA STRICT MODE (no hiding failures)
filterwarnings = [
    "error::pytest.PytestReturnNotNoneWarning",  # Tests MUST assert, not return
    "error::pytest.PytestUnknownMarkWarning",    # SATYA: Unknown markers = ERROR
    "ignore::DeprecationWarning:pydantic.*:",    # Ignore Pydantic deprecations
    "ignore:.*_DEFAULT_FIXTURE_LOOP_SCOPE_UNSET.*",  # Ignore pytest-asyncio scope warning
]

# Logging
log_cli = false
log_cli_level = "WARNING"

# Performance - parallel test execution (requires pytest-xdist)
# addopts = "-n auto"  # Uncomment when pytest-xdist is installed

[tool.hatch.build.targets.wheel]
packages = ["vibe_core"]

# ==============================================================================
# RUFF: Unified Linting & Formatting (replaces black, flake8, isort)
# ==============================================================================
[tool.ruff]
line-length = 120
target-version = "py39"  # Minimum supported version from pyproject.toml:10
exclude = [
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "data",
    "archive",
    "bin",
    "node_modules",
    "releases",
]

[tool.ruff.lint]
# Select same rules as current flake8 + isort
select = [
    "E",   # pycodestyle errors (E9xx covered)
    "F",   # pyflakes (F63, F7, F82 covered)
    "I",   # isort (import sorting)
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "F841",  # Unused variables (too many in TODO stubs, fix incrementally)
    "E741",  # Ambiguous variable names (l in list comps is fine)
    "E402",  # Import order (scripts need sys.path manipulation before imports)
    "F401",  # Unused imports (TYPE_CHECKING + optional deps are false positives)
]

# Same complexity limit as current flake8
[tool.ruff.lint.mccabe]
max-complexity = 15

# Known first-party modules for import sorting
[tool.ruff.lint.isort]
known-first-party = ["vibe_core", "agent_city"]

# Format settings (black-compatible)
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.4.0",
]

