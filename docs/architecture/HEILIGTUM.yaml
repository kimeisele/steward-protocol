# ============================================================================
# VERIFICATION RULES
# ============================================================================
# These rules are checked by verify_heiligtum.py
# ============================================================================

rules:
  # Every GAD in code MUST map to a pillar
  - name: "no_orphan_gads"
    description: "Every GAD reference in code must belong to a defined pillar"
    severity: "ERROR"

  # EPICs must be documented
  - name: "epic_documented"
    description: "Every pillar EPIC (X00/X000) must have a .md file"
    severity: "WARNING"

  # No gaps in critical pillars
  - name: "foundation_complete"
    description: "GAD-000 must be documented and referenced"
    severity: "ERROR"

  # Legacy should decrease over time
  - name: "legacy_shrinking"
    description: "LEGACY pillar refs should decrease, not increase"
    severity: "INFO"
