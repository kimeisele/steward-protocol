# 🛡️ PLAYBOOK: SAFE FEATURE IMPLEMENTATION (GAD-5500 + VEDA-4)
# The Sacred Loop: SHABDA → ARTHA → PRATYAYA → KARMA
#
# VEDA-4 Pattern (Sanskrit roots for AI cognition):
#   SHABDA (शब्द) - Capture Intent: Clarify what user wants
#   ARTHA (अर्थ)  - Validate Meaning: Verify the plan makes sense
#   PRATYAYA (प्रत्यय) - Negotiate Reality: Check conditions before acting
#   KARMA (कर्म)   - Execute & Verify: Do the work, verify result
#
# This playbook implements the "Safe Evolution Loop":
# 0. SHABDA: Capture and clarify user intent (NEW - VEDA-4)
# 1. KARMA (Engineer): Write code (in sandbox)
# 2. ARTHA (Auditor): Verify code quality
# 3. PRATYAYA (Gate): Check audit result
# 4. KARMA (Chronicle): Commit (only if audit PASSED)
#
# Philosophy: No code is committed without intent clarity AND audit approval.

playbook:
  id: "FEATURE_IMPLEMENT_SAFE_V1"
  name: "Safe Feature Implementation (VEDA-4: Intent → Code → Audit → Commit)"
  intent_match:
    primary: "implement_feature"
    secondary: ["add_feature", "write_code_safe", "implement_with_audit"]

  description: |
    VEDA-4 Feature Implementation with mandatory intent capture and code audit.

    The VEDA-4 Sacred Loop (GAD-5500):
    0. SHABDA: Capture user intent, clarify requirements
    1. KARMA:  ENGINEER writes code (sandboxed)
    2. ARTHA:  AUDITOR verifies code quality
    3. PRATYAYA: GATE evaluates audit result
       - If FAILED: Loop back to KARMA for fixes
       - If PASSED: Continue to commit
    4. KARMA:  CHRONICLE seals changes with signed commit

    This ensures: NO CODE WITHOUT CLEAR INTENT AND AUDIT APPROVAL

  phases:
    # ==================== PHASE 0: SHABDA - CAPTURE INTENT ====================
    - phase_id: "phase_0_shabda_capture_intent"
      name: "SHABDA: Capture and Clarify Intent"
      description: |
        VEDA-4 Phase 1: SHABDA (शब्द - Word/Sound)
        Before any code is written, we must understand what the user wants.
        This phase extracts structured requirements from raw input.

      actions:
        # Validate that we have minimum required information
        - action_type: "CHECK_STATE"
          target: "input_validation"
          params:
            required_fields: ["feature_description"]
            constraints:
              feature_description_min_length: 10

        # Emit intent captured event
        - action_type: "EMIT_EVENT"
          target: "intent_captured"
          params:
            raw_input: "{{ user_input }}"
            feature_name: "{{ feature_name }}"
            feature_description: "{{ feature_description }}"
            phase: "SHABDA"

      on_success: "phase_1_karma_engineer_write"
      on_failure: "phase_0b_shabda_clarify"
      timeout_seconds: 30
      state_var: "intent_captured"


    # ==================== PHASE 0B: SHABDA CLARIFY (ON FAILURE) ====================
    - phase_id: "phase_0b_shabda_clarify"
      name: "SHABDA: Request Intent Clarification"
      description: "User input unclear. Request more information."

      actions:
        - action_type: "EMIT_EVENT"
          target: "intent_unclear"
          params:
            message: "Intent unclear. Please provide more details about the feature."
            missing: "feature_description"
            phase: "SHABDA_CLARIFY"

      on_success: "ABORT"  # Cannot proceed without clear intent
      on_failure: "ABORT"
      timeout_seconds: 10
      state_var: "clarification_requested"


    # ==================== PHASE 1: KARMA - ENGINEER WRITES CODE ====================
    - phase_id: "phase_1_karma_engineer_write"
      name: "KARMA: Engineer Writes Code"
      description: |
        VEDA-4 Phase 4: KARMA (कर्म - Action)
        ENGINEER agent writes code based on captured intent.

      actions:
        - action_type: "CALL_AGENT"
          agent_id: "engineer"
          method: "write_code"
          params:
            # Intent from SHABDA phase
            prompt: "{{ feature_description }}"
            target_files: "{{ target_files }}"
            context: "{{ project_context }}"
            # Pass captured intent for traceability
            intent_ref: "{{ intent_captured }}"

      on_success: "phase_2_artha_audit_verify"
      on_failure: "phase_final_abort"
      timeout_seconds: 120
      requires_approval: false
      state_var: "code_written"


    # ==================== PHASE 2: ARTHA - AUDITOR VERIFIES ====================
    - phase_id: "phase_2_artha_audit_verify"
      name: "ARTHA: Auditor Verifies Code Quality"
      description: |
        VEDA-4 Phase 2: ARTHA (अर्थ - Meaning)
        AUDITOR checks if the code MEANS what it should (syntax, linting, tests, compliance).

      actions:
        - action_type: "CALL_AGENT"
          agent_id: "auditor"
          method: "verify_changes"
          params:
            path: "{{ code_written.path }}"
            # Verify against original intent
            expected_intent: "{{ feature_description }}"

      on_success: "phase_3_pratyaya_evaluate_gate"
      on_failure: "phase_3_pratyaya_evaluate_gate"
      timeout_seconds: 60
      state_var: "audit_result"


    # ==================== PHASE 3: PRATYAYA - EVALUATE AUDIT GATE ====================
    - phase_id: "phase_3_pratyaya_evaluate_gate"
      name: "PRATYAYA: Evaluate Audit Gate"
      description: |
        VEDA-4 Phase 3: PRATYAYA (प्रत्यय - Trust/Belief)
        Gate: Do we TRUST this code? Check if audit PASSED.

      actions:
        - action_type: "CHECK_STATE"
          target: "audit_gate"
          params:
            # Result is wrapped: {agent, result: {passed, ...}, params}
            check_field: "audit_result.result.passed"
            expected_value: true
            on_mismatch: "audit_failed"

      on_success: "phase_4_karma_chronicle_seal"
      on_failure: "phase_3b_pratyaya_audit_failed_loop"
      timeout_seconds: 10
      state_var: "audit_validated"


    # ==================== PHASE 3B: PRATYAYA FAILED - LOOP BACK ====================
    - phase_id: "phase_3b_pratyaya_audit_failed_loop"
      name: "PRATYAYA Failed - Return to KARMA"
      description: "Auditor rejected code. Trust not established. Loop back."

      actions:
        - action_type: "EMIT_EVENT"
          target: "pratyaya_failed"
          params:
            failures: "{{ audit_result.reason }}"
            phase: "PRATYAYA"
            action: "returning_to_karma"

      on_success: "phase_1_karma_engineer_write"
      on_failure: "phase_final_abort"
      timeout_seconds: 10
      state_var: "audit_failed_reported"


    # ==================== PHASE 4: KARMA - CHRONICLE SEALS ====================
    - phase_id: "phase_4_karma_chronicle_seal"
      name: "KARMA: Chronicle Seals History"
      description: |
        VEDA-4 Phase 4: KARMA (कर्म - Action)
        Final action: CHRONICLE creates signed commit (only after PRATYAYA passed).

      actions:
        - action_type: "CALL_AGENT"
          agent_id: "archivist"
          method: "seal_history"
          params:
            source_path: "{{ code_written.path }}"
            dest_path: "{{ code_written.path }}"
            audit_result: "{{ audit_result }}"
            message: "{{ feature_name }} (VEDA-4: intent verified, audit passed)"

      on_success: "phase_5_complete_success"
      on_failure: "phase_final_abort"
      timeout_seconds: 30
      requires_approval: false
      state_var: "commit_sealed"


    # ==================== PHASE 5: SUCCESS ====================
    - phase_id: "phase_5_complete_success"
      name: "VEDA-4 Complete - Feature Implemented"
      description: "Feature successfully implemented through SHABDA → ARTHA → PRATYAYA → KARMA"

      actions:
        - action_type: "EMIT_EVENT"
          target: "veda4_complete_success"
          params:
            feature_name: "{{ feature_name }}"
            status: "success"
            message: "VEDA-4 Complete: Intent captured, code verified, trust established, action sealed"
            phases_completed: ["SHABDA", "KARMA", "ARTHA", "PRATYAYA", "KARMA"]

      on_success: "COMPLETE"
      on_failure: "ABORT"
      timeout_seconds: 10
      state_var: "completed_successfully"


    # ==================== PHASE FINAL: ABORT ====================
    - phase_id: "phase_final_abort"
      name: "Abort - VEDA-4 Loop Failed"
      description: "Something went wrong in the VEDA-4 loop. Abort workflow."

      actions:
        - action_type: "EMIT_EVENT"
          target: "veda4_failed"
          params:
            reason: "Unexpected error or user abort"
            last_phase: "{{ current_phase }}"

      on_success: "ABORT"
      on_failure: "ABORT"
      timeout_seconds: 5
      state_var: "aborted"


  # ==================== TEMPLATE VARIABLES ====================
  variables:
    feature_name: "New Feature"
    feature_description: "Detailed description of what the feature should do"
    target_files: []
    project_context: "default"


# ==================== VEDA-4 EXPLANATION ====================
#
# VEDA-4 Pattern (Sanskrit roots for AI cognition):
#
# 1. SHABDA (शब्द - Word/Sound)
#    "What did you say?"
#    Captures raw input, extracts structured intent.
#    Without SHABDA, agents act on assumptions.
#
# 2. ARTHA (अर्थ - Meaning)
#    "What does this mean?"
#    Validates that output matches expected semantics.
#    The Auditor ensures code MEANS what it should.
#
# 3. PRATYAYA (प्रत्यय - Trust/Belief)
#    "Should we trust this?"
#    The Gate checks if conditions for proceeding are met.
#    Trust must be EARNED, not assumed.
#
# 4. KARMA (कर्म - Action)
#    "Execute the action."
#    Only after intent is clear and trust is established.
#    Actions have consequences - we act deliberately.
#
# This transforms "dumb LLMs" into structured cognition:
# - SHABDA ensures we understand before acting
# - ARTHA ensures our output makes sense
# - PRATYAYA ensures we verify before committing
# - KARMA ensures we act with full awareness
#
# The difference between chaos and order:
# Chaos: Input → Action (skip everything)
# Order: SHABDA → ARTHA → PRATYAYA → KARMA (full cognition)
#
