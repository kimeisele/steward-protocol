circuit:
  id: DEBATE_V1
  name: Philosophical Debate (Golden Standard)
  description: A dialectical engine using autonomous agents.
  domain: PHILOSOPHY
  intent_match:
    primary: PHILOSOPHY
    secondary:
      - DEBATE
      - ETHICS
      - CONSCIOUSNESS
  variables:
    topic: "The nature of consciousness"

  # Entry Point
  entry_state: THESIS

  # Global Invariants
  invariants:
    - "raw_input is not empty"

  states:
    THESIS:
      name: Thesis Generation
      description: Spawn a philosopher to argue FOR the topic.
      operations:
        - action: EXECUTE_SYSCALL
          syscall_type: SPAWN_COGNITION
          params:
            role: "philosopher"
            name: "Socrates_Pro"
            mission: "Construct a compelling argument for the topic."
            context: "You are a proponent of: {{ raw_input }}"
        - action: EXECUTE_SYSCALL
          syscall_type: DISPATCH_TASK
          params:
            agent_id: "{{ spawn_result.agent_id }}"
            task_payload:
              instruction: "Present a core argument for: {{ raw_input }}"
      transitions:
        - condition: "dispatch_task_result.success == true"
          to: ANTITHESIS
        - condition: "spawn_result.success == false"
          to: ABORT

    ANTITHESIS:
      name: Antithesis Generation
      description: Spawn a philosopher to argue AGAINST the topic.
      operations:
        - action: EXECUTE_SYSCALL
          syscall_type: SPAWN_COGNITION
          params:
            role: "philosopher"
            name: "Nietzsche_Con"
            mission: "Deconstruct the proposed argument."
            context: "You are a skeptic of: {{ raw_input }}"
        - action: EXECUTE_SYSCALL
          syscall_type: DISPATCH_TASK
          params:
            agent_id: "{{ spawn_result.agent_id }}"
            task_payload:
              instruction: "Refute this argument: {{ THESIS.dispatch_task_result.output }}"
      transitions:
        - condition: "dispatch_task_result.success == true"
          to: SYNTHESIS

    SYNTHESIS:
      name: Dialectical Synthesis
      description: Spawn a sage to resolve the conflict.
      operations:
        - action: EXECUTE_SYSCALL
          syscall_type: SPAWN_COGNITION
          params:
            role: "sage"
            name: "Aurobindo_Synth"
            mission: "Unify the opposing views into a higher truth."
            context: "You are a dialectical synthesizer."
        - action: EXECUTE_SYSCALL
          syscall_type: DISPATCH_TASK
          params:
            agent_id: "{{ spawn_result.agent_id }}"
            task_payload:
              instruction: "Synthesize a higher truth from: Thesis='{{ THESIS.dispatch_task_result.output }}' and Antithesis='{{ ANTITHESIS.dispatch_task_result.output }}'"
      transitions:
        - condition: "dispatch_task_result.success == true"
          to: SUCCESS

    SUCCESS:
      name: Debate Conclusion
      description: The debate is finished.
      terminal: true
      output:
        conclusion: "{{ dispatch_task_result.output }}"

    ABORT:
      name: "Debate Aborted"
      description: "Debate aborted due to failure"
      terminal: true
