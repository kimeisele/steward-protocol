name: STEWARD Protocol CI

on:
  push:
    branches: [ main, develop, claude/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # =========================================================================
  # JOB 1: Lint & Format Check
  # =========================================================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff linter (critical errors)
        run: |
          ruff check vibe_core scripts --select=E9,F63,F7,F82 --output-format=github

      - name: Run ruff linter (full check with stats)
        run: |
          ruff check vibe_core scripts --output-format=github --statistics || true

      - name: Check formatting
        run: |
          ruff format --check --diff vibe_core scripts

  # =========================================================================
  # JOB 2: Agent Certification Verification
  # =========================================================================
  verify-agents:
    name: Verify Agent Certifications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify agent manifests
        run: python scripts/ci/verify_agents_manifest.py

  # =========================================================================
  # JOB 3: Infrastructure Health Check
  # =========================================================================
  infrastructure-check:
    name: Infrastructure Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check git hooks installation
        run: |
          echo "🔍 Checking git hooks installation..."
          python scripts/setup_hooks.py || true
          echo "✅ Infrastructure check complete"

  # =========================================================================
  # JOB 4: Watchman Deep Inspection (Layer 2)
  # =========================================================================
  watchman-inspection:
    name: Watchman Deep Inspection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Watchman Deep Inspection
        run: python scripts/ci/run_watchman_inspection.py

      - name: Upload Watchman Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchman-inspection-report
          path: watchman_report.json
          retention-days: 30

      - name: Comment on PR (if violations found)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('watchman_report.json', 'utf8'));

            let comment = '## ⚔️ WATCHMAN Deep Inspection Report\n\n';
            comment += `**Status:** ❌ CRITICAL VIOLATIONS DETECTED\n\n`;
            comment += `**Total violations:** ${report.total_violations}\n`;
            comment += `**Critical violations:** ${report.critical_count}\n\n`;

            comment += '### Violations by Agent\n\n';
            for (const [agent, count] of Object.entries(report.report.by_agent)) {
              comment += `- **${agent}:** ${count} violation(s)\n`;
            }

            comment += '\n### How to Fix\n\n';
            comment += '1. Use `agent.system.get_sandbox_path()` instead of `Path("data/...")`\n';
            comment += '2. Remove any `requirements.txt` files (use `pyproject.toml`)\n';
            comment += '3. See Phase 2 migration examples (Herald, Forum, Civic)\n';
            comment += '4. Review the full report in the CI artifacts\n\n';
            comment += '📖 **Documentation:** See `.githooks/README.md` for Defense in Depth architecture\n';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

  # =========================================================================
  # JOB 5: Auditor Constitutional Verdict (Layer 3)
  # =========================================================================
  auditor-verdict:
    name: Auditor Constitutional Verdict
    runs-on: ubuntu-latest
    needs: [watchman-inspection]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Render Constitutional Verdict
        run: python scripts/ci/run_constitutional_verdict.py

      - name: Upload Verdict Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditor-constitutional-verdict
          path: auditor_verdict.json
          retention-days: 30

      - name: Comment on PR (if violations found)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const verdict = JSON.parse(fs.readFileSync('auditor_verdict.json', 'utf8'));

            let comment = '## ⚖️ AUDITOR Constitutional Verdict\n\n';
            comment += `**Verdict:** ❌ ${verdict.verdict}\n\n`;
            comment += `**Total violations:** ${verdict.total_violations}\n\n`;

            comment += '### Violations by Severity\n\n';
            for (const [severity, count] of Object.entries(verdict.by_severity)) {
              if (count > 0) {
                comment += `- **${severity}:** ${count}\n`;
              }
            }

            if (verdict.by_article) {
              comment += '\n### Violations by Article\n\n';
              for (const [article, count] of Object.entries(verdict.by_article)) {
                comment += `- **${article}:** ${count}\n`;
              }
            }

            comment += '\n### How to Fix\n\n';
            comment += '1. Ensure all agents have `steward.json` and `STEWARD.md`\n';
            comment += '2. Add logging/audit trails (Article II: Accountability)\n';
            comment += '3. Implement `VibeAgent` protocol (Article VI: Interoperability)\n';
            comment += '4. Use `AgentSystemInterface` for governed operations (Article III)\n';
            comment += '5. Review the full verdict in the CI artifacts\n\n';
            comment += `📖 **Constitution Hash:** ${verdict.constitutional_hash}\n`;
            comment += '📜 **Reference:** See `CONSTITUTION.md` for full requirements\n';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

  # =========================================================================
  # JOB 6: Kernel Boot Test
  # =========================================================================
  kernel-boot:
    name: Kernel Boot Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run kernel boot test
        run: python scripts/ci/test_kernel_boot.py

  # =========================================================================
  # JOB 7: STEWARD CLI Test
  # =========================================================================
  cli-test:
    name: STEWARD CLI Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Test CLI help
        run: |
          python -m vibe_core.cli --help

      - name: Test CLI status (expect failure, kernel not running)
        run: |
          python -m vibe_core.cli status || echo "Expected failure: kernel not running"

      - name: Test CLI commands exist
        run: |
          for cmd in status verify lineage ps boot stop init discover introspect delegate; do
            python -m vibe_core.cli $cmd --help > /dev/null 2>&1 && echo "✅ Command exists: $cmd" || echo "❌ Command missing: $cmd"
          done

  # =========================================================================
  # JOB 8: Documentation Check
  # =========================================================================
  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check INDEX.md exists
        run: |
          if [ ! -f "INDEX.md" ]; then
            echo "❌ INDEX.md missing"
            exit 1
          fi
          echo "✅ INDEX.md found"

      - name: Check core docs exist
        run: |
          missing=0
          # Root docs (GAD-000 moved to docs/architecture/GAD-0XX/)
          for doc in README.md CONSTITUTION.md STEWARD.md AGI_MANIFESTO.md; do
            if [ ! -f "$doc" ]; then
              echo "❌ Missing: $doc"
              missing=$((missing + 1))
            else
              echo "✅ Found: $doc"
            fi
          done

          # Architecture docs (UNIVERSE_MIGRATION_PLAN archived - completed)
          for doc in ARCHITECTURE.md SYSTEM_OVERVIEW.md; do
            if [ ! -f "docs/architecture/$doc" ]; then
              echo "❌ Missing: docs/architecture/$doc"
              missing=$((missing + 1))
            else
              echo "✅ Found: docs/architecture/$doc"
            fi
          done

          if [ $missing -gt 0 ]; then
            echo "❌ FAIL: $missing core docs missing"
            exit 1
          fi
          echo "✅ PASS: All core docs present"

      - name: Check docs directory structure
        run: |
          for dir in docs/archive/migrations docs/architecture docs/guides; do
            if [ ! -d "$dir" ]; then
              echo "❌ Missing directory: $dir"
              exit 1
            else
              echo "✅ Found: $dir"
            fi
          done
          echo "✅ PASS: Documentation structure correct"

  # =========================================================================
  # JOB 9: Security Scan
  # =========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run security scan
        run: python scripts/ci/security_scan.py

  # =========================================================================
  # JOB 10: PANOPTICON+ Test Validation (Layer 4)
  # =========================================================================
  panopticon-validation:
    name: PANOPTICON+ Test Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run PANOPTICON+ Test Validation
        id: panopticon
        run: |
          python -c "
          import json
          from pathlib import Path
          from vibe_core.plugins.test_orchestration import validate_test_files

          test_files = list(Path('tests').glob('**/*.py'))
          results = validate_test_files([str(f) for f in test_files])

          blocked = [r for r in results if r['blocked']]
          warned = [r for r in results if r['verdict'] == 'warn']
          passed = [r for r in results if r['verdict'] == 'passed']

          report = {
              'total_files': len(results),
              'blocked': len(blocked),
              'warned': len(warned),
              'passed': len(passed),
              'blocked_files': [r['file_path'] for r in blocked],
              'violations': []
          }

          for r in blocked:
              for v in r.get('violations', []):
                  if v.get('severity') == 'critical':
                      report['violations'].append({
                          'file': r['file_path'],
                          'message': v.get('message', 'Unknown violation')
                      })

          with open('panopticon_report.json', 'w') as f:
              json.dump(report, f, indent=2)

          print(f'PANOPTICON+ Validation Results:')
          print(f'  Total files: {report[\"total_files\"]}')
          print(f'  BLOCKED: {report[\"blocked\"]}')
          print(f'  WARNED: {report[\"warned\"]}')
          print(f'  PASSED: {report[\"passed\"]}')

          if report['blocked'] > 0:
              print()
              print('BLOCKED FILES:')
              for f in report['blocked_files']:
                  print(f'  - {f}')
              exit(1)
          else:
              print()
              print('✅ All test files pass PANOPTICON+ validation')
          "

      - name: Upload PANOPTICON+ Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panopticon-validation-report
          path: panopticon_report.json
          retention-days: 30

      - name: Comment on PR (if violations found)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('panopticon_report.json', 'utf8'));

            let comment = '## 🔍 PANOPTICON+ Test Validation Report\n\n';
            comment += `**Status:** ❌ ${report.blocked} test file(s) blocked\n\n`;
            comment += `| Metric | Count |\n`;
            comment += `|--------|-------|\n`;
            comment += `| Total Files | ${report.total_files} |\n`;
            comment += `| Blocked | ${report.blocked} |\n`;
            comment += `| Warned | ${report.warned} |\n`;
            comment += `| Passed | ${report.passed} |\n\n`;

            if (report.blocked_files.length > 0) {
              comment += '### Blocked Files\n\n';
              for (const file of report.blocked_files) {
                comment += `- \`${file}\`\n`;
              }
            }

            if (report.violations.length > 0) {
              comment += '\n### Violations\n\n';
              for (const v of report.violations) {
                comment += `- **${v.file}:** ${v.message}\n`;
              }
            }

            comment += '\n### How to Fix\n\n';
            comment += '1. Use `TestAgents.compliant()` instead of custom Agent classes\n';
            comment += '2. Use `TestAgents.without_oath()` for governance rejection tests\n';
            comment += '3. Never manually set `self.oath_sworn = True/False`\n';
            comment += '4. See `vibe_core/plugins/test_orchestration/fixtures.py` for available fixtures\n\n';
            comment += '📖 **Reference:** See `knowledge/circuits/test_validation.yaml` for validation rules\n';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

  # =========================================================================
  # JOB 11: Build Summary
  # =========================================================================
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [lint, verify-agents, infrastructure-check, watchman-inspection, auditor-verdict, kernel-boot, cli-test, docs-check, security, panopticon-validation]
    if: always()

    steps:
      - name: Build summary
        run: |
          echo "========================================="
          echo "STEWARD Protocol CI - Build Summary"
          echo "========================================="
          echo ""
          echo "✅ All quality gates passed!"
          echo ""
          echo "Defense in Depth Architecture:"
          echo "  Layer 0: Infrastructure health - foundation"
          echo "  Layer 1: Pre-commit hook (fast grep) - 95% violation block"
          echo "  Layer 2: Watchman CI (AST analysis) - architectural violations"
          echo "  Layer 3: Auditor Verdict (constitutional judgment) - supreme law"
          echo "  Layer 4: PANOPTICON+ (test validation) - fixture compliance"
          echo ""
          echo "System is ready for deployment."
