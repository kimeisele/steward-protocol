# ETERNAL CI WORKFLOW - Ouroboros Self-Healing Loop
#
# VISNU PROTECTED: This file is part of the 21 immutable files.
# To add new CI checks, edit scripts/ci/ci.yaml - NO workflow changes needed.
#
# Pattern: ONE command forever. Manifest-driven discovery.

name: STEWARD Protocol CI

on:
  push:
    branches: [ main, develop, claude/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # =========================================================================
  # JOB 1: Setup + Steward CI (Manifest-Driven)
  # =========================================================================
  steward-ci:
    name: Steward CI (Ouroboros)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify core imports (fail-fast)
        run: |
          python -c "from vibe_core.kernel_impl import RealVibeKernel; print('Core imports OK')"

      - name: Run Steward CI (all hooks)
        run: |
          python -m vibe_core.cli ci run-all --continue-on-error

      - name: Upload Watchman Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchman-report
          path: watchman_report.json
          if-no-files-found: ignore
          retention-days: 30

  # =========================================================================
  # JOB 2: Kernel Integrity (VISNU) - The Watcher Watching Watchers
  # =========================================================================
  kernel-integrity:
    name: Kernel Integrity (VISNU)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Block kernel_hashes.json modification (PR only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "scripts/governance/kernel_hashes.json"; then
            echo "BLOCKED: kernel_hashes.json modified in same PR as kernel files"
            exit 1
          fi

      - name: Verify kernel integrity
        run: python scripts/governance/verify_kernel.py --verify

      - name: Nuclear Verification (TOTAL LOCKDOWN)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=1
          RING0_FILES="vibe_core/kernel_impl.py vibe_core/kernel_ops.py vibe_core/plugin_protocol.py vibe_core/plugin_loader.py vibe_core/narasimha.py vibe_core/capability_registry.py vibe_core/bridge.py scripts/governance/restore_kernel.sh scripts/governance/verify_kernel.py scripts/governance/kernel_hashes.json .github/workflows/attest.yml .github/workflows/container-build.yml .github/workflows/deploy.yml .github/workflows/factory.yml .github/workflows/heartbeat.yml .github/workflows/integration-tests.yml .github/workflows/scheduled-agents.yml .github/workflows/scribe-docs.yml .github/workflows/steward-ci.yml .github/workflows/system-cycle.yml .pre-commit-config.yaml"

          VIOLATIONS=""
          for file in $RING0_FILES; do
            if ! git diff --quiet origin/main -- "$file"; then
              VIOLATIONS="$VIOLATIONS $file"
            fi
          done

          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$file" ] || continue
            if ! git ls-tree origin/main -- "$file" | grep -q .; then
              VIOLATIONS="$VIOLATIONS $file (NEW)"
            fi
          done

          if [ -n "$VIOLATIONS" ]; then
            echo "NUCLEAR ALERT: TOTAL LOCKDOWN VIOLATED"
            echo "Files:$VIOLATIONS"
            exit 1
          fi

  # =========================================================================
  # JOB 3: Lint (Fast, Parallel)
  # =========================================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check (critical)
        run: ruff check vibe_core scripts --select=E9,F63,F7,F82 --output-format=github

      - name: Ruff format check
        run: ruff format --check vibe_core scripts

  # =========================================================================
  # JOB 4: Summary
  # =========================================================================
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [steward-ci, kernel-integrity, lint]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "STEWARD Protocol CI Complete"
          echo ""
          echo "Jobs:"
          echo "  steward-ci:        Manifest-driven hooks (scripts/ci/ci.yaml)"
          echo "  kernel-integrity:  VISNU protection (21 files)"
          echo "  lint:              Ruff format + critical errors"
          echo ""
          echo "To add CI checks: Edit scripts/ci/ci.yaml"
          echo "This workflow never changes."
