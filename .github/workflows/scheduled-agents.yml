name: "🏙️ Scheduled Agent Operations"

on:
  schedule:
    # Agent City Leaderboard: Every 6 hours
    - cron: "0 */6 * * *"
    # City Life (Autarky Protocol): Daily at 6:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
