name: "🧠 OPUS Assistant - Autonomous Cognition"

# =============================================================================
# OPUS-036: The Opus Control Loop
# =============================================================================
# This is OPUS's autonomous maintenance cycle.
# Every 4 hours, Opus wakes up and:
#   1. Scans code health (complexity_analyzer)
#   2. Checks doc freshness
#   3. Evaluates pending intents
#   4. Updates OPUS.md with findings
#
# Philosophy:
#   "The system that understands itself can improve itself."
#   This workflow is Opus's way of staying aware of the codebase.

on:
  schedule:
    # Every 4 hours
    - cron: "0 */4 * * *"

  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Run full codebase scan (slower)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pull-requests: write

env:
  COMPLEXITY_THRESHOLD: 15
  HOT_PATHS: |
    vibe_core/kernel_impl.py
    vibe_core/boot_orchestrator.py
    vibe_core/steward/daily_ritual.py

jobs:
  # =========================================================================
  # JOB 1: Code Health Scan
  # =========================================================================
  code-health:
    name: "🩺 Code Health Scan"
    runs-on: ubuntu-latest
    outputs:
      total_complexity: ${{ steps.scan.outputs.total_complexity }}
      threshold_breaches: ${{ steps.scan.outputs.threshold_breaches }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -e .

      - name: Run Complexity Analyzer
        id: scan
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          import json

          from vibe_core.plugins.runtime_extensions.complexity_analyzer.plugin_main import ComplexityAnalyzerPlugin

          plugin = ComplexityAnalyzerPlugin()

          hot_paths = [
              'vibe_core/kernel_impl.py',
              'vibe_core/boot_orchestrator.py',
              'vibe_core/steward/daily_ritual.py',
          ]

          total = 0
          breaches = []

          for path in hot_paths:
              result = plugin._handle_analyze_complexity(None, {'file_path': path})
              if result['success']:
                  total += result['total_complexity']
                  for func, complexity in result['function_complexity'].items():
                      if complexity > 15:
                          breaches.append(f'{path}::{func}={complexity}')

          print(f'Total complexity: {total}')
          print(f'Threshold breaches: {len(breaches)}')

          with open('$GITHUB_OUTPUT', 'a') as f:
              f.write(f'total_complexity={total}\n')
              f.write(f'threshold_breaches={len(breaches)}\n')

          # Write detailed report
          with open('complexity_report.json', 'w') as f:
              json.dump({'total': total, 'breaches': breaches}, f)
          "

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: complexity-report
          path: complexity_report.json

  # =========================================================================
  # JOB 2: Doc Freshness Check
  # =========================================================================
  doc-freshness:
    name: "📚 Doc Freshness Check"
    runs-on: ubuntu-latest
    outputs:
      stale_docs: ${{ steps.check.outputs.stale_docs }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Doc Freshness
        id: check
        run: |
          # Find docs not modified in last 30 days
          STALE=$(find docs/architecture/OPUS -name "*.md" -mtime +30 | wc -l)
          echo "stale_docs=$STALE" >> $GITHUB_OUTPUT
          echo "Found $STALE potentially stale docs"

  # =========================================================================
  # JOB 3: Update OPUS.md
  # =========================================================================
  update-opus:
    name: "📝 Update OPUS.md"
    runs-on: ubuntu-latest
    needs: [code-health, doc-freshness]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Opus Control Terminal
        run: |
          # Update the timestamp in OPUS.md
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          COMPLEXITY="${{ needs.code-health.outputs.total_complexity }}"
          BREACHES="${{ needs.code-health.outputs.threshold_breaches }}"
          STALE="${{ needs.doc-freshness.outputs.stale_docs }}"

          echo "🧠 OPUS Autonomous Scan Complete"
          echo "   Timestamp: $TIMESTAMP"
          echo "   Total Complexity: $COMPLEXITY"
          echo "   Threshold Breaches: $BREACHES"
          echo "   Stale Docs: $STALE"

          # The actual OPUS.md update would be done by the InterfacePlugin
          # This just logs the results for now

      - name: Commit Changes (if any)
        run: |
          git config user.name "opus-assistant[bot]"
          git config user.email "opus-assistant[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(opus): Autonomous health scan [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi

  # =========================================================================
  # JOB 4: Alert on Critical Issues
  # =========================================================================
  alert:
    name: "🚨 Critical Alerts"
    runs-on: ubuntu-latest
    needs: [code-health, doc-freshness]
    if: needs.code-health.outputs.threshold_breaches > 5

    steps:
      - name: Create Issue for Critical Complexity
        uses: actions/github-script@v7
        with:
          script: |
            const breaches = ${{ needs.code-health.outputs.threshold_breaches }};

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 OPUS Alert: ${breaches} complexity threshold breaches detected`,
              body: `## Autonomous Health Scan Alert\n\nThe OPUS Assistant detected **${breaches}** functions exceeding the complexity threshold (15).\n\nThis requires attention.\n\n---\n*Generated by OPUS Assistant Workflow*`,
              labels: ['opus-alert', 'code-health']
            });
