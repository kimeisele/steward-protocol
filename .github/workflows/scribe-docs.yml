name: 📚 SCRIBE - Auto-Generate Documentation (DISABLED - Legacy)

# DISABLED: Renderer modules moved/removed during OPUS refactor
# Re-enable when scribe tools are restored
on:
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force run (renderers currently missing)'
        required: true
        default: 'false'

# Legacy workflow - disabled until renderer modules restored
# Missing files: introspector.py, project_introspector.py, etc.
# TODO: Restore or remove after OPUS Phase 2 complete

permissions:
  contents: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    name: Generate Documentation with SCRIBE
    # Only run if explicitly forced (workflow disabled - missing renderer modules)
    if: github.event.inputs.force_run == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jinja2 toml pyyaml

      - name: 🚀 Generate all documentation (standalone)
        run: |
          python scripts/generate_docs.py

      - name: 📝 Check for documentation changes
        id: check-changes
        run: |
          if git diff --quiet HEAD; then
            echo "status=clean" >> $GITHUB_OUTPUT
          else
            echo "status=changed" >> $GITHUB_OUTPUT
            git diff --name-only
          fi

      - name: 📤 Commit and push documentation updates
        if: steps.check-changes.outputs.status == 'changed' && github.ref == 'refs/heads/main'
        env:
          COMMIT_MSG: |
            docs: 📚 Auto-regenerate documentation

            Generated by SCRIBE Agent (scripts/generate_docs.py):
            - README.md (project overview)
            - AGENTS.md (agent registry)
            - CITYMAP.md (system architecture)
            - HELP.md (system help)
            - INDEX.md (documentation index)
            - DASHBOARD.md (operational view)
            - RAG.md (realtime architecture guide)

            🤖 Automated by SCRIBE • Scheduled every 3 hours
            [skip ci]
        run: |
          git config --local user.email "scribe@agent-city.dev"
          git config --local user.name "SCRIBE Agent"
          git add README.md AGENTS.md CITYMAP.md HELP.md INDEX.md DASHBOARD.md RAG.md || true
          git commit -m "$COMMIT_MSG"
          git push

      - name: ✅ Documentation Status
        run: |
          echo "📊 Documentation generation complete"
          echo "Generated via standalone scripts (no kernel dependency)"
          echo "Files updated:"
          echo "  - README.md"
          echo "  - AGENTS.md"
          echo "  - CITYMAP.md"
          echo "  - HELP.md"
          echo "  - INDEX.md"
          echo "  - DASHBOARD.md"
          echo "  - RAG.md (basic mode)"
          echo ""
          echo "Note: OPERATIONS.md, SETTINGS.md, ENVOY.md require kernel boot"
