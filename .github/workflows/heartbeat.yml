name: 🫀 Heartbeat - Autonomous Task Orchestrator

on:
  push:
    branches: [main]

  # DISABLED: No API keys, Takshaka blocks all tools, produces zero output.
  # Re-enable when NodePulse/Holon gets proper secrets + tool access.
  # schedule:
  #   - cron: '0 * * * *'

  workflow_dispatch:
    # Allow manual triggering for testing

permissions:
  contents: write

jobs:
  heartbeat:
    name: Task Orchestration Pulse
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -e .[dev]

      - name: 🫀 Execute Heartbeat Pulse
        env:
          PYTHONUNBUFFERED: 1
        run: |
          python scripts/heartbeat.py

      - name: 📤 Push Changes
        if: success()
        run: |
          git config --global user.name "STEWARD Heartbeat"
          git config --global user.email "heartbeat@steward-protocol.local"

          # Check if there are changes
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to push"
          else
            git push origin ${GITHUB_REF#refs/heads/}
          fi

      - name: 📊 Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heartbeat-logs-${{ github.run_number }}
          path: |
            *.log
            .vibe/state/*.json
          retention-days: 7

  publish-authority-feed:
    name: Publish Authority Feed
    uses: kimeisele/agent-internet/.github/workflows/reusable-publish-authority-feed.yml@main
    with:
      install-command: |
        pip install --upgrade pip
        pip install -e .[dev]
      build-command: |
        python -m py_compile vibe_core/authority_exports.py vibe_core/authority_feed.py tests/unit/test_authority_exports.py tests/unit/test_authority_feed.py
        pytest -q tests/unit/test_authority_exports.py tests/unit/test_authority_feed.py
        python -m vibe_core.authority_feed --workspace . --output-dir .authority-feed-out
