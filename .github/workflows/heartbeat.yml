name: Heartbeat
true:
  schedule:
  - cron: 0 */6 * * *
  workflow_dispatch: null
  repository_dispatch:
    types:
    - heartbeat-trigger
permissions:
  contents: write
concurrency:
  group: heartbeat
  cancel-in-progress: false
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: 'pip install --upgrade pip

        pip install -e .[dev]

        '
    - name: Run heartbeat
      env:
        PYTHONUNBUFFERED: 1
      run: 'python scripts/heartbeat.py

        '
    - name: Write heartbeat payload
      run: 'mkdir -p data/federation

        echo ''[{"agent_id":"steward-protocol","operation":"heartbeat","source":"steward-protocol","status":"alive","role":"substrate"}]''
        > data/federation/nadi_outbox.json

        '
    - name: Push Changes
      if: success()
      run: "git config --global user.name \"STEWARD Heartbeat\"\ngit config --global\
        \ user.email \"heartbeat@steward-protocol.local\"\n\nif git diff --quiet &&\
        \ git diff --cached --quiet; then\n  echo \"No changes to push\"\nelse\n \
        \ git push origin ${GITHUB_REF#refs/heads/}\nfi\n"
    - name: Relay outbox to steward-federation hub
      if: always()
      env:
        GH_TOKEN: ${{ secrets.FEDERATION_PAT || secrets.GITHUB_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.FEDERATION_PAT || secrets.GITHUB_TOKEN }}
      run: "mkdir -p data/federation\nOUTBOX=\"data/federation/nadi_outbox.json\"\n\
        \nif [ ! -f \"$OUTBOX\" ]; then\n  echo \"[]\" > \"$OUTBOX\"\nfi\n\nif [ \"\
        $(cat \"$OUTBOX\" | tr -d '[:space:]')\" = \"[]\" ]; then\n  echo \"Outbox\
        \ empty, skipping relay\"\n  exit 0\nfi\n\ngit clone --depth=1 https://x-access-token:${GH_TOKEN}@github.com/kimeisele/steward-federation.git\
        \ /tmp/hub\n\nmkdir -p /tmp/hub/nadi\n\ncp \"$OUTBOX\" /tmp/hub/nadi/steward-protocol_to_steward.json\n\
        \ncd /tmp/hub\ngit config user.name \"federation-bot\"\ngit config user.email\
        \ \"bot@federation\"\ngit add nadi/steward-protocol_to_steward.json\ngit diff\
        \ --cached --quiet || git commit -m \"relay: steward-protocol outbox \u2192\
            max_retries=10
            count=0
            until git push origin main; do
              count=$((count+1))
              if [ $count -gt $max_retries ]; then
                echo "Push failed after $max_retries attempts"
                exit 1
              fi
              backoff=$(( (RANDOM % 15) + 2 ))
              echo "Race condition. Backoff ${backoff}s then rebase..."
              sleep $backoff
              git pull --rebase origin main
            done
  publish-authority-feed:
    name: Publish Authority Feed
    uses: kimeisele/agent-internet/.github/workflows/reusable-publish-authority-feed.yml@main
    with:
      install-command: 'pip install --upgrade pip

        pip install -e .[dev]

        '
      build-command: 'python -m py_compile vibe_core/authority_exports.py vibe_core/authority_feed.py
        vibe_core/source_authority_status.py tests/unit/test_authority_exports.py
        tests/unit/test_authority_feed.py tests/unit/test_source_authority_status.py

        pytest -q tests/unit/test_authority_exports.py tests/unit/test_authority_feed.py
        tests/unit/test_source_authority_status.py

        python -m vibe_core.authority_feed --workspace . --output-dir .authority-feed-out

        '
