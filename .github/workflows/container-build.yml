name: Container Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-containers:
    name: Build Vibe Containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Build all containers
        run: |
          chmod +x scripts/build_all_containers.sh
          ./scripts/build_all_containers.sh

      - name: Verify signatures
        run: |
          echo "Verifying container signatures..."
          for f in dist/plugins/*.vibe; do
            echo "Checking $f..."
            unzip -p "$f" SIGNATURE.sig | python -m json.tool > /dev/null && echo "  ✅ Valid signature" || echo "  ❌ Invalid"
          done

      - name: Upload containers
        uses: actions/upload-artifact@v4
        with:
          name: vibe-containers
          path: dist/plugins/*.vibe
          retention-days: 30
