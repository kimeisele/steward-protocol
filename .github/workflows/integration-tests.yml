name: Integration Tests

on:
  push:
    branches: [main, claude/*]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UV
        run: pip install uv

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Run Integration Tests
        run: |
          python -m pytest tests/integration/ -v --tb=short

      - name: Test Gateway Boot (Smoke Test)
        run: python scripts/ci/test_gateway_boot.py

      - name: Verify Governance Gate
        run: python scripts/ci/test_governance_gate.py

      - name: Verify Kernel Integrity
        run: python scripts/governance/verify_kernel.py --verify

      - name: Check Protected Files Changed
        if: github.event_name == 'pull_request'
        run: |
          changed=$(python scripts/governance/verify_kernel.py --check --json | jq -r '.changed | length')
          if [ "$changed" != "0" ]; then
            echo "::warning::Protected kernel files were modified. Requires SENIOR REVIEW."
            python scripts/governance/verify_kernel.py --check
          fi

      - name: Test Results
        if: always()
        run: |
          echo "Integration test suite completed"
