name: "Federation Receiver"

on:
  repository_dispatch:
    types: [city-report]

jobs:
  receive-city-report:
    name: "Receive City Report"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Write City Report
        run: |
          mkdir -p .vibe/state
          echo '${{ toJson(github.event.client_payload) }}' | python3 -m json.tool > .vibe/state/city_report.json
          echo "City report received at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat .vibe/state/city_report.json

      - name: Commit City Report
        run: |
          git config user.name "steward-protocol[bot]"
          git config user.email "noreply@steward-protocol.dev"
          git add .vibe/state/city_report.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "federation: receive city report (hb $(python3 -c "import json; d=json.load(open('.vibe/state/city_report.json')); print(d.get('heartbeat', '?'))"))"
            git push
          fi
