name: Manifest SUTRA Wiki

on:
  push:
    branches: [main]
    paths:
      - 'CONSTITUTION.md'
      - 'config/**'
      - 'vibe_core/plugins/opus_assistant/manas/cortex/sutra.py'
      - 'vibe_core/wiki_publisher.py'
      - 'scripts/build_wiki.py'
      - 'scripts/publish_wiki.py'
      - 'tests/unit/test_wiki_publisher.py'
      - '.github/workflows/manifest-sutra-wiki.yml'
  schedule:
    - cron: '31 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manifest-sutra-wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout steward-protocol
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dev dependencies
        run: ${{ steps.setup-python.outputs.python-path }} -m pip install -e ".[city,dev]"

      - name: Validate wiki publisher syntax
        run: |
          PYTHON="${{ steps.setup-python.outputs.python-path }}"
          "$PYTHON" -m py_compile \
            vibe_core/plugins/opus_assistant/manas/cortex/sutra.py \
            vibe_core/wiki_publisher.py \
            scripts/build_wiki.py \
            scripts/publish_wiki.py \
            tests/unit/test_wiki_publisher.py

      - name: Validate wiki publisher tests
        run: |
          PYTHON="${{ steps.setup-python.outputs.python-path }}"
          "$PYTHON" -m pytest -q tests/unit/test_wiki_publisher.py

      - name: Build manifested wiki
        run: |
          PYTHON="${{ steps.setup-python.outputs.python-path }}"
          "$PYTHON" scripts/build_wiki.py --output-dir .vibe/wiki-build-ci

      - name: Preflight wiki remote
        id: wiki-remote
        env:
          WIKI_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git
        run: |
          if git ls-remote "$WIKI_URL" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo '## Manifest SUTRA Wiki Publish Result' >> "$GITHUB_STEP_SUMMARY"
            echo 'Wiki remote is not materialized yet. Create the first GitHub wiki page once, then rerun this workflow.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure git identity
        if: steps.wiki-remote.outputs.ready == 'true'
        run: |
          git config --global user.name "sutra-bot"
          git config --global user.email "bot@steward-protocol"

      - name: Publish manifested wiki
        if: steps.wiki-remote.outputs.ready == 'true'
        env:
          WIKI_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git
        run: |
          "${{ steps.setup-python.outputs.python-path }}" scripts/publish_wiki.py --wiki-url "$WIKI_URL" --prune-generated --push --result-path .vibe/wiki-publish-result.json

      - name: Summarize publication result
        if: steps.wiki-remote.outputs.ready == 'true'
        run: |
          echo '## Manifest SUTRA Wiki Publish Result' >> "$GITHUB_STEP_SUMMARY"
          cat .vibe/wiki-publish-result.json >> "$GITHUB_STEP_SUMMARY"