name: "💓 Moltbook Agent Heartbeat"

on:
  # DISABLED: Moltbook agent moving to agent-city repo where it belongs.
  # steward-protocol = library/kernel, agent-city = runtime/agents.
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: moltbook-heartbeat
  cancel-in-progress: false

jobs:
  moltbook-heartbeat:
    name: "💓 Moltbook Agent"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -e .

      - name: Run Moltbook Agent
        env:
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FEDERATION_PAT: ${{ secrets.FEDERATION_PAT }}
          MOLTBOOK_OFFLINE_MODE: "False"
        run: |
          PYTHONPATH=. python3 agent-city/scripts/moltbook_heartbeat.py --cycles 4

      - name: Cleanup State Backups
        if: always()
        run: |
          # Keep only last 5 backups per type, delete older ones
          for dir in .vibe/state/*_backup/; do
            [ -d "$dir" ] || continue
            ls -t "$dir" | tail -n +6 | while read f; do rm -f "$dir$f"; done
          done

      - name: Persist State
        if: always()
        run: |
          git config user.name "steward-protocol[bot]"
          git config user.email "steward-protocol[bot]@users.noreply.github.com"
          # No -f: if .vibe/state files become gitignored later, that's an
          # explicit signal — workflows must never bypass ignore rules.
          # Same anti-pattern that re-leaked steward's private key (TICKET-009).
          git add .vibe/state/*.json .vibe/state/mahamantra/*.json .vibe/state/moltbook_activity_log 2>/dev/null || true
          # Also stage backup deletions
          git add -u .vibe/state/*_backup/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "state: persist moltbook agent state (heartbeat)"
            git pull --rebase origin main || true
            git push || true
          fi
