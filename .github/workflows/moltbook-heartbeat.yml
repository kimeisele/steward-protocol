name: "💓 Moltbook Agent Heartbeat"

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  moltbook-heartbeat:
    name: "💓 Moltbook Agent"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -e .

      - name: Run Moltbook Agent
        env:
          MOLTBOOK_API_KEY: ${{ secrets.MOLTBOOK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FEDERATION_PAT: ${{ secrets.FEDERATION_PAT }}
          MOLTBOOK_OFFLINE_MODE: "False"
        run: |
          PYTHONPATH=. python3 agent-city/scripts/moltbook_heartbeat.py --cycles 4

      - name: Persist State
        if: always()
        run: |
          git config user.name "steward-protocol[bot]"
          git config user.email "steward-protocol[bot]@users.noreply.github.com"
          git add -f .vibe/state/*.json .vibe/state/mahamantra/*.json .vibe/state/moltbook_activity_log 2>/dev/null || true
          git diff --cached --quiet || git commit -m "state: persist moltbook agent state (heartbeat)" && git push || true
