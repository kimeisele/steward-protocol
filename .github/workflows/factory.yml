name: Holon Factory

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-holons:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[crypto]"

    - name: Build ALL Plugin Containers
      run: |
        export PYTHONPATH=$PWD
        ./scripts/build_all_containers.sh

    - name: Verify Signatures (FAIL if unsigned)
      run: |
        FAILED=0
        for f in dist/plugins/*.vibe; do
          echo "Checking $f..."
          sig=$(unzip -p "$f" SIGNATURE.sig 2>/dev/null || echo "MISSING")
          if echo "$sig" | grep -q '"version": 2'; then
            echo "✅ ECDSA signed"
          else
            echo "❌ NOT ECDSA signed - BUILD WILL FAIL"
            FAILED=1
          fi
        done
        if [ $FAILED -eq 1 ]; then
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║  ❌ FATAL: Some containers are UNSIGNED                       ║"
          echo "║  This means ecdsa was not installed correctly.               ║"
          echo "║  Check the 'Install Dependencies' step.                      ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          exit 1
        fi

    - name: Upload Holons
      uses: actions/upload-artifact@v4
      with:
        name: holons
        path: dist/plugins/*.vibe
        retention-days: 30
