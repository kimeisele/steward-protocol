# Fly.io deployment config for steward-gateway
# See https://fly.io/docs/reference/configuration/

app = "steward-gateway"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  ENV = "production"
  GOVERNANCE_MODE = "SERVERLESS_BYPASS"
  PYTHONPATH = "/app"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
